// DAP : demande d'accord préalable (Sécurité sociale)
const estDAP = t => /demande d'?\s*accord prealable|accord prealable/.test(normText(t||'').replace(/’/g,"'"));
async function importerDAP(text, f){
  const nomF=esc(f.name||'capture');
  const P=patientsDansTexte(text);
  const c=P.length===1?P[0]:await choisirPatient(`🛡️ DAP « ${f.name||'capture'} » : à quel patient la rattacher ?`, P);
  if(!c) return `⚠️ ${nomF} : DAP non rattachée (aucun patient choisi).`;
  const m=normText(text||'').match(/(?:fait|etabli|date)[^0-9]{0,20}(\d{2})[\/.](\d{2})[\/.](\d{4})/), date=m?`${m[3]}-${m[2]}-${m[1]}`:'';
  const cible=state.consults.filter(x=>patientKey(x)===patientKey(c)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||c;
  const ajoute=await attacherDoc(cible, 'dap', f, date);
  // traitement demandé (OAM ou PPC) -> consultation mise à jour : traitement noté, statut « Terminé »
  const trait=traitementDAP(text), faits=[];
  if(trait){
    if(cible.traitement!==trait){ faits.push(cible.traitement?`traitement ${esc(cible.traitement)} → <b>${trait}</b>`:`traitement <b>${trait}</b>`); cible.traitement=trait; }
    if(trait==='PPC' && !cible.prestataire){ const p=prestataireDe(normText(text)); if(p){ cible.prestataire=p; faits.push(`prestataire ${esc(p)}`); } }
    if(cible.statut!=='termine'){ cible.statut='termine'; faits.push('statut <b>Terminé</b>'); }
    save();
  }
  const maj=trait?(faits.length?` — ${faits.join(', ')}`:` — ${trait} et « Terminé » déjà notés`):' — <i>ni OAM ni PPC reconnu dans le texte : traitement à vérifier</i>';
  return (ajoute?`🛡️ DAP ${trait?trait+' ':''}de <b>${esc(c.nom)} ${esc(c.prenom||'')}</b>${date?' du '+fmtDate(date):''} rangée dans ses documents`:`↩️ ${nomF} : DAP déjà rangée pour ${esc(c.nom)} ${esc(c.prenom||'')}`)+maj+'.';
}
// Traitement demandé dans une DAP : orthèse d'avancée mandibulaire (OAM) ou pression positive continue (PPC)
function traitementDAP(text){
  const n=normText(text||'');
  const oam=(n.match(/avancee mandibulaire|orthese d'?\s*avancee|orthese mandibulaire|\boam\b/g)||[]).length;
  const ppc=(n.match(/pression positive|\bppc\b|\bcpap\b|\bpcc\b|ventilation (?:nocturne|par pression)|appareil de ventilation/g)||[]).length;
  return oam>ppc?'OAM':ppc>oam?'PPC':''; // à égalité : on ne devine pas
}

// « Polysomnographie » -> PSG, « polygraphie (ventilatoire) » -> PG.
// L'intitulé de l'examen prime : un compte rendu de polygraphie qui conseille « une polysomnographie en complément » reste PG.
function typeAnalyse(text){
  const n=normText(text||'');
  const titrePSG=/(rapport|compte[\s-]*rendu|resultats?)[^\n]{0,40}polysomnographie|polysomnographie (nocturne|ventilatoire|du|de (la )?nuit|realisee)|\bpsg\b[^\n]{0,20}(du|realisee)/;
  const titrePG=/(rapport|compte[\s-]*rendu|resultats?)[^\n]{0,40}polygraphie|polygraphie (ventilatoire|nocturne|respiratoire)/;
  if(titrePSG.test(n)) return 'PSG';
  if(titrePG.test(n)) return 'PG';
  if(/polysomnographie/.test(n) && !/polygraphie/.test(n)) return 'PSG';
  if(/polygraphie/.test(n)) return 'PG';
  return '';
}
// Bandeau « RÉSULTATS » (IAH 54,4 ▶ Sévère ◀ IDO 47,1) lu sur une capture : sigles souvent déformés (« Tan 54,4 », « 1D0 47,1 »)
function iahBandeau(t){
  const n=(t||'').replace(/\n/g,'  ');
  const a=n.match(/(?:^|[^a-z0-9])[il1|t][a4][hn]\s*:?\s*(\d{1,3}[.,]\d{1,2})(?!\d)/i), o=n.match(/(?:^|[^a-z0-9])[il1|][dD][o0O]\s*:?\s*(\d{1,3}[.,]\d{1,2})(?!\d)/);
  return {iah:a?a[1].replace(',','.'):null, ido:o?o[1].replace(',','.'):null};
}
// Polygraphie : valeurs reportées dans la consultation + compte rendu (PDF) attaché pour l'aperçu
async function importerPoly(text, f, lien){
  // capture d'écran sans IAH lisible : relecture agrandie en niveaux de gris
  if(isImage(f) && !estCRMaison(text) && !parsePolygraphie(text).iah){
    try{ const t2=(await ocrDetail(f,()=>{},false,2)).texte, b=iahBandeau(t2), p2=parsePolygraphie(t2);
      const iah=p2.iah||b.iah, ido=p2.ido||b.ido;
      if(iah) text=text+`\nIAH : ${iah}\n`+(ido?`IDO : ${ido}\n`:'')+t2; }catch(e){ console.error(e); }
  }
  const maison=estCRMaison(text), r=maison?parseCRMaison(text):parsePolygraphie(text);
  let msg;
  if(r.nom && !r.iah){
    // IAH global non écrit dans le compte rendu : on rattache quand même le document au patient
    let c=correspondanceNox({...r, iahNox:''}) || (!r.date ? rowsOf(r).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0] : null);
    if(!c){ c={id:uid(), date:r.date||'', nom:r.nom, prenom:r.prenom, iah:'', info:'', statut:'cr', traitement:'', prestataire:'', commentaire:''}; state.consults.push(c); }
    if(r.date) c.date=r.date; // la date du compte rendu fait foi
    if((c.statut||'rien')==='rien') c.statut='cr';
    if(!c.analyse) c.analyse='PG';
    if(!c.poly && [r.ido,r.iahDorsal,r.iahNonDorsal,r.t90].some(Boolean)) c.poly={date:r.date, ido:r.ido, iahDorsal:r.iahDorsal, iahNonDorsal:r.iahNonDorsal, t90:r.t90, spo2min:r.spo2min};
    r.cid=c.id; msg=`✅ Compte rendu de <b>${esc(r.nom)} ${esc(r.prenom)}</b>${r.date?' du '+fmtDate(r.date):''} : IAH global non trouvé dans le texte, à saisir.`;
  } else msg=applyPoly(r, f.name||'capture');
  // Type d'analyse d'après le contenu du compte rendu : polysomnographie -> PSG, polygraphie ventilatoire -> PG
  const an=typeAnalyse(text);
  if(r.cid && an){ const c=state.consults.find(x=>x.id===r.cid); if(c){ c.analyse=an; msg+=` · analyse : ${LIB_ANALYSE[an]}`; } }
  if(an==='PSG') msg=msg.replace(/Polygraphie de/,'Polysomnographie de');
  if(r.cid && (r.nir||r.ddn)){ const c=state.consults.find(x=>x.id===r.cid), o=rdvInfo(patientKey(c)); if(r.nir && !o.nir) o.nir=r.nir; if(r.ddn && !o.ddn) o.ddn=r.ddn; }
  save();
  if(r.cid && isPdf(f)){
    const c=state.consults.find(x=>x.id===r.cid);
    if(c && await attacherCR(c, f, lien)) msg+=' 📄 compte rendu attaché';
  }
  return msg;
}
function applyPoly(r, fname){
  const who=`${esc(r.nom)} ${esc(r.prenom)}`;
  if(!r.nom) return `⚠️ ${esc(fname)} : nom du patient introuvable dans la polygraphie.`;
  if(!r.iah) return `⚠️ ${esc(fname)} : IAH introuvable pour ${who}.`;
  const rows=rowsOf(r);
  // Le compte rendu fait foi : son IAH et sa date remplacent ceux du tableau
  const deja=rows.find(c=>c.poly && c.poly.date===r.date);
  if(deja){ r.cid=deja.id; const corr=num(deja.iah)!==num(r.iah)||(r.date&&deja.date!==r.date); deja.iah=r.iah; if(r.date) deja.date=r.date;
    return corr?`✅ Polygraphie de <b>${who}</b> du ${fmtDate(r.date)} déjà importée : IAH et date repris du compte rendu (IAH ${esc(r.iah)}/h).`:`↩️ Polygraphie de ${who} du ${fmtDate(r.date)} déjà importée.`; }
  // Même examen déjà dans le tableau (même IAH, même date, ligne sans IAH ou sans date, ou datée à moins de 3 mois) : complété ;
  // sinon (patient jamais vu, ou examen plus ancien) : nouvelle ligne
  let c=correspondanceNox({...r, iahNox:r.iah}) || (!r.date ? rows.filter(c=>!c.iah).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0] : null), cree=false;
  if(!c){ c={id:uid(), date:r.date||today(), nom:r.nom, prenom:r.prenom, iah:'', info:'', statut:'rien', traitement:'', prestataire:'', commentaire:''}; state.consults.push(c); cree=true; }
  c.iah=r.iah; r.cid=c.id;
  if(r.date) c.date=r.date;
  c.poly={date:r.date, ido:r.ido, iahDorsal:r.iahDorsal, iahNonDorsal:r.iahNonDorsal, t90:r.t90, spo2min:r.spo2min};
  if(!c.analyse) c.analyse='PG'; // compte rendu de polygraphie
  if((c.statut||'rien')==='rien') c.statut='cr';
  return `✅ Polygraphie de <b>${who}</b> du ${fmtDate(r.date)} : IAH ${esc(r.iah)}/h → ${cree?'nouvelle ligne créée':'consultation existante complétée'}.`;
}
function applyObs(r, fname, creer=true){
  const who=`${esc(r.nom)} ${esc(r.prenom)}`;
  if(!r.nom) return `⚠️ ${esc(fname)} : nom du patient introuvable. Ouvrez sa fiche PPC et importez-y le rapport.`;
  if(!['iahRes','obs','p95','fuites','fuitesP95'].some(k=>r[k])) return `⚠️ ${esc(fname)} (${who}) : aucune valeur reconnue.`;
  let rows=rowsOf(r).sort((a,b)=>(b.date||'').localeCompare(a.date||'')), cree=false;
  if(!rows.length){
    if(!creer) return `❔ ${who} : patient absent du tableau des consultations (ignoré).`;
    rows=[{id:uid(), date:'', nom:r.nom, prenom:r.prenom, iah:'', statut:'rien', traitement:'PPC', prestataire:r.prestataire||''}]; state.consults.push(rows[0]); cree=true;
  }
  const c=rows[0]; r.cid=c.id;
  if(!c.traitement) c.traitement='PPC';
  if(c.traitement==='PPC' && !c.prestataire && r.prestataire) c.prestataire=r.prestataire;
  const key=patientKey(c), list=state.ppc[key]=state.ppc[key]||[];
  // même date ET mêmes valeurs = déjà importé (un rapport de 6 mois et celui d'une nuit peuvent avoir la même date)
  if(list.some(x=>x.date===r.date && (x.obs||'')===(r.obs||'') && (x.iahRes||'')===(r.iahRes||''))) return `↩️ Suivi PPC de ${who} au ${fmtDate(r.date)} déjà importé.`;
  if(r.uneNuit) r.com=['Rapport d\'une seule nuit', r.com].filter(Boolean).join(' — ');
  list.push({id:uid(), date:r.date||today(), iahRes:r.iahRes||'', obs:r.obs||'', obsPct:r.obsPct||'', p95:r.p95||'', pPct:r.pPct||95,
             fuites:r.fuites||'', fuitesP95:r.fuitesP95||'', fPct:r.fPct||95, commentaire:r.com||''});
  const p=v=>esc(v||'?');
  return `✅ Suivi PPC de <b>${who}</b> au ${fmtDate(r.date)} : IAH résiduel ${p(r.iahRes)}, observance ${p(r.obs)}${r.p95?`, ${r.pPct==90?'P90':'P95'} ${p(r.p95)}`:''}${r.fuites||r.fuitesP95?`, fuites ${p(r.fuites)}${r.fuitesP95?` (${r.fPct==90?'90e':'95e'} c. ${p(r.fuitesP95)})`:''}`:''}`
    +`${cree?' — <i>patient absent du tableau : ligne créée, date de consultation à compléter</i>':''} · <a href="#fiche/${esc(encodeURIComponent(key))}">voir la fiche</a>`;
}
function applyListePPC(liste, fname){
  if(!liste.length) return [`⚠️ ${esc(fname)} : aucun patient reconnu dans la liste.`];
  return liste.map(r=>applyObs(r, fname, false));
}

// Fenêtre « Restaurer » : la dernière sauvegarde du dossier (souvent faite sur l'autre ordinateur), ou un autre fichier
function fenetreRestaurer(h, der, fichier){
  const d=der.data, quand=d.modifie?new Date(d.modifie):null, ici=state.consults.length, ma=state.modifie?new Date(state.modifie):null;
  const plusRecente=(d.modifie||0)>(state.modifie||0)+1000;
  const fond=document.createElement('div'); fond.className='cr-modal';
  fond.innerHTML=`<div class="cr-boite" style="width:min(560px,100%)">
    <div class="toolbar" style="margin:0 0 8px"><b>📂 Restaurer</b><div class="spacer"></div><button class="small" id="rs-fermer">✕ Fermer</button></div>
    <p style="margin-top:0">Dernière sauvegarde dans <b>📁 ${esc(h.name)}</b> :<br><b>${esc(der.nom)}</b> — ${(d.consults||[]).length} consultations${quand?`, modifiée le ${quand.toLocaleDateString('fr-FR')} à ${quand.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`:''}.</p>
    <p class="hint">Sur cet ordinateur : ${ici} consultations${ma?`, modifiées le ${ma.toLocaleDateString('fr-FR')} à ${ma.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`:''}.
      ${plusRecente?'<b style="color:var(--ok,#2b8a3e)">La sauvegarde est plus récente.</b>':'<b style="color:#e8590c">Attention : les données de cet ordinateur sont aussi récentes ou plus récentes que cette sauvegarde.</b>'}</p>
    <div class="toolbar" style="margin:12px 0 0;gap:8px"><button class="primary" id="rs-ok">Restaurer cette version</button><button id="rs-autre">Choisir un autre fichier…</button></div></div>`;
  document.body.appendChild(fond);
  const fermer=()=>fond.remove(); fond.onclick=e=>{ if(e.target===fond) fermer(); }; fond.querySelector('#rs-fermer').onclick=fermer;
  fond.querySelector('#rs-autre').onclick=()=>{ fermer(); fichier(); };
  fond.querySelector('#rs-ok').onclick=()=>{
    if(!plusRecente && !confirm('Les données de cet ordinateur sont aussi récentes ou plus récentes. Les remplacer quand même par cette sauvegarde ?')) return;
    reprendreSauvegarde(d); fermer(); toast(`📂 Version du ${quand?quand.toLocaleDateString('fr-FR'):der.nom} restaurée ✔`); };
}
document.getElementById('file-import').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const s=JSON.parse(await f.text());
    if(!Array.isArray(s.consults)) throw 0;
    if(!confirm(`Restaurer cette sauvegarde (${s.consults.length} consultations) ? Les données actuelles seront remplacées.`)) return;
    state=migrer({consults:s.consults, ppc:s.ppc||{}, oam:s.oam||{}, complexes:s.complexes||{}, distincts:s.distincts||[], reglages:s.reglages||{}, rdv:s.rdv||{}, modifie:s.modifie||0}); save(); render(); toast('Sauvegarde restaurée ✔');
  }catch(_){ alert('Fichier de sauvegarde invalide.'); }
  e.target.value='';
};
/* ============ Export Excel (.xlsx) mis en forme : Consultations · Patients PPC · Synthèse ============ */
const EXCELJS_URL='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
async function exportExcel(){
  const b=document.getElementById('btn-csv'), lib=b.textContent; b.disabled=true; b.textContent='⏳ Préparation…';
  try{
    if(!window.ExcelJS) await loadScript(EXCELJS_URL);
    const buf=await (await construireClasseur()).xlsx.writeBuffer();
    download(`Suivi sommeil ${today()}.xlsx`, buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('📊 Fichier Excel enregistré dans vos téléchargements');
  }catch(e){ console.error(e); toast('Excel indisponible (connexion ?) : export CSV à la place'); exportCSV(); }
  finally{ b.disabled=false; b.textContent=lib; }
}
async function construireClasseur(){
  const wb=new ExcelJS.Workbook(); wb.creator='Suivi sommeil'; wb.created=new Date();
  const argb=h=>'FF'+h.replace('#','').toUpperCase();
  const clair=(h,t=.84)=>{ const n=parseInt(h.slice(1),16), m=c=>Math.round(c+(255-c)*t).toString(16).padStart(2,'0'); return '#'+m(n>>16)+m(n>>8&255)+m(n&255); };
  const fond=h=>({type:'pattern',pattern:'solid',fgColor:{argb:argb(h)}});
  const trait={style:'thin',color:{argb:'FFDDE2EC'}}, bord={top:trait,bottom:trait,left:trait,right:trait};
  const dateX=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))):(d==='fait'?'fait':null);
  const nb=v=>{ const n=num(v); return n==null?(v||null):n; };
  const lab=v=>(STATUTS.find(s=>s.v===(v||'rien'))||{}).label;
  const COUL_STATUT={rien:'#8a8f9c', cr:'#7a55c9', termine:'#1f8a4c'};
  const maintenant=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  // Feuille générique : bandeau de titre, sous-titre, en-têtes colorés figés, lignes alternées, filtres, mise en page d'impression
  const feuille=(nom, titre, sousTitre, cols, lignes, styleLigne, couleur='#3b5bdb')=>{
    const ws=wb.addWorksheet(nom,{properties:{tabColor:{argb:argb(couleur)}}, views:[{state:'frozen',ySplit:4,showGridLines:false}],
      pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:'4:4',margins:{left:.35,right:.35,top:.5,bottom:.55,header:.25,footer:.25}},
      headerFooter:{oddFooter:`&L&8${titre}&R&8Page &P / &N`}});
    ws.columns=cols.map(c=>({key:c.k,width:c.w}));
    const n=cols.length;
    ws.mergeCells(1,1,1,n); Object.assign(ws.getCell(1,1),{value:titre}); const t=ws.getCell(1,1);
    t.font={name:'Calibri',size:16,bold:true,color:{argb:'FFFFFFFF'}}; t.fill=fond('#1f3a6e'); t.alignment={vertical:'middle',indent:1}; ws.getRow(1).height=32;
    ws.mergeCells(2,1,2,n); const st=ws.getCell(2,1); st.value=sousTitre; st.font={italic:true,size:10,color:{argb:'FF5B6475'}}; st.alignment={vertical:'middle',indent:1}; ws.getRow(2).height=20;
    ws.getRow(3).height=6;
    const h=ws.getRow(4); h.height=32;
    cols.forEach((c,i)=>{ const x=h.getCell(i+1); x.value=c.t; x.font={bold:true,size:10,color:{argb:'FFFFFFFF'}}; x.fill=fond(couleur); x.border=bord; x.alignment={vertical:'middle',horizontal:'center',wrapText:true}; });
    lignes.forEach((l,j)=>{
      const row=ws.addRow(cols.map(c=>l[c.k]===''||l[c.k]===undefined?null:l[c.k])); row.height=l._haut||18;
      cols.forEach((c,i)=>{ const x=row.getCell(i+1); x.border=bord; x.font={size:10,...(c.gras?{bold:true}:{})};
        x.alignment={vertical:'middle',horizontal:c.al||'left',wrapText:!!c.wrap,indent:c.al?0:1}; if(c.fmt) x.numFmt=c.fmt; if(j%2) x.fill=fond('#F5F7FB'); });
      if(styleLigne) styleLigne(row,l);
    });
    if(lignes.length) ws.autoFilter={from:{row:4,column:1},to:{row:4+lignes.length,column:n}};
    return ws;
  };
  const colIdx=(cols,k)=>cols.findIndex(c=>c.k===k)+1;
  const marquerIAH=(cell,v)=>{ const n=num(v); if(n==null) return; if(n>30){ cell.font={size:10,bold:true,color:{argb:'FFC0352B'}}; cell.fill=fond('#FBE5E3'); } else if(n>15) cell.font={size:10,bold:true,color:{argb:'FFB26A00'}}; };
  const marquerPresta=(cell,p)=>{ if(!p) return; const c=couleurPresta(p); cell.font={size:10,bold:true,color:{argb:argb(c)}}; cell.fill=fond(clair(c,.86)); };

  // ---------- 1. Consultations ----------
  const cs=state.consults.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const C=[{k:'date',t:'Date',w:11,fmt:'dd/mm/yyyy',al:'center'},{k:'mois',t:'Mois',w:14},{k:'nom',t:'Nom',w:22,gras:true},{k:'prenom',t:'Prénom',w:16},
    {k:'iah',t:'IAH',w:7,fmt:'0.0',al:'center'},{k:'sev',t:'Sévérité',w:10,al:'center'},{k:'analyse',t:'Analyse',w:10,al:'center'},{k:'contact',t:'Contact',w:11,al:'center'},
    {k:'statut',t:'Statut',w:12,al:'center'},{k:'trait',t:'Traitement',w:14,al:'center'},{k:'presta',t:'Prestataire',w:14,al:'center'},{k:'dexam',t:'Date examen',w:11,fmt:'dd/mm/yyyy',al:'center'},
    {k:'ido',t:'IDO',w:7,fmt:'0.0',al:'center'},{k:'iahRes',t:'IAH sous PPC',w:9,fmt:'0.0',al:'center'},{k:'obs',t:'Observance',w:10,al:'center'},{k:'adr',t:'Médecin adresseur',w:24},{k:'com',t:'Commentaire',w:40,wrap:true}];
  const lc=cs.map(c=>{ const s=c.traitement==='PPC'?suivis(patientKey(c)):[], l=s[s.length-1]||{}, sv=severity(c.iah);
    return {date:dateX(c.date), mois:c.date?nomMois(c.date.slice(0,7)):'', nom:c.nom, prenom:c.prenom, iah:nb(c.iah), sev:sv?sv.label:'', analyse:LIB_ANALYSE[c.analyse]||'',
      contact:c.info==='Appel'?'Téléphone':(c.info||''), statut:lab(c.statut), _st:c.statut||'rien', trait:c.traitement||'', presta:c.traitement==='PPC'?(c.prestataire||''):'',
      dexam:dateX(c.poly&&c.poly.date), ido:nb(c.poly&&c.poly.ido), iahRes:nb(l.iahRes), obs:l.obs||'', adr:c.adresseur||'', com:c.commentaire||'', _an:c.analyse, _haut:(c.commentaire||'').length>60?30:18}; });
  feuille('Consultations', 'Suivi des consultations sommeil', `Export du ${maintenant} · ${cs.length} consultations · ${cs.filter(c=>c.analyse==='PSG').length} Somnum · ${cs.filter(c=>c.traitement==='PPC').length} sous PPC`, C, lc, (row,l)=>{
    marquerIAH(row.getCell(colIdx(C,'iah')), l.iah);
    const sv=row.getCell(colIdx(C,'sev')); if(l.sev) sv.font={size:10,color:{argb:argb({Sévère:'#C0352B',Modéré:'#B26A00',Léger:'#5D7A12',Normal:'#1F8A4C'}[l.sev]||'#5B6475')}};
    const st=row.getCell(colIdx(C,'statut')), cst=COUL_STATUT[l._st]||'#8a8f9c'; st.font={size:10,bold:true,color:{argb:argb(cst)}}; st.fill=fond(clair(cst,.85));
    const an=row.getCell(colIdx(C,'analyse')); if(l._an) an.font={size:10,bold:true,color:{argb:argb(COULEUR_ANALYSE[l._an])}};
    marquerPresta(row.getCell(colIdx(C,'presta')), l.presta);
    if(!l.contact && (l._st==='cr'||l._st==='termine') && l.trait!=='PPC' && l.trait!=='OAM'){ const ct=row.getCell(colIdx(C,'contact')); ct.value='À informer'; ct.font={size:10,bold:true,color:{argb:'FFE8590C'}}; }
  });

  // ---------- 2. Patients PPC ----------
  const P=[{k:'nom',t:'Nom',w:22,gras:true},{k:'prenom',t:'Prénom',w:16},{k:'presta',t:'Prestataire',w:14,al:'center'},{k:'iah',t:'IAH initial',w:9,fmt:'0.0',al:'center'},{k:'analyse',t:'Analyse',w:10,al:'center'},
    {k:'annonce',t:'Consult. d\'annonce',w:12,fmt:'dd/mm/yyyy',al:'center'},{k:'s4',t:'Suivi 4 mois',w:12,fmt:'dd/mm/yyyy',al:'center'},{k:'san',t:'Suivi annuel',w:12,fmt:'dd/mm/yyyy',al:'center'},
    {k:'fin',t:'Fin de prescription',w:13,fmt:'dd/mm/yyyy',al:'center'},{k:'drap',t:'Dernier rapport',w:12,fmt:'dd/mm/yyyy',al:'center'},{k:'iahRes',t:'IAH résiduel',w:9,fmt:'0.0',al:'center'},
    {k:'obs',t:'Observance',w:10,al:'center'},{k:'p95',t:'P95 (cmH₂O)',w:9,fmt:'0.0',al:'center'},{k:'fuites',t:'Fuites (L/min)',w:9,fmt:'0.0',al:'center'},{k:'tel',t:'Téléphone',w:15},{k:'nir',t:'N° de sécurité sociale',w:22}];
  const lp=ppcPatients().map(p=>{ const s=suivis(p.key), l=s[s.length-1]||{}, o=(state.rdv||{})[p.key]||{};
    return {nom:p.nom, prenom:p.prenom, presta:p.prestataire||'', iah:nb(p.iah), analyse:LIB_ANALYSE[p.analyse]||'', _an:p.analyse, annonce:dateX(o.annonce), s4:dateX(o.suivi4), san:dateX(o.suiviAn),
      fin:dateX(o.finPrescr), _fin:o.finPrescr||'', drap:dateX(l.date), iahRes:nb(l.iahRes), obs:l.obs||'', p95:nb(l.p95), fuites:nb(l.fuites), tel:o.tel||'', nir:o.nir?fmtNir(o.nir):''}; });
  feuille('Patients PPC', 'Patients sous PPC', `Export du ${maintenant} · ${lp.length} patients`, P, lp, (row,l)=>{
    marquerPresta(row.getCell(colIdx(P,'presta')), l.presta);
    const an=row.getCell(colIdx(P,'analyse')); if(l._an) an.font={size:10,bold:true,color:{argb:argb(COULEUR_ANALYSE[l._an])}};
    const r=row.getCell(colIdx(P,'iahRes')), n=num(l.iahRes); if(n!=null) r.font={size:10,bold:true,color:{argb:n<5?'FF1F8A4C':n<10?'FFB26A00':'FFC0352B'}};
    const f=row.getCell(colIdx(P,'fin')); if(/^\d{4}/.test(l._fin)){ if(l._fin<today()){ f.font={size:10,bold:true,color:{argb:'FFC0352B'}}; f.fill=fond('#FBE5E3'); } else if(l._fin<=plusMois(today(),1)) f.font={size:10,bold:true,color:{argb:'FFB26A00'}}; }
    for(const k of ['annonce','s4','san']){ const x=row.getCell(colIdx(P,k)); if(x.value==='fait'){ x.value='✓ fait'; x.font={size:10,color:{argb:'FF1F8A4C'}}; } else if(!x.value){ x.value='—'; x.font={size:10,color:{argb:'FFA0A6B3'}}; } }
  }, '#2e8b3e');

  // ---------- 3. Synthèse mensuelle ----------
  const parMois=new Map();
  for(const c of state.consults){ const m=(c.date||'').slice(0,7)||'sans'; if(!parMois.has(m)) parMois.set(m,[]); parMois.get(m).push(c); }
  const S=[{k:'mois',t:'Mois',w:18,gras:true},{k:'n',t:'Consultations',w:13,al:'center'},{k:'pmb',t:'PMB',w:9,al:'center'},{k:'somnum',t:'Somnum',w:9,al:'center'},{k:'iah30',t:'IAH > 30',w:9,al:'center'},
    {k:'ppc',t:'Mis sous PPC',w:11,al:'center'},{k:'oam',t:'OAM',w:8,al:'center'},{k:'eurPmb',t:'Montant PMB',w:13,fmt:'#,##0 "€"',al:'right'},{k:'eurSom',t:'Montant Somnum',w:14,fmt:'#,##0 "€"',al:'right'},{k:'eur',t:'Total',w:13,fmt:'#,##0 "€"',al:'right',gras:true}];
  const ligneS=(lib,l)=>{ const pmb=l.filter(c=>compteEn(c)==='PG').length, som=l.length-pmb;
    return {mois:lib, n:l.length, pmb, somnum:som, iah30:l.filter(c=>num(c.iah)>30).length, ppc:l.filter(c=>c.traitement==='PPC').length, oam:l.filter(c=>c.traitement==='OAM').length,
      eurPmb:pmb*tarif('PG'), eurSom:som*tarif('PSG'), eur:pmb*tarif('PG')+som*tarif('PSG')}; };
  // mois du plus récent au plus ancien, un total par année ; les consultations sans date à la fin
  const ls=[]; let anCourant=null, cumul=[];
  for(const m of [...parMois.keys()].filter(m=>m!=='sans').sort().reverse()){
    const an=m.slice(0,4);
    if(anCourant && an!==anCourant){ ls.push({...ligneS(`Total ${anCourant}`,cumul), _total:true}); cumul=[]; }
    anCourant=an; cumul=cumul.concat(parMois.get(m)); ls.push(ligneS(nomMois(m), parMois.get(m)));
  }
  if(anCourant) ls.push({...ligneS(`Total ${anCourant}`,cumul), _total:true});
  if(parMois.has('sans')) ls.push(ligneS('Sans date', parMois.get('sans')));
  feuille('Synthèse', 'Synthèse mensuelle et comptabilité', `Export du ${maintenant} · tarifs : PMB ${euros(tarif('PG'))}, Somnum ${euros(tarif('PSG'))}`, S, ls, (row,l)=>{
    if(l._total) row.eachCell(x=>{ x.font={size:10,bold:true,color:{argb:'FF1F3A6E'}}; x.fill=fond('#E8EEFC'); x.border={...bord,top:{style:'medium',color:{argb:'FF3B5BDB'}}}; });
  }, '#7048e8');
  return wb;
}
// Export CSV (secours, sans mise en forme)
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lab=v=>(STATUTS.find(s=>s.v===(v||'rien'))||{}).label;
  const lines=[['Date','Nom','Prénom','IAH','Contact avec le patient','Statut','Traitement','Prestataire','Commentaire','Dernier IAH résiduel','Dernière observance','Dernière P95','Dernières fuites moy./méd.','Dernières fuites 95e c.','Date polygraphie','IDO'].map(q).join(';')];
  state.consults.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(c=>{
    const s=suivis(patientKey(c)), l=c.traitement==='PPC'?(s[s.length-1]||{}):{};
    lines.push([fmtDate(c.date),c.nom,c.prenom,c.iah,c.info||'',lab(c.statut),c.traitement,c.traitement==='PPC'?c.prestataire:'',c.commentaire,l.iahRes,l.obs,l.p95,l.fuites,l.fuitesP95,fmtDate(c.poly&&c.poly.date),c.poly&&c.poly.ido].map(q).join(';'));
  });
  download(`consultations_sommeil_${today()}.csv`, '﻿'+lines.join('\r\n'), 'text/csv');
}
document.getElementById('btn-csv').onclick=exportExcel;

/* ============ Vers Google Sheet : lignes copiées à coller dans le tableau du Drive ============ */
// Colonnes du Sheet : C Etat (OK) · D Nom (NOM Prénom) · E IAH · F Action (PPC / OAM / vide) · G Prestataire · H Commentaire (vide) · I Médecin adresseur · J Date de l'examen.
// Rien n'est envoyé : les lignes passent par le presse-papiers, vous les collez vous-même (cellule C de la première ligne vide).
const SHEET_COLS=[['C','Etat'],['D','Nom'],['E','IAH'],['F','Action'],['G','Prestataire'],['H','Commentaire'],['I','Médecin adresseur'],['J','Date']];
function ligneSheet(c){
  const d=dateExamen(c), trait=c.traitement==='PPC'||c.traitement==='OAM'?c.traitement:'';
  return ['OK', `${(c.nom||'').toUpperCase()} ${capName(c.prenom||'')}`.trim(), String(c.iah||'').trim(), trait, trait==='PPC'?(c.prestataire||''):'', '',
    /^[-–—]$/.test((c.adresseur||'').trim())?'':(c.adresseur||''), /^\d{4}-\d{2}-\d{2}$/.test(d)?fmtDate(d):''];
}
function fenetreVersSheet(){
  const tous=state.consults.filter(c=>c.nom && String(c.iah||'').trim()).sort((a,b)=>(dateExamen(a)||'').localeCompare(dateExamen(b)||''));
  const fond=document.createElement('div'); fond.className='cr-modal';
  fond.innerHTML=`<div class="cr-boite" style="width:min(940px,100%)">
    <div class="toolbar" style="margin:0 0 8px"><b>📗 Copier vers votre Google Sheet</b><div class="spacer"></div><button class="small" id="gs-fermer">✕ Fermer</button></div>
    <div class="toolbar" style="margin:0 0 8px;gap:12px;flex-wrap:wrap">
      <label>Examens du <input type="date" id="gs-du"></label><label>au <input type="date" id="gs-au"></label>
      <label><input type="checkbox" id="gs-nouv" checked> Seulement ceux pas encore copiés</label>
      <span class="hint" id="gs-compte"></span>
    </div>
    <div class="tablewrap" style="max-height:340px;overflow:auto"><table class="table-af"><thead><tr><th><input type="checkbox" id="gs-tous" checked></th>
      ${SHEET_COLS.map(([l,t])=>`<th title="Colonne ${l} du Sheet"><span class="hint">${l}</span> ${esc(t)}</th>`).join('')}<th>Déjà copié</th></tr></thead><tbody id="gs-corps"></tbody></table></div>
    <div class="toolbar" style="margin:10px 0 0;gap:8px;flex-wrap:wrap">
      <button class="primary" id="gs-copier">📋 Copier les lignes cochées (<span id="gs-n">0</span>)</button>
      <button class="small" id="gs-marquer" title="Pour les examens déjà présents dans votre Sheet : ils ne seront plus proposés">✔ Marquer comme déjà dans le Sheet</button>
      <button class="small" id="gs-demarquer" title="Les proposer à nouveau">↺ Retirer la marque</button>
    </div>
    <ol style="margin:12px 0 0 0;padding-left:20px;line-height:1.6">
      <li>Cochez les examens puis cliquez sur <b>Copier</b>.</li>
      <li>Dans votre Google Sheet, cliquez sur la <b>cellule de la colonne C</b> (Etat) de la première ligne vide, puis <b>Ctrl+V</b>. Les colonnes C à J se remplissent (Mois et colonnes A–B ne sont pas touchées ; Commentaire reste vide).</li>
    </ol>
    <p class="hint" style="margin-bottom:0">🔒 Les lignes passent uniquement par votre presse-papiers : rien n'est envoyé par Suivi sommeil. Les examens copiés sont marqués pour ne pas être proposés deux fois.</p>
  </div>`;
  document.body.appendChild(fond);
  const q=s=>fond.querySelector(s), fermer=()=>fond.remove();
  fond.onclick=e=>{ if(e.target===fond) fermer(); }; q('#gs-fermer').onclick=fermer;
  let vis=[];
  const coches=()=>[...fond.querySelectorAll('.gs-cb')].filter(x=>x.checked).map(x=>vis[+x.dataset.i]);
  const maj=()=>{ q('#gs-n').textContent=coches().length; };
  const remplir=()=>{
    const du=q('#gs-du').value, au=q('#gs-au').value, nouv=q('#gs-nouv').checked;

/* ============ Dossier des comptes rendus : import automatique (chaque semaine) ============ */
// Le dossier est choisi une fois (ex. « G:\Mon Drive\…\CR Nox ») ; son accès est mémorisé dans ce navigateur.
// À l'ouverture de la page, si la dernière vérification date de plus de 7 jours, les nouveaux PDF sont lus et intégrés.
// Chaque fichier n'est lu qu'une fois (repéré par son chemin, sa taille et sa date de modification).
const DOSSIER_JOURS=7, CR_MAX_DEFAUT=10; // à chaque vérification : seulement les 10 nouveaux CR les plus récents (0 = tous)
const dossierCR = () => state.reglages && state.reglages.dossierCR || {};
const dossierPossible = () => typeof window.showDirectoryPicker==='function';
async function choisirDossierCR(){
  if(!dossierPossible()){ toast('Ouvrez ce fichier dans Chrome ou Edge pour choisir un dossier'); return; }
  let h; try{ h=await window.showDirectoryPicker({id:'crNox', mode:'read'}); }catch(e){ return; } // fenêtre fermée
  await DocsCR.put('dossierCR', h);
  // Premier passage : tout l'historique, ou seulement les comptes rendus à venir
  toast('Comptage des comptes rendus du dossier…');
  const deja=[]; try{ for await (const x of pdfsDuDossier(h)){ const f=await x.e.getFile(); deja.push(x.chemin+'|'+f.size+'|'+f.lastModified); } }catch(e){ console.error(e); }
  const tout=deja.length && confirm(`Le dossier « ${h.name} » contient déjà ${deja.length} PDF.\n\nOK : les intégrer tous maintenant (comptez environ ${Math.max(1,Math.round(deja.length/60))} min, page ouverte ; les patients absents du tableau seront ajoutés).\nAnnuler : ne rien reprendre de l'existant, seulement les comptes rendus ajoutés à partir d'aujourd'hui.`);
  const vus={}; if(!tout) deja.forEach(k=>vus[k]=today());
  state.reglages={...(state.reglages||{}), dossierCR:{nom:h.name, choisi:today(), derniere:tout?'':new Date().toISOString(), vus}}; save();
  toast(`📁 Dossier « ${h.name} » mémorisé${tout?' : intégration en cours…':' : vérification chaque semaine'}`);
  if(tout) verifierDossierCR(true); else render();
}
// Tous les PDF du dossier et de ses sous-dossiers
async function* pdfsDuDossier(dir, chemin=''){
  for await (const [nom, e] of dir.entries()){
    if(e.kind==='directory') yield* pdfsDuDossier(e, chemin+nom+'/');
    else if(/\.pdf$/i.test(nom)) yield {e, chemin:chemin+nom};
  }
}
async function verifierDossierCR(parUtilisateur=false){
  if(importLog && !importLog.done) return;
  let h; try{ h=await DocsCR.get('dossierCR'); }catch(e){}
  if(!h){ if(parUtilisateur) choisirDossierCR(); return; }
  // l'accès doit parfois être reconfirmé (une fois par session) : il faut alors un clic
  let perm=await h.queryPermission({mode:'read'});
  if(perm!=='granted' && parUtilisateur) perm=await h.requestPermission({mode:'read'});
  if(perm!=='granted'){ dossierAttente=true; render(); return; }
  dossierAttente=false;
  const d=dossierCR(), vus=d.vus||{};
  importLog={done:false, p:0, label:`Lecture du dossier « ${h.name} »…`, lines:[]}; render();
  const nouveaux=[];
  try{ for await (const x of pdfsDuDossier(h)){ const f=await x.e.getFile(); const k=x.chemin+'|'+f.size+'|'+f.lastModified; if(!vus[k]) nouveaux.push({k,f,chemin:x.chemin}); } }
  catch(e){ console.error(e); importLog.lines.push(`❌ Lecture du dossier impossible (${esc(e.message||e)}).`); }
  // seulement les N comptes rendus les plus récents (réglage « Lire : les 10 derniers », par défaut) ; les plus anciens
  // sont notés comme vus : ils ne seront plus proposés
  const max=+(d.max??CR_MAX_DEFAUT); let nVieux=0;
  if(max>0 && nouveaux.length>max){ nouveaux.sort((a,b)=>b.f.lastModified-a.f.lastModified); const vieux=nouveaux.splice(max); vieux.forEach(x=>vus[x.k]=today()); nVieux=vieux.length; }
  let nI=0, nA=0;
  for(const [i,x] of nouveaux.entries()){
    importLog.label=`${x.chemin} (${i+1}/${nouveaux.length})`; importLog.p=i/nouveaux.length; refreshLog();
    try{
      let text=await fileToText(x.f);
      if(classify(text)==='poly' && (estRapportExamen(text)||estCRMaison(text)||/polygraphie|polysomnographie/i.test(text))){
        // nom du fichier (« Stéphanie CHIRON.pdf ») : utilisé seulement si le nom n'est pas trouvé dans le texte
        const nomF=x.chemin.split('/').pop().replace(/\.pdf$/i,'').trim();
        if(!(estCRMaison(text)?parseCRMaison(text):parsePolygraphie(text)).nom && /[A-ZÀ-Þ]{2,}/.test(nomF)) text+=`\nPatient : ${nomF}\n`;
        importLog.lines.push(await importerPoly(text, x.f, x.e)); nI++; }
      else nA++;
      vus[x.k]=today();
    }catch(e){ console.error(e); importLog.lines.push(`❌ ${esc(x.chemin)} : lecture impossible (${esc(e.message||e)}).`); }
    state.reglages={...(state.reglages||{}), dossierCR:{...dossierCR(), vus}}; save();
  }
  state.reglages={...(state.reglages||{}), dossierCR:{...dossierCR(), nom:h.name, derniere:new Date().toISOString(), vus}}; save();
  importLog.lines.unshift(nouveaux.length
    ? `📁 Dossier « ${esc(h.name)} » : ${nouveaux.length} nouveau(x) fichier(s) — ${nI} compte(s) rendu(s) intégré(s)${nA?`, ${nA} autre(s) document(s) ignoré(s)`:''}${nVieux?` ; ${nVieux} plus ancien(s) non lu(s) (réglage : les ${max} plus récents)`:''}.`
    : `📁 Dossier « ${esc(h.name)} » : aucun nouveau compte rendu.`);
  importLog.done=true; render();
}
let dossierAttente=false;
// À l'ouverture : vérification si la dernière date de plus de 7 jours
async function verifierDossierAuto(){

/* ============ Télésuivi PPC : plateformes des prestataires + coffre des identifiants ============ */
// Adresses des plateformes : réglages ordinaires. Identifiants et mots de passe : COFFRE chiffré (AES-GCM 256 bits,
// clé tirée du code maître par PBKDF2-SHA-256, 600 000 itérations). Seul le texte chiffré est enregistré (et sauvegardé) ;
// le code maître n'est jamais conservé ; le coffre se reverrouille après 15 minutes. Les identifiants ne partent que vers
// la plateforme déclarée pour ce prestataire (vérification de l'origine), à la demande du favori « Connexion télésuivi ».
const TELESUIVI_DEFAUT = {'Bastide':'https://v3.bastideaccess.com/patients/respiratory?contractStatus=active', 'Helli Santé':'https://extranet.helli-sante.fr/EspaceSante/orthop/login'};
const AUTH_METHODES = [['mdp','Identifiant + mot de passe'],['2fa','Mot de passe + code reçu (SMS / mail / appli)'],['cps','Carte CPS / e-CPS'],['autre','Autre']];
const COFFRE_ITER = 600000, COFFRE_DELAI = 15*60*1000;
let coffreCle=null, coffreData=null, coffreMinuteur=null, coffreAttentes=[];
const telesuivi = () => { const t=(state.reglages||{}).telesuivi||{}; const r={};
  for(const p of [...PRESTATAIRES, ...Object.keys(t).filter(x=>!PRESTATAIRES.includes(x) && !t[x].supprime)]) r[p]={url:'', auth:'mdp', note:'', ...(TELESUIVI_DEFAUT[p]?{url:TELESUIVI_DEFAUT[p]}:{}), ...(t[p]||{})}; return r; };
const majTelesuivi = (p, champs) => { const t={...((state.reglages||{}).telesuivi||{})}; t[p]={...(t[p]||{}), ...champs}; state.reglages={...(state.reglages||{}), telesuivi:t}; save(); };
const origineDe = u => { try{ return new URL(u).origin; }catch(e){ return ''; } };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const deB64 = t => Uint8Array.from(atob(t), ch=>ch.charCodeAt(0));
const coffreExiste = () => !!((state.reglages||{}).coffre||{}).data;
const coffreOuvert = () => !!coffreCle;
async function coffreDeriver(code, sel){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:sel, iterations:COFFRE_ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function coffreEnregistrer(){
  const c=(state.reglages||{}).coffre, iv=crypto.getRandomValues(new Uint8Array(12));
  const data=await crypto.subtle.encrypt({name:'AES-GCM', iv}, coffreCle, new TextEncoder().encode(JSON.stringify(coffreData)));
  state.reglages={...(state.reglages||{}), coffre:{v:1, sel:c.sel, iv:b64(iv), data:b64(data)}}; save();
}
function coffreRelancer(){ clearTimeout(coffreMinuteur); coffreMinuteur=setTimeout(coffreFermer, COFFRE_DELAI); }
function coffreFermer(){ coffreCle=null; coffreData=null; clearTimeout(coffreMinuteur); document.querySelector('.coffre-modal')?.remove(); majBoutonsCoffre(); }
async function coffreCreer(code){
  const sel=crypto.getRandomValues(new Uint8Array(16));
  coffreCle=await coffreDeriver(code, sel); coffreData={};
  state.reglages={...(state.reglages||{}), coffre:{v:1, sel:b64(sel)}}; await coffreEnregistrer(); coffreRelancer();
}
async function coffreOuvrir(code){
  const c=(state.reglages||{}).coffre, cle=await coffreDeriver(code, deB64(c.sel));
  try{ const clair=await crypto.subtle.decrypt({name:'AES-GCM', iv:deB64(c.iv)}, cle, deB64(c.data)); coffreData=JSON.parse(new TextDecoder().decode(clair)); }
  catch(e){ return false; } // code maître inexact
  coffreCle=cle; coffreRelancer(); majBoutonsCoffre(); return true;
}
async function coffreChangerCode(code){ const sel=crypto.getRandomValues(new Uint8Array(16)); coffreCle=await coffreDeriver(code, sel);
  state.reglages={...(state.reglages||{}), coffre:{v:1, sel:b64(sel)}}; await coffreEnregistrer(); coffreRelancer(); }
function majBoutonsCoffre(){ document.querySelectorAll('[data-coffre-etat]').forEach(e=>e.textContent=coffreOuvert()?'🔓':'🔒'); }

// Saisie du code maître (création, ouverture ou changement). Renvoie true si le coffre est ouvert.
function demanderCodeMaitre(motif){
  return new Promise(res=>{
    document.querySelector('.code-maitre')?.remove();
    const creer=!coffreExiste(), fond=document.createElement('div'); fond.className='cr-modal code-maitre';
    fond.innerHTML=`<div class="cr-boite" style="width:min(430px,100%)">
      <div class="toolbar" style="margin:0 0 8px"><b>🔐 ${creer?'Créer le coffre des identifiants':'Code maître'}</b><div class="spacer"></div><button class="small" data-x>✕</button></div>
      ${motif?`<p class="hint" style="margin-top:0">${motif}</p>`:''}
      <form class="cm-form"><input type="password" name="c1" placeholder="${creer?'Nouveau code maître (8 caractères minimum)':'Code maître'}" autocomplete="off" required>
        ${creer?'<input type="password" name="c2" placeholder="Retapez le code maître" autocomplete="off" required>':''}
        <div class="cm-err" hidden></div>
        <div class="toolbar" style="margin:4px 0 0"><button class="primary" type="submit">${creer?'Créer le coffre':'Déverrouiller'}</button><span class="hint">Verrouillage automatique après 15 min</span></div></form>
      ${creer?'<p class="hint" style="margin-bottom:0">⚠️ Le code maître n’est enregistré nulle part : s’il est oublié, il faudra effacer le coffre et ressaisir les identifiants.</p>':''}</div>`;
    document.body.appendChild(fond);
    const f=fond.querySelector('form'), err=fond.querySelector('.cm-err'), fin=v=>{ fond.remove(); res(v); };
    fond.querySelector('[data-x]').onclick=()=>fin(false); fond.onclick=e=>{ if(e.target===fond) fin(false); };
    f.onkeydown=e=>{ if(e.key==='Escape') fin(false); };
    f.c1.focus();
    f.onsubmit=async e=>{ e.preventDefault(); const c1=f.c1.value; err.hidden=true;
      const montrer=t=>{ err.textContent=t; err.hidden=false; };
      if(creer){ if(c1.length<8) return montrer('8 caractères minimum.'); if(c1!==f.c2.value) return montrer('Les deux codes ne sont pas identiques.');
        f.querySelector('button[type=submit]').disabled=true; await coffreCreer(c1); majBoutonsCoffre(); fin(true); return; }
      f.querySelector('button[type=submit]').disabled=true;
      if(await coffreOuvrir(c1)) fin(true); else { f.querySelector('button[type=submit]').disabled=false; f.c1.value=''; f.c1.focus(); montrer('Code maître inexact.'); }
    };
  });
}

// Ouvre la plateforme du prestataire dans un onglet relié à Suivi sommeil (le favori peut alors demander les identifiants)
const fenetresTelesuivi={};
function ouvrirTelesuivi(presta){

  const t=telesuivi()[presta];

  if(w) fenetresTelesuivi[origineDe(t.url)]=w; else toast('Chrome a bloqué l’ouverture : autorisez les fenêtres pour cette page');
}
const boutonTelesuivi = (presta, petit) => `<button class="${petit?'small ':''}btn-telesuivi" data-telesuivi="${esc(presta||'')}" title="${presta?`Ouvrir la plateforme de télésuivi ${esc(presta)}`:'Prestataire non renseigné'}">🌐 Ouvrir le télésuivi PPC</button>`;

// Demande d'identifiants envoyée par le favori depuis la page de connexion de la plateforme
window.addEventListener('message', async e=>{
  const d=e.data; if(!d || d.somnum!=='demande-identifiants' || !e.source) return;
  const repondre=r=>{ try{ e.source.postMessage({somnum:'identifiants', id:d.id, ...r}, e.origin); }catch(x){} };
  const presta=Object.entries(telesuivi()).find(([p,t])=>t.url && origineDe(t.url)===e.origin)?.[0];
  if(!presta){ repondre({erreur:`ce site (${e.origin}) n’est déclaré pour aucun prestataire dans Suivi sommeil.`}); return; }
  if(!coffreExiste()){ repondre({erreur:'le coffre des identifiants n’est pas encore créé (Patients PPC → 🔐 Télésuivi).'}); return; }
  if(!coffreOuvert()){
    toast(`🔐 ${presta} demande ses identifiants : tapez le code maître`);
    if(!await demanderCodeMaitre(`La plateforme <b>${esc(presta)}</b> demande vos identifiants. Après le déverrouillage, revenez sur son onglet : la connexion se fait toute seule.`)){ repondre({erreur:'coffre resté verrouillé.'}); return; }
  }
  const id=(coffreData||{})[presta];
  if(!id||!id.login||!id.mdp){ repondre({erreur:`aucun identifiant enregistré pour ${presta} dans le coffre.`}); return; }
  coffreRelancer(); repondre({login:id.login, mdp:id.mdp, presta});
});

// Favori (bookmarklet) exécuté sur la page de connexion de la plateforme : demande les identifiants à Suivi sommeil, remplit, valide.
// Ne contourne rien : s'il y a un code de double authentification ou un CAPTCHA, c'est vous qui le saisissez.
function connexionTelesuivi(){
  const vis=el=>{ const r=el.getBoundingClientRect(); return r.width>0 && r.height>0 && getComputedStyle(el).visibility!=='hidden'; };
  const champs=[...document.querySelectorAll('input')].filter(vis);
  const mdp=champs.find(x=>x.type==='password');
  const avant=mdp?champs.slice(0,champs.indexOf(mdp)):champs;
  const ident=avant.filter(x=>/^(text|email|tel)$/.test(x.type)||x.autocomplete==='username').pop();
  if(!mdp && !ident){ alert('Suivi sommeil : aucun formulaire de connexion sur cette page (vous êtes sans doute déjà connecté).'); return; }
  if(!window.opener){ alert('Suivi sommeil : ouvrez cette plateforme depuis Suivi sommeil (bouton « 🌐 Ouvrir le télésuivi PPC »), puis recliquez sur ce favori.\n\nSi l’onglet a bien été ouvert ainsi, le site coupe le lien entre onglets : utilisez alors les boutons « Copier » du coffre.'); return; }
  const poser=(el,v)=>{ const set=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set; el.focus(); set.call(el,v); el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); };
  const valider=el=>{ const f=el.closest('form'); const b=(f||document).querySelector('button[type=submit],input[type=submit]')||[...(f||document).querySelectorAll('button')].filter(vis).find(x=>/connexion|connecter|valider|continuer|suivant|login|sign\s*in|log\s*in/i.test(x.textContent||x.value||''));
    if(b) b.click(); else if(f&&f.requestSubmit) f.requestSubmit(); };

// Prestataire d'une page lue : adresse déclarée dans 🔒 Télésuivi, sinon nom de domaine connu
function prestaDeSite(d){

// Lignes du tableau → patients et valeurs (colonnes repérées par leur titre : Patient, Appareillage, IAH initial, Moy. Obs., Moy. Fuite, Moy. IAH, Fin des prescriptions)
function lignesTelesuivi(d){
  const H=(d.entetes||[]).map(h=>normText(h).replace(/[^a-z0-9]+/g,' ').trim());
  const col=f=>H.findIndex(f);
  const iP=col(h=>/^(patient|nom)/.test(h)), iApp=col(h=>/appareil|machine|materiel|dispositif/.test(h)), iIni=col(h=>/iah init/.test(h)),
        iObs=col(h=>/\bobs|observance|utilisation/.test(h)), iFui=col(h=>/fuite/.test(h)), iIah=col(h=>/\biah\b/.test(h) && !/init/.test(h)), iFin=col(h=>/fin des? prescr/.test(h));
  if(iP<0) return [];
  const RX_DDN=/n[ée]\s*\(?e?\)?\s*le\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i, RX_NIR=/(?:s[ée]cu(?:rit[ée] sociale)?|\bss|nir)\s*:?\s*([12][\d ]{12,20})/i;
  return (d.lignes||[]).map(l=>{
    const cell=i=>i>=0&&i<l.length?l[i]:'', pat=cell(iP), ls=pat.split('\n').map(x=>x.trim()).filter(Boolean);
    const nomL=ls.find(x=>!RX_DDN.test(x) && !/s[ée]curit[ée]|n°|\bss\b/i.test(x))||'';
    const np=splitNomComplet(nomL.replace(/\s+/g,' ')), md=pat.match(RX_DDN), mn=pat.match(RX_NIR);
    const ddn=md?`${md[3]}-${md[2].padStart(2,'0')}-${md[1].padStart(2,'0')}`:'';
    const fins=[...cell(iFin).matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{4})/g)].map(m=>`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`).sort();
    return {lu:nomL, nom:np.nom||'', prenom:capName(np.prenom||''), ddn, nir:mn?mn[1].replace(/\D/g,''):'',
      appareil:cell(iApp).split('\n')[0].trim(), iahInit:un(cell(iIni)), obs:un(cell(iObs)), fuites:un(cell(iFui)), iah:un(cell(iIah)), fin:fins[fins.length-1]||''};
  }).filter(r=>r.nom && !estNonPatient(r.nom, r.prenom));
}
// Patient de Suivi sommeil correspondant (nom + prénom, date de naissance si connue des deux côtés) ; null si absent ou ambigu
function patientTelesuivi(r){
  const mots=nomComplet(r.nom+' '+r.prenom).split(' ').filter(Boolean), vu=w=>mots.some(m=>m===w||(w.length>=5&&lev1(w,m)));
  const parCle=new Map(); for(const c of state.consults) if(c.nom && !estNonPatient(c.nom,c.prenom)){ const k=patientKey(c); if(!parCle.has(k)) parCle.set(k,c); }
  const ddnDe=k=>((state.rdv||{})[k]||{}).ddn;
  const L=[...parCle.entries()].filter(([k,c])=>nomComplet(c.nom+' '+(c.prenom||'')).split(' ').filter(Boolean).every(vu) && (!r.ddn||!ddnDe(k)||ddnDe(k)===r.ddn));
  if(L.length===1) return L[0][0];
  const sur=L.filter(([k])=>r.ddn && ddnDe(k)===r.ddn); return sur.length===1?sur[0][0]:null; // plusieurs homonymes : choix manuel
}

// un fichier « suivi_sommeil_sauvegarde_AAAA-MM-JJ.json » y est écrit ; seules les 10 dernières sont gardées.

const sauvAuto = () => state.reglages && state.reglages.sauvegardeAuto || {};

// (un ancien dossier encore mémorisé n'est plus utilisé tant que le nouveau n'a pas été choisi)

// Dernière sauvegarde du dossier (la plus récente par sa date de modification interne)
async function derniereSauvegarde(h){
  const liste=[]; for await (const [n,e] of h.entries()) if(e.kind==='file' && /^suivi_sommeil_sauvegarde_\d{4}-\d{2}-\d{2}\.json$/.test(n)) liste.push([n,e]);
  let best=null;
  for(const [n,e] of liste.sort((a,b)=>b[0].localeCompare(a[0])).slice(0,3)){
    try{ const data=JSON.parse(await (await e.getFile()).text()); if(Array.isArray(data.consults) && (!best || (data.modifie||0)>(best.data.modifie||0))) best={nom:n, data}; }catch(err){}
  }
  return best;
}

function reprendreSauvegarde(d){
    const ancien=state.reglages||{};
    state=migrer({consults:d.consults, ppc:d.ppc||{}, oam:d.oam||{}, complexes:d.complexes||{}, distincts:d.distincts||[], reglages:d.reglages||{}, rdv:d.rdv||{}, modifie:d.modifie||0});
    // réglages propres à cet ordinateur (dossiers choisis ici) conservés
    state.reglages={...state.reglages, syncBase:d.modifie||0, sauvegardeAuto:{...(ancien.sauvegardeAuto||{}), derniere:new Date().toISOString()}, ...(ancien.dossierCR?{dossierCR:{...(state.reglages.dossierCR||{}), ...ancien.dossierCR, vus:{...((state.reglages.dossierCR||{}).vus||{}), ...(ancien.dossierCR.vus||{})}}}:{})};
    save(); sauvAttente=false; render();

async function sauvegarderDansDossier(parUtilisateur=false, forcer=false){
  let h; try{ h=await DocsCR.get('dossierSauvegarde'); }catch(e){}
  if(!h || dossierAChanger()){ if(parUtilisateur){ if(h) toast(`Choisissez le dossier « ${DOSSIER_SAUVEGARDE} » (Logiciels Pro (CLAUDE)) : les sauvegardes iront désormais là`); choisirDossierSauvegarde(); } return false; }
  let perm=await h.queryPermission({mode:'readwrite'});
  if(perm!=='granted' && parUtilisateur) perm=await h.requestPermission({mode:'readwrite'});
  if(perm!=='granted'){ sauvAttente=true; render(); return false; }
  try{
    // Une version plus récente, faite sur un autre ordinateur, est-elle dans le dossier ? Alors on ne l'écrase pas : on propose de la reprendre
    const der=await derniereSauvegarde(h), base=(state.reglages&&state.reglages.syncBase)||0;
    if(der && !forcer){
      const dm=der.data.modifie||0, plusRecente=dm>base+1000 && dm!==state.modifie;
      const localVide=!state.consults.length && (der.data.consults||[]).length>0;
      if(plusRecente || localVide){ proposerReprise(h, der); return false; }
    }
    const nom=`suivi_sommeil_sauvegarde_${today()}.json`, ecrit=state.modifie||Date.now();

    state.reglages={...(state.reglages||{}), syncBase:ecrit};
    // ménage : on garde les 10 plus récentes

// Le navigateur demande de confirmer l'accès au dossier à chaque ouverture : un bandeau propose de vérifier d'un clic

function sauvegardeDue(){

/* ============ Copie de secours hebdomadaire (second dossier du Drive) ============ */
// Indépendante de la sauvegarde habituelle : un autre dossier, choisi une fois ; une copie complète par semaine,
// « suivi_sommeil_SECOURS_AAAA-MM-JJ.json », relue après écriture pour vérifier qu'elle est intacte ; les 12 dernières
// (≈ 3 mois) sont gardées. Jamais relue automatiquement : elle ne sert qu'en cas de problème majeur (📂 Restaurer → autre fichier).
const NB_SECOURS=12, RX_SECOURS=/^suivi_sommeil_SECOURS_\d{4}-\d{2}-\d{2}\.json$/;

  let hs=null; try{ hs=await DocsCR.get('dossierSauvegarde'); }catch(e){}
  if(hs && await hs.isSameEntry(h).catch(()=>false)){ toast('⚠️ Choisissez un AUTRE dossier que celui de la sauvegarde habituelle'); return; }
  await DocsCR.put('dossierSecours', h);
  state.reglages={...(state.reglages||{}), secours:{...secours(), nom:h.name}}; save();
  await faireCopieSecours(true);

async function listeSecours(h){ const l=[]; for await (const [n,e] of h.entries()) if(e.kind==='file' && RX_SECOURS.test(n)) l.push([n,e]); return l.sort((a,b)=>b[0].localeCompare(a[0])); }
async function faireCopieSecours(parUtilisateur=false){
  let h; try{ h=await DocsCR.get('dossierSecours'); }catch(e){}
  if(!h){ if(parUtilisateur) choisirDossierSecours(); return false; }
  let perm=await h.queryPermission({mode:'readwrite'});
  if(perm!=='granted' && parUtilisateur) perm=await h.requestPermission({mode:'readwrite'});
  if(perm!=='granted'){ secoursAttente=true; majBoutonAuto(); return false; }
  if(!state.consults.length){ if(parUtilisateur) toast('Aucune donnée : copie de secours non faite (les anciennes sont conservées)'); return false; }
  try{
    const nom=`suivi_sommeil_SECOURS_${today()}.json`, contenu=JSON.stringify(state);
    const fh=await h.getFileHandle(nom,{create:true}), w=await fh.createWritable(); await w.write(contenu); await w.close();
    // vérification : la copie est relue et doit contenir toutes les consultations
    const relu=JSON.parse(await (await fh.getFile()).text());
    if(!Array.isArray(relu.consults) || relu.consults.length!==state.consults.length) throw new Error('copie incomplète à la relecture');
    for(const [n] of (await listeSecours(h)).slice(NB_SECOURS)) await h.removeEntry(n);
    secoursAttente=false;
    state.reglages={...(state.reglages||{}), secours:{...secours(), nom:h.name, derniere:new Date().toISOString(), consults:state.consults.length}};
    pasDeSync=true; save(); pasDeSync=false;
    toast(`🛟 Copie de secours vérifiée et enregistrée dans « ${h.name} » (${state.consults.length} consultations)`); majBoutonAuto(); return true;
  }catch(e){ console.error(e); toast('⚠️ Copie de secours impossible : '+(e.message||e)); return false; }
}
// À l'ouverture (et toutes les 6 h si la page reste ouverte) : copie si la dernière date d'au moins 7 jours
async function secoursAuto(){
  if(!dossierPossible() || !secoursDue()) return;

// Copie sur cet ordinateur : la donnée actuelle, ou l'une des copies de secours du Drive (dans Téléchargements)
async function telechargerSecours(nom){
  if(!nom){ download(`suivi_sommeil_COPIE_${today()}.json`, JSON.stringify(state), 'application/json'); toast('⬇️ Copie téléchargée (dossier Téléchargements)'); return; }

    ${c.nom?`<p style="margin:4px 0">Dossier : <b>📁 ${esc(c.nom)}</b> · ${der?`dernière copie le ${der.toLocaleDateString('fr-FR')}${c.consults?` (${c.consults} consultation${c.consults>1?'s':''})`:''}${secoursDue()?' — <b style="color:#e8590c">à refaire</b>':''}`:'aucune copie pour l’instant'}</p>`:''}
    <div class="toolbar" style="margin:6px 0 0;gap:6px;flex-wrap:wrap">

/* encadrés PPC : 4 colonnes lisibles (date d'analyse masquée) */
.pc-grille{grid-template-columns:1fr!important}
.pc-cols,.pc-row{grid-template-columns:minmax(0,1fr) 46px 62px 46px!important;padding-left:10px!important;padding-right:10px!important}
.pc-cols>:nth-child(3),.pc-row>:nth-child(3){display:none!important}
.pc-cols{display:grid!important;font-size:10px!important;letter-spacing:0!important}
.pc-grip,.pc-resume .hint{display:none!important}
.pc-row{font-size:15px!important}
.pc-tete{flex-wrap:wrap}
.pc-vues,#btn-telesuivi,#btn-mails,#btn-mails-cfg,#btn-inst,#btn-pdf{display:none!important}
/* fiche patient en pleine largeur */
.fiche-pat .cr-boite{width:100%!important;max-width:100%!important;border-radius:0!important;min-height:100%}
.cr-modal.fiche-pat{padding:0!important}
.fiche-pat .cr-boite{box-sizing:border-box;padding:12px!important;overflow-x:hidden}
.fp-grille{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
.fp-champ{min-width:0!important}
.fp-champ input,.fp-champ select,.fp-champ textarea{width:100%!important;min-width:0!important;box-sizing:border-box}
.dp{grid-template-columns:1fr!important}
.dp-kpi{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.dp-l>span{flex-basis:120px!important}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
/* calendrier : choix du mois et du nombre de mois */
.m-titre{flex:1;font-size:16px;font-weight:800;text-transform:capitalize;padding:8px;border-radius:10px}
.m-cal-opt{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.m-nb{display:inline-flex;gap:3px}.m-nb button.on,.m-mini-grille button.on{background:#1971c2;color:#fff;border-color:#1971c2}
.m-mini{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--card)}
.m-mini-tete{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.m-mini-tete b{font-size:17px}.m-mini-tete button{font-size:18px;padding:4px 14px}
.m-mini-grille{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m-mini-grille button{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:10px;font-size:14px;text-transform:capitalize}
.m-mini-grille button small{font-size:11px;color:var(--muted);min-height:13px}.m-mini-grille button.on small{color:#fff}
.m-mini-grille button.auj{box-shadow:0 0 0 2px #2f9e44 inset}
.m-cal-mois{margin-bottom:14px}
/* PPC : filtre par prestataire, encadrés repliables */
.m-puces{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px}
.m-puce{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.m-puce img.logo-p{height:20px!important;max-width:60px!important;margin:0}
.m-puce b{font-size:12px;color:var(--muted)}.m-puce.on{background:#1971c2;color:#fff;border-color:#1971c2}.m-puce.on b{color:#fff}
.m-chevron{margin-left:auto;font-size:18px;color:var(--muted);transition:transform .15s}
.pc-carte.m-replie .m-chevron{transform:rotate(-90deg)}
.pc-carte.m-replie .pc-defile,.pc-carte.m-replie .pc-plus{display:none}
.pc-tete{cursor:pointer}
/* fiche patient : l'essentiel, puis les champs modifiables repliés */
.m-ess{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.m-ess-iah{display:flex;flex-direction:column;align-items:center;min-width:64px;gap:2px}
.m-ess-iah .m-iah{font-size:30px;line-height:1}.m-ess-iah small{color:var(--muted);font-size:11px}
.m-ess-d{flex:1;min-width:0}
.m-ess-l{display:flex;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.m-ess-l:last-child{border-bottom:0}.m-ess-l>span{color:var(--muted);flex:0 0 92px}.m-ess-l>b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.m-ess-l img.logo-p{height:20px!important;vertical-align:middle}
.m-modif{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.m-modif summary{cursor:pointer;color:var(--muted);font-size:14px}
.m-modif[open] summary{margin-bottom:8px}
#fp-suppr,#fp-mail{display:none!important}
/* télésuivi : plus dans les encadrés (accessible depuis la fiche du prestataire) */
.pc-tete .btn-telesuivi{display:none!important}
.pc-tete img.logo-p,.pc-tete h3{text-decoration:underline dotted color-mix(in srgb,var(--muted) 60%,transparent);text-underline-offset:4px}
.pr-modal .pr-tete{flex-wrap:wrap}.pr-modal .pr-tete .btn-telesuivi{order:5;width:100%;padding:10px;font-size:15px}
.pr-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.m-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.m-kpis>div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
.m-kpis b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.m-kpis span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.m-h4{margin:6px 0 8px;font-size:15px}
.m-an{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
.m-an-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.m-an-t span{font-size:13px;color:var(--muted)}
.m-barres{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end}
.m-barre-m{display:flex;flex-direction:column;align-items:center;gap:2px}
.m-barre-m i{display:block;width:100%;max-width:18px;border-radius:4px 4px 0 0;background:#1971c2;min-height:2px}
.m-barre-m small{font-size:10px;color:var(--muted)}.m-n{font-size:11px;font-weight:700;min-height:13px}


</style>
<script>
(function(){
  const vm={q:'', nb:150};
  const st=c=>c.statut||'rien';
  const tt=c=>c.traitement==='PPC'?`<span class="m-badge">PPC</span>${c.prestataire?logoPresta(c.prestataire):''}`:c.traitement==='OAM'?'<span class="m-badge oam">OAM</span>':'';
  const ouvrir=app=>app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ const c=state.consults.find(x=>x.id===b.dataset.id); if(c) fichePatient(c); });
  // ---- Consultations : une ligne par consultation (date, nom, IAH, traitement + prestataire, statut), regroupées par mois
  renderConsultations=function(){
    const app=document.getElementById('app'), q=norm(vm.q);
    const L=state.consults.filter(c=>c.nom && (!q || norm(c.nom+' '+(c.prenom||'')).includes(q) || norm((c.prenom||'')+' '+c.nom).includes(q)))
      .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const vis=L.slice(0,vm.nb), groupes=[];
    for(const c of vis){ const m=(c.date||'').slice(0,7)||'sans'; let g=groupes[groupes.length-1]; if(!g||g.m!==m){ g={m,l:[]}; groupes.push(g); } g.l.push(c); }
    app.innerHTML=`${importLogHTML()}<div class="m-barre"><input type="search" id="m-q" placeholder="🔍 Rechercher un patient…" value="${esc(vm.q)}" autocomplete="off"></div>
      ${groupes.length?groupes.map(g=>`<div class="m-mois"><span>${g.m==='sans'?'Sans date':esc(nomMois(g.m))}</span><span>${g.l.length}</span></div>
        <div class="m-liste">${g.l.map(c=>`<button class="m-row" data-id="${c.id}">
          <span class="m-date">${c.date?esc(fmtDate(c.date).slice(0,5)):'—'}</span>
          <span class="m-nom"><b>${esc(c.nom)}</b> ${esc(c.prenom||'')}</span>
          <span class="m-iah ${classeIAH(c.iah)}">${esc(c.iah)||'—'}</span>
          <span class="m-sous"><span class="m-st ${st(c)}"></span>${esc((STATUTS.find(x=>x.v===st(c))||{}).label||'')}${c.analyse==='PSG'?' · Somnum':''} ${tt(c)}</span></button>`).join('')}</div>`).join('')
        :'<div class="m-vide">Aucune consultation. Chargez la dernière sauvegarde (bouton jaune en haut).</div>'}
      ${L.length>vm.nb?`<button class="m-plus" id="m-plus">Afficher plus (${L.length-vm.nb} autres)</button>`:''}`;
    ouvrir(app); bindImportLog();
    const qi=app.querySelector('#m-q'); qi.oninput=()=>{ vm.q=qi.value; vm.nb=150; renderConsultations(); const n=document.getElementById('m-q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
    const p=app.querySelector('#m-plus'); if(p) p.onclick=()=>{ vm.nb+=150; renderConsultations(); };
  };
  // ---- Calendrier : du plus récent au plus ancien, 1 à 6 mois par page, mini-calendrier pour choisir le mois
  const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
  const MOIS_C=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  let miniOuvert=false, miniAn=null;
  renderCalendrier=function(){
    const app=document.getElementById('app'), auj=isoLocal(new Date());
    if(!view.calMois) view.calMois=auj.slice(0,7);
    const nb=[1,2,3,6].includes(+lsGet('mob_calNb','1'))?+lsGet('mob_calNb','1'):1;
    const [an0,mo0]=view.calMois.split('-').map(Number);
    const prestaDe=new Map(); for(const c of state.consults) if(c.traitement==='PPC' && c.prestataire) prestaDe.set(patientKey(c), c.prestataire);
    const parJour={}, parMois={}; for(const c of state.consults){ const d=dateExamen(c); if(!c.nom || !d || c.analyse==='PSG') continue; (parJour[d]=parJour[d]||[]).push(c); parMois[d.slice(0,7)]=(parMois[d.slice(0,7)]||0)+1; }
    const abs=(state.reglages||{}).absences||{};
    const blocMois=(an,mo)=>{
      const cle=`${an}-${String(mo).padStart(2,'0')}`, nbJ=new Date(an,mo,0).getDate(); let h='', total=0;
      for(let j=nbJ;j>=1;j--){ // jours en ordre décroissant
        const d=`${cle}-${String(j).padStart(2,'0')}`, l=(parJour[d]||[]).slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
        if(!l.length && !abs[d] && d!==auj) continue; total+=l.length;
        const x=new Date(d+'T12:00');
        h+=`<div class="m-jour${d===auj?' auj':''}">${x.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}<span class="hint">${abs[d]?'🏖️ absence':l.length?l.length+' examen'+(l.length>1?'s':''):'aujourd’hui'}</span></div>`;
        if(l.length) h+=`<div class="m-liste">${l.map(c=>{ const p=prestaDe.get(patientKey(c)); return `<button class="m-row m-cal-row" data-id="${c.id}">
            <span class="m-nom"><b>${esc(c.nom)}</b> ${esc(c.prenom||'')}${c.statut==='termine'?' <span style="color:#2f9e44">✔</span>':''}</span>
            <span>${p?logoPresta(p):''}</span>
            <span class="m-iah ${classeIAH(c.iah)}">${esc(c.iah)||'—'}</span></button>`; }).join('')}</div>`;
      }
      return `<section class="m-cal-mois"><div class="m-mois"><span>${esc(nomMois(cle))}</span><span>${total} examen${total>1?'s':''}</span></div>${h||'<div class="m-vide" style="padding:10px">Aucun examen.</div>'}</section>`;
    };
    const mois=[...Array(nb)].map((_,i)=>{ const x=new Date(an0,mo0-1-i,1); return [x.getFullYear(), x.getMonth()+1]; });
    if(miniAn==null) miniAn=an0;
    const mini=miniOuvert?`<div class="m-mini"><div class="m-mini-tete"><button data-an="-1">‹</button><b>${miniAn}</b><button data-an="1">›</button></div>
      <div class="m-mini-grille">${MOIS_C.map((m,i)=>{ const cle=`${miniAn}-${String(i+1).padStart(2,'0')}`, n=parMois[cle]||0;
        return `<button class="${cle===view.calMois?'on':''}${cle===auj.slice(0,7)?' auj':''}" data-mois="${cle}">${m}<small>${n||''}</small></button>`; }).join('')}</div></div>`:'';
    const titre=nb>1?`${MOIS_C[mois[nb-1][1]-1]} ${mois[nb-1][0]} → ${MOIS_C[mo0-1]} ${an0}`:new Date(an0,mo0-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    app.innerHTML=`<div class="m-cal-nav"><button id="m-prec" aria-label="Mois précédents">‹</button><button class="m-titre" id="m-mini">📅 ${titre} ▾</button><button id="m-suiv" aria-label="Mois suivants">›</button></div>
      ${mini}
      <div class="m-cal-opt"><button class="small" id="m-auj">📍 Aujourd’hui</button><span class="m-nb">${[1,2,3,6].map(n=>`<button class="small${n===nb?' on':''}" data-nb="${n}">${n} mois</button>`).join('')}</span></div>
      ${mois.map(([a,m])=>blocMois(a,m)).join('')}<p class="hint" style="text-align:center">Somnum non affichés</p>`;
    ouvrir(app);
    const aller=n=>{ const x=new Date(an0,mo0-1+n*nb,1); view.calMois=isoLocal(x).slice(0,7); miniAn=null; renderCalendrier(); scrollTo(0,0); };
    app.querySelector('#m-prec').onclick=()=>aller(-1); app.querySelector('#m-suiv').onclick=()=>aller(1);
    app.querySelector('#m-mini').onclick=()=>{ miniOuvert=!miniOuvert; miniAn=an0; renderCalendrier(); };
    app.querySelectorAll('[data-an]').forEach(b=>b.onclick=()=>{ miniAn+= +b.dataset.an; renderCalendrier(); });
    app.querySelectorAll('[data-mois]').forEach(b=>b.onclick=()=>{ view.calMois=b.dataset.mois; miniOuvert=false; miniAn=null; renderCalendrier(); scrollTo(0,0); });
    app.querySelectorAll('[data-nb]').forEach(b=>b.onclick=()=>{ lsSet('mob_calNb', b.dataset.nb); renderCalendrier(); });
    app.querySelector('#m-auj').onclick=()=>{ view.calMois=auj.slice(0,7); miniOuvert=false; miniAn=null; renderCalendrier(); const e=app.querySelector('.m-jour.auj'); if(e) e.scrollIntoView({block:'start'}); };
  };
  // ---- Patients PPC : filtre rapide par prestataire en haut ; chaque encadré se replie / se déplie d'un toucher sur son en-tête
  let filtrePPC='', repliesPPC=new Set();
  try{ repliesPPC=new Set(JSON.parse(lsGet('mob_ppcReplies','[]'))); }catch(e){}
  const renderPPCOrig=renderPPCList;
  renderPPCList=function(){
    renderPPCOrig();
    const app=document.getElementById('app'), cartes=[...app.querySelectorAll('.pc-carte')]; if(!cartes.length) return;
    const nomDe=c=>c.querySelector('.pc-tete h3').textContent.trim();
    const puces=cartes.map(c=>{ const n=nomDe(c), nb=(c.querySelector('.pc-nb')||{}).textContent||''; return `<button class="m-puce${filtrePPC===n?' on':''}" data-presta="${esc(n)}">${c.querySelector('.pc-tete img.logo-p')?c.querySelector('.pc-tete img.logo-p').outerHTML:''}<span>${esc(n==='Prestataire non renseigné'?'Non renseigné':n)}</span><b>${esc(nb.replace(/\D/g,''))}</b></button>`; }).join('');
    const barre=document.createElement('div'); barre.className='m-puces';
    barre.innerHTML=`<button class="m-puce${filtrePPC?'':' on'}" data-presta=""><span>Tous</span></button>${puces}<button class="m-puce m-puce-tout" data-replier>${cartes.every(c=>repliesPPC.has(nomDe(c)))?'▾ Tout déplier':'▴ Tout replier'}</button>`;
    app.querySelector('.pc-grille').before(barre);
    cartes.forEach(c=>{ const n=nomDe(c);
      c.hidden=!!filtrePPC && filtrePPC!==n;
      c.classList.toggle('m-replie', repliesPPC.has(n) && filtrePPC!==n);
      const t=c.querySelector('.pc-tete'); t.insertAdjacentHTML('beforeend','<span class="m-chevron">▾</span>');
      t.onclick=e=>{ if(e.target.closest('button')) return;
        if(e.target.closest('img.logo-p,h3,.pc-sans,.pc-nb')){ fichePrestataire(n); return; } // logo ou nom : fiche du prestataire
        repliesPPC.has(n)?repliesPPC.delete(n):repliesPPC.add(n); lsSet('mob_ppcReplies', JSON.stringify([...repliesPPC])); c.classList.toggle('m-replie'); };
    });
    barre.querySelectorAll('[data-presta]').forEach(b=>b.onclick=()=>{ filtrePPC=b.dataset.presta; renderPPCList(); scrollTo(0,0); });
    barre.querySelector('[data-replier]').onclick=()=>{ const tout=cartes.every(c=>repliesPPC.has(nomDe(c))); cartes.forEach(c=>tout?repliesPPC.delete(nomDe(c)):repliesPPC.add(nomDe(c))); lsSet('mob_ppcReplies', JSON.stringify([...repliesPPC])); renderPPCList(); };
  };
  // ---- Fiche patient : l'essentiel d'abord ; les champs modifiables sont rangés dans une partie repliée
  const ficheOrig=fichePatient;
  fichePatient=function(c){
    ficheOrig(c);
    const f=document.querySelector('.fiche-pat .cr-boite'); if(!f) return;
    const k=patientKey(c), o=(state.rdv||{})[k]||{}, sev=severity(c.iah), stl=(STATUTS.find(x=>x.v===(c.statut||'rien'))||{}).label||'';
    const de=dateExamen(c), tel=(o.tel||'').replace(/\s/g,'');
    const L=(lib,val)=>val?`<div class="m-ess-l"><span>${lib}</span><b>${val}</b></div>`:'';
    const ess=document.createElement('div'); ess.className='m-ess';
    ess.innerHTML=`<div class="m-ess-iah"><span class="m-iah ${classeIAH(c.iah)}">${esc(c.iah)||'—'}</span><small>IAH /h</small>${sev?`<span class="badge ${sev.cls}">${sev.label}</span>`:''}</div>
      <div class="m-ess-d">
        ${L('Examen', `${de?fmtDate(de):'—'}${c.analyse?' · '+esc(LIB_ANALYSE[c.analyse]||c.analyse):''}`)}
        ${L('Statut', `<span class="m-st ${c.statut||'rien'}"></span> ${esc(stl)}`)}
        ${L('Traitement', c.traitement?`${c.traitement==='PPC'?'<span class="m-badge">PPC</span>':c.traitement==='OAM'?'<span class="m-badge oam">OAM</span>':esc(c.traitement)} ${c.prestataire&&c.traitement==='PPC'?logoPresta(c.prestataire)+' '+esc(c.prestataire):''}`:'')}
        ${L('Annonce', estDate(o.annonce)?fmtDate(o.annonce):'')}
        ${L('Adressé par', esc(c.adresseur||''))}
        ${L('Téléphone', tel?`<a href="tel:${esc(tel)}">${esc(o.tel)}</a>`:'')}
        ${L('Commentaire', esc(c.commentaire||''))}
      </div>`;
    const g=f.querySelector('.fp-grille'); if(!g) return;
    const det=document.createElement('details'); det.className='m-modif';
    det.innerHTML='<summary>✏️ Informations modifiables (date, analyse, statut, traitement…)</summary>';
    g.before(ess); g.before(det); det.appendChild(g);
  };
  // CR choisis dans le Drive : au-delà de 10 fichiers, seuls les 10 plus récents sont lus (sauf si l'on demande tout)
  document.getElementById('pdf-import').onchange=e=>{
    let f=[...e.target.files]; e.target.value='';
    if(f.length>10){ f.sort((a,b)=>b.lastModified-a.lastModified);
      if(confirm(`${f.length} fichiers choisis.\n\nOK : ne lire que les 10 plus récents.\nAnnuler : tout lire (plus long).`)) f=f.slice(0,10); }
    if(f.length) importFiles(f);
  };
  // PPC : toujours la vue par prestataire
  try{ state.reglages={...(state.reglages||{}), ppcVue:'cartes'}; }catch(e){}
  render();
})();
</script>
