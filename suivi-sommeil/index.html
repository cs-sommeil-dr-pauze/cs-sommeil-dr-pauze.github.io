<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi consultations sommeil</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2f6e">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Icône de l'onglet : lune et étoiles sur fond bleu nuit (dessin intégré, aucun fichier externe) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c2f6e'/%3E%3Cpath d='M38 12a20 20 0 1 0 14 34A17 17 0 0 1 38 12z' fill='%23ffd43b'/%3E%3Cpath d='M47 14l1.6 3.4 3.4 1.6-3.4 1.6L47 24l-1.6-3.4-3.4-1.6 3.4-1.6z' fill='%23fff'/%3E%3Ccircle cx='53' cy='31' r='2' fill='%23fff'/%3E%3C/svg%3E">
<script>
// Thème choisi (sinon celui de Windows), appliqué avant l'affichage pour éviter un flash blanc
(function(){ let t=null; try{ t=localStorage.getItem('suiviSommeil_theme'); }catch(e){}
  if(!t) t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t; })();
</script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e3e6ec;
  --accent:#2c5fd4; --accent-soft:#e8eefc;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#b26a00; --warn-soft:#fdf1dc;
  --bad:#c0352b; --bad-soft:#fbe5e3; --info:#6a43c4; --info-soft:#eee8fb;
  --none:#8a8f9c; --none-soft:#eef0f3;
  --line-strong:#c5cad4; --field:#fff; --surface2:#fafbfc; --mix:#fff;
  --lime:#5d7a12; --lime-soft:#eef6d9;
  --alerte-bg:#ffe57a; --alerte-bord:#e0b400; --alerte-soft:#fff8d6; --alerte-ink:#7a5c00; --ocr-bg:#fff8d6;
  --dbl-bg:#fffdf3; --ctrl-bg:#fffbe6; --mois-bg:#2c3446; --bulk-bg:#1d2a4a;
  --doc:#0b6bb8; --doc-bg:#e6f1fb; --appel:#1f8a4c; --appel-bg:#eaf6ee;
  color-scheme:light;
}
/* Mode sombre (bouton 🌙 / ☀️ en haut à droite) */
:root[data-theme="dark"]{
  --bg:#14171d; --card:#1d2129; --ink:#e4e7ee; --muted:#9aa3b5; --line:#323846; --line-strong:#4a5367;
  --field:#252a34; --surface2:#232833; --mix:#1d2129;
  --accent:#6b9bff; --accent-soft:#25335a;
  --ok:#4cc382; --ok-soft:#173826; --warn:#f0a83a; --warn-soft:#3d2c10;
  --bad:#ff7a6e; --bad-soft:#42201d; --info:#b49bff; --info-soft:#2e2550;
  --none:#a0a6b3; --none-soft:#2a2f39;
  --lime:#b5d65a; --lime-soft:#2c3515;
  --alerte-bg:#5c4c0c; --alerte-bord:#a88a1c; --alerte-soft:#3d3510; --alerte-ink:#ffd84d; --ocr-bg:#4d4210;
  --dbl-bg:#26230f; --ctrl-bg:#2c2916; --mois-bg:#35405a; --bulk-bg:#0d1630;
  --doc:#6cb6ff; --doc-bg:#14304d; --appel:#4cc382; --appel-bg:#173826;
  color-scheme:dark;
}
:root[data-theme="dark"] .presta,:root[data-theme="dark"] select.presta-sel,:root[data-theme="dark"] .chip:not(.on){color:color-mix(in srgb,var(--pc) 55%,#fff)}
:root[data-theme="dark"] tr.row-sel td:not(.cell-sel){box-shadow:inset 0 0 0 9999px rgba(107,155,255,.16)}
:root[data-theme="dark"] .btn-alerte.on{color:#3d2e00}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);transition:background .2s;color:var(--ink);font:13px/1.35 "Segoe UI",system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:7px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:600}
nav{display:flex;gap:4px}
nav a{padding:4px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
nav a.active{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
main{padding:12px 14px;margin:0 auto}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;padding:4px 10px}
button:hover,.btn:hover{border-color:var(--line-strong)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
.small{padding:1px 6px;font-size:12px}
a.btn{text-decoration:none;display:inline-block}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:var(--field)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 12px;min-width:100px}
.stat b{display:block;font-size:17px}
.stat span{color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:2px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--surface2);font-size:11px;padding-top:5px;padding-bottom:5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
td input[type=text]{width:100%;min-width:110px}
td input[type=date]{width:140px}
td input.num{width:70px;text-align:right}
.iahcell{display:flex;align-items:center;gap:6px}
.cr-btn{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:0 4px;font-size:12px;line-height:18px;height:20px;cursor:pointer;flex:none;margin-right:4px;vertical-align:middle;display:inline-block}
.cr-info{cursor:help;color:var(--muted)}
.cr-btn:hover{border-color:var(--accent);background:var(--info-soft)}
.cr-modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.cr-boite{background:var(--card);color:var(--ink);border-radius:12px;padding:12px;width:min(900px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.cr-page{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:calc(100vh - 130px)}
.cr-page img{display:block;width:100%;height:auto;cursor:zoom-in}
.cr-page img.zoom{width:180%;max-width:none;cursor:zoom-out}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;white-space:nowrap}
.sev-n{background:var(--ok-soft);color:var(--ok)}
.sev-l{background:var(--lime-soft);color:var(--lime)}
.sev-m{background:var(--warn-soft);color:var(--warn)}
.sev-s{background:var(--bad-soft);color:var(--bad)}
select.st-rien{background:var(--none-soft);color:var(--none)}
select.st-analyse{background:var(--info-soft);color:var(--info)}
select.st-cr{background:var(--warn-soft);color:var(--warn)}
select.st-termine{background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line-strong);border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop img{max-width:100%;max-height:260px;border-radius:6px;margin-top:10px;border:1px solid var(--line)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.form label.full{grid-column:1/-1}
.form textarea{min-height:70px;resize:vertical}
.ocr-filled{background:var(--ocr-bg) !important;border-color:#e6c84a !important}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px;display:none}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
details{margin-top:10px}
details pre{white-space:pre-wrap;font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:220px;overflow:auto}
.val-ok{color:var(--ok);font-weight:600}
.val-warn{color:var(--warn);font-weight:600}
.val-bad{color:var(--bad);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.chart{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chart h4{margin:0 0 4px;font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.patienthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.patienthead h2{margin:0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--muted)}
.pv{display:block;font-size:11px;color:var(--muted);margin-top:2px;cursor:help}
.pv.retard{color:var(--bad)}
.card-proche{border-left:4px solid #e6c84a}
.card-proche mark.diff{background:var(--alerte-soft);color:var(--alerte-ink);border-radius:3px;padding:0 2px}
td.pp-lettre{font-weight:700;color:var(--muted);text-align:center;width:22px}
td.rdv-cell{position:relative;cursor:pointer;white-space:nowrap}
td.rdv-cell:hover{background:var(--info-soft)}
.rdv-date{font-weight:600}
.rdv-in{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
.rdv-fait{font-weight:600;color:var(--ok)}
.rdv-date.fin-retard{color:var(--bad)} .rdv-date.fin-bientot{color:var(--warn)}
.coord{display:flex;flex-direction:column;gap:2px}
.coord input{font-size:12px;padding:2px 5px;width:150px}
.rdv-actions{margin-left:4px;opacity:.35;white-space:nowrap}
td.rdv-cell:hover .rdv-actions{opacity:1}
.rdv-actions button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 5px;margin-left:2px;font-size:12px;line-height:18px;border-radius:5px;cursor:pointer}
.rdv-actions .rdv-ok{color:var(--ok);font-weight:700}
.rdv-actions .rdv-x{border-color:transparent;background:none;color:var(--muted);font-size:14px}
.bulk input[type=date]{color:var(--ink)}
.importlog{border-left:4px solid var(--accent)}
.importlog ul{margin:6px 0 0;padding-left:18px}
body.dragging main{outline:3px dashed var(--accent);outline-offset:-8px;border-radius:12px}
/* Date discrète, nom mis en valeur */
td .datecell{display:flex;align-items:center;gap:2px}
table.fixed td .datecell input.date-sm{flex:1;width:auto;min-width:0}
.cal-btn{position:relative;flex:none;font-size:12px;line-height:1;opacity:.65;cursor:pointer;padding:2px}
.cal-btn:hover{opacity:1}
table.fixed td input.cal-in,input.cal-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
td input.date-sm{font-size:11px;color:var(--muted);width:118px;padding:2px 4px;border-color:transparent;background:transparent}
td input.nom-in{font-size:14px;font-weight:700;letter-spacing:.02em;border-color:transparent;background:transparent;min-width:200px}
td input.prenom-in{font-size:14px;font-weight:500;border-color:transparent;background:transparent}
td input.date-sm:hover,td input.nom-in:hover,td input.prenom-in:hover{border-color:var(--line);background:var(--field)}
td input.date-sm:focus,td input.nom-in:focus,td input.prenom-in:focus{background:var(--field)}
/* Lignes des patients sous PPC : fond teinté et bande de la couleur du prestataire */
tr.row-ppc td{background:color-mix(in srgb,var(--pc) 13%,var(--mix));border-top:2px solid color-mix(in srgb,var(--pc) 45%,var(--mix));border-bottom:2px solid color-mix(in srgb,var(--pc) 45%,var(--mix))}
tr.row-ppc td:first-child{box-shadow:inset 6px 0 0 var(--pc)}
/* Pastilles prestataires */
.presta{display:inline-block;padding:2px 9px;border-radius:10px;font-weight:600;font-size:13px;background:color-mix(in srgb,var(--pc) 14%,var(--mix));color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 40%,var(--mix));white-space:nowrap}
select.presta-sel{font-weight:600;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--mix));border-color:color-mix(in srgb,var(--pc) 45%,var(--mix))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid color-mix(in srgb,var(--pc) 40%,var(--mix));background:var(--card);color:var(--pc);border-radius:16px;padding:5px 12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--pc);color:#fff;border-color:var(--pc)}
.chip .n{opacity:.75;font-weight:500;margin-left:4px}
/* Camembert de répartition par prestataire (page Patients PPC) */
.camembert{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.cam-graph{position:relative;flex:none}
.camembert path.part{stroke:var(--card);stroke-width:2;cursor:pointer;transition:opacity .15s}
.camembert svg:hover path.part{opacity:.55}
.camembert svg:hover path.part:hover,.camembert path.part.on{opacity:1}
.camembert path.part.on{stroke:var(--ink);stroke-width:2}
.cam-total{font-size:26px;font-weight:700;fill:var(--ink)}
.cam-sous{font-size:10px;fill:var(--muted)}
.cam-bulle{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5}
.cam-leg{display:flex;flex-direction:column;gap:3px;min-width:230px}
.cam-leg .leg{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;padding:2px 6px;border-radius:6px;text-align:left}
.cam-leg .leg:hover,.cam-leg .leg.on{border-color:var(--line);background:var(--surface2)}
.cam-leg .pastille{width:10px;height:10px;border-radius:3px;flex:none}
.cam-leg .leg-nom{flex:1;min-width:90px}
.cam-leg .leg b{min-width:24px;text-align:right}
/* Logos des prestataires : petits, sur pastille blanche (lisibles aussi en mode sombre) */
img.logo-p{height:14px;width:auto;max-width:46px;object-fit:contain;vertical-align:-3px;margin-right:5px;background:#fff;border-radius:3px;padding:1px 2px}
/* Choix fait : seulement le logo + une petite flèche ; le menu (invisible) recouvre le tout et s'ouvre au clic */
.choix-logo{position:relative;display:inline-flex;align-items:center;gap:4px;padding:2px 5px;border-radius:7px;border:1px solid transparent;cursor:pointer;max-width:100%;vertical-align:middle}
.choix-logo:hover{border-color:var(--line);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.choix-logo:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.choix-logo select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;border:0}
.choix-logo .fleche{font-size:10px;color:var(--muted);line-height:1}
img.logo-choix{height:22px;width:auto;max-width:96px;object-fit:contain;display:block;background:#fff;border-radius:4px;padding:1px 3px}
.presta-logo{display:inline-flex;vertical-align:middle}
.presta-cell{display:flex;align-items:center;gap:2px}
.presta-cell img.logo-p{flex:none;margin-right:2px}
table.fixed td .presta-cell select{flex:1;min-width:0}
tr.mois img.logo-p{height:12px}
/* Colonnes à largeur réglable */
table.fixed{table-layout:fixed}
table.fixed td,table.fixed th{overflow:hidden;text-overflow:ellipsis}
table.fixed td input,table.fixed td select{width:100%;min-width:0;max-width:100%}
table.fixed td input.num{width:52px;flex:none}
table.fixed .iahcell{overflow:hidden}
th{position:relative}
.rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;border-right:2px solid transparent}
.rz:hover{border-right-color:var(--accent)}
/* Déplacement des colonnes */
th.col-drag{opacity:.35;outline:2px dashed var(--accent);outline-offset:-2px}
.col-indic{position:fixed;width:4px;background:var(--accent);z-index:30;pointer-events:none;border-radius:2px;box-shadow:0 0 6px var(--accent)}
body.col-moving,body.col-moving *{cursor:grabbing !important;user-select:none}
/* Patients prioritaires : IAH > 30 non terminés */
tr.row-alerte td{background:var(--alerte-bg) !important}
.btn-alerte{background:var(--alerte-soft);border-color:#e6c84a;color:var(--alerte-ink);font-weight:600}
.btn-alerte.on{background:#f5c400;border-color:#c9a000;color:#3d2e00}
.btn-filtre{font-weight:600}
/* Patients compliqués */
textarea.txt{width:100%;min-width:220px;resize:vertical;font-size:12px;line-height:1.3}
tr.cx-detail>td{background:var(--surface2);padding:8px 10px 10px}
.cx-drop{padding:12px}
.cx-import{padding:8px 10px}
.cx-import-ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cx-import-ligne .drop{flex:1;min-width:300px;padding:10px;text-align:left}
#cx-glob-msg details{margin-top:6px}
#cx-glob-msg summary{cursor:pointer}
.cx-import[hidden]{display:none}
button.on-import{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cx-table textarea.txt{min-width:170px}
/* IAH centré dans le tableau des consultations */
#t-consult .iahcell{justify-content:center}
#t-consult input.iah-in{font-size:14px}
#t-consult input.iah-in.iah-fort{font-weight:700;color:var(--warn)}
#t-consult input.iah-in.iah-grave{font-weight:800;color:var(--bad);background:var(--bad-soft);border-radius:5px}
/* Statut « CR fait » (annonce pas encore faite) : teinte discrète + fin liseré */
/* IAH > 30 : simple filet rose pâle à gauche (la gravité se lit déjà sur l'IAH en rouge) ;
   les patients PPC gardent seulement le filet de leur prestataire */
#t-consult tr.row-iah30:not(.row-ppc) td:first-child{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--bad) 38%,transparent)}
#t-consult tr.row-ppc td:first-child{box-shadow:inset 4px 0 0 color-mix(in srgb,var(--pc) 80%,transparent)}
/* IAH > 30 pas encore terminé : jaune franc + bordures */
#t-consult tr.row-alerte td{border-top:2px solid var(--alerte-bord);border-bottom:2px solid var(--alerte-bord)}
#t-consult td input.num{text-align:center}
#t-consult th[data-k="iah"]{text-align:center}
#t-consult .pv{text-align:center}
.barre-options{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn-panneau{font-weight:600;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.btn-panneau .fl{color:var(--muted);margin-left:4px}
.btn-panneau.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-panneau.on .fl{color:#fff}
.filtres-actifs{background:var(--alerte-soft);color:var(--alerte-ink);border-radius:8px;padding:4px 8px;font-size:13px}
.opts-grille{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"gauche ajout";gap:10px;margin-bottom:12px}
/* colonne de gauche : blocs empilés sans trou ; les blocs repliés se rangent côte à côte en simples titres */
.opts-gauche{grid-area:gauche;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-width:0}
.opts-gauche>.opt-box{flex:1 1 100%}
.opts-gauche>.opt-box.replie{flex:0 1 auto}
/* Options sur toute la largeur : blocs empilés, les blocs repliés deviennent de simples titres alignés ; « Ajouter » en boutons côte à côte */
.opts-grille{display:block}
.opts-gauche{display:flex}
.opt-ajout{flex-direction:row!important;flex-wrap:wrap;align-items:stretch;gap:6px!important}
.opt-ajout>h4{flex:1 1 100%}
#ajout-pop{position:fixed;z-index:40;right:16px;top:var(--haut-entete,110px);width:min(380px,calc(100vw - 32px));max-height:calc(100vh - var(--haut-entete,110px) - 20px);overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.22)!important;flex-direction:column!important;flex-wrap:nowrap!important}
#ajout-pop[hidden]{display:none!important}
#ajout-pop>*:not(h4){width:100%!important;min-width:0!important}
#ajout-pop>h4{display:flex;align-items:center}
#btn-ajout.ouvert{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.opt-ajout>*:not(h4){flex:0 1 auto;margin:0!important;width:auto!important;min-width:150px}
.opt-ajout>#add{min-width:0;align-self:stretch;display:flex!important;align-items:center}
.opt-ajout .imp-groupe{flex-direction:row!important;align-items:center;gap:8px;padding:5px 8px!important}
.opt-ajout .imp-lieux{display:flex!important;gap:6px}

.opts-grille[hidden]{display:none}
.opt-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.opt-box h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.opt-box h4 .hint{text-transform:none;letter-spacing:0;font-weight:400}
.opt-box .stats{margin:0}
.opt-stats{grid-area:stats} .opt-filtres{grid-area:filtres} .opt-recherche{grid-area:recherche} .opt-adr{grid-area:adresseurs}
.opt-filtres{border-left:4px solid #e6c84a}
/* Filtres rapides en couleur : teinte légère, puis couleur pleine quand le filtre est actif */
.btn-fc{font-weight:600;border:1.5px solid color-mix(in srgb,var(--fc) 55%,transparent);background:color-mix(in srgb,var(--fc) 13%,var(--card));color:color-mix(in srgb,var(--fc) 75%,var(--ink))}
.btn-fc b{margin-left:3px}
.btn-fc:hover{background:color-mix(in srgb,var(--fc) 24%,var(--card))}
.btn-fc.on{background:var(--fc);border-color:var(--fc);color:#fff}
.mp-grille{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.mp-grille label,.mp-texte{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.mp-grille input,.mp-texte textarea{font-size:14px;color:var(--ink)}
.mp-texte textarea{font-family:inherit;line-height:1.45;resize:vertical}
.mp-capture{margin:8px 0;border:2px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}
.mp-capture:focus,.mp-capture:hover{border-color:var(--accent);outline:none}
.lien-favori{display:inline-block;padding:9px 18px;border-radius:999px;background:var(--degrade);color:#fff;font-weight:700;text-decoration:none;cursor:grab;box-shadow:0 6px 14px -6px rgba(84,72,232,.7)}
#t-consult input.adr-in{color:var(--info);font-weight:600}
#t-consult input.adr-in::placeholder{color:var(--muted);font-weight:400}
.imp-groupe{border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:6px;background:var(--surface2)}
.imp-titre{font-weight:600;font-size:13px}
.imp-lieux{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.imp-lieu{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;border:1px solid color-mix(in srgb,var(--fc) 40%,var(--line));background:color-mix(in srgb,var(--fc) 8%,var(--card));padding:5px 6px;border-radius:8px;font-weight:700;color:var(--fc);font-size:12.5px}
.imp-lieu:hover{background:color-mix(in srgb,var(--fc) 16%,var(--card));border-color:var(--fc)}
.imp-lieu img.logo-an{height:18px;margin:0;flex:none}
.imp-lieu span{overflow:hidden;text-overflow:ellipsis}
.choix-lieu{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.choix-lieu img.logo-an{height:14px}
.fdnd{cursor:grab}
.fdnd-tire{opacity:.4}
.fdnd-avant{box-shadow:-3px 0 0 var(--accent)} .fdnd-apres{box-shadow:3px 0 0 var(--accent)}
.sep-filtres{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
/* Analyse : PG bleu, PSG rose */
select.sel-an{font-weight:700;width:100%}
select.sel-an.an-PG{background:color-mix(in srgb,#1e63c6 14%,var(--card));color:#1e63c6;border-color:color-mix(in srgb,#1e63c6 45%,transparent)}
select.sel-an.an-PSG{background:color-mix(in srgb,#d63384 14%,var(--card));color:#d63384;border-color:color-mix(in srgb,#d63384 45%,transparent)}
:root[data-theme="dark"] .btn-fc:not(.on){color:color-mix(in srgb,var(--fc) 50%,#fff)}
:root[data-theme="dark"] select.sel-an.an-PG{color:#7fb0ff} :root[data-theme="dark"] select.sel-an.an-PSG{color:#ff8cc0}
.opt-filtres.actif{box-shadow:0 0 0 2px var(--accent) inset}
.opt-ajout{grid-area:ajout;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--accent)}
.opt-ajout>.btn,.opt-ajout>button{text-align:left;width:100%;box-sizing:border-box;display:block}
.opt-ajout .sous{display:block;font-size:11px;font-weight:400;opacity:.75}
.dossier-cr{border:1px dashed var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.dossier-cr .sous{display:block;font-size:11px;color:var(--muted)}
.dossier-cr.attente{border-color:var(--warn);background:var(--warn-soft)}
@media (max-width:900px){ .opts-grille{grid-template-columns:1fr;grid-template-areas:"ajout" "gauche"} }
#zone-options[hidden],p.hint[hidden]{display:none}
.card-doublons{border:2px solid #e6c84a;background:var(--dbl-bg)}
.card-maj{border:2px solid var(--accent)}
/* Sélection multiple et actions groupées */
td.cell-sel,th.cell-sel{text-align:center;padding:0}
td.cell-sel{cursor:pointer;user-select:none}
td.cell-sel:hover{background:var(--accent-soft) !important}
body.selecting,body.selecting *{cursor:ns-resize !important;user-select:none}
td.cell-sel input,th.cell-sel input{width:15px;height:15px;cursor:pointer}
tr.row-sel td:not(.cell-sel){box-shadow:inset 0 0 0 9999px rgba(44,95,212,.14)}
table.fixed tr.mois input.sel-mois{width:15px;height:15px;margin:0 6px 0 0;vertical-align:middle;cursor:pointer}
#wrap-consult{zoom:var(--zoom-tab,1)}
/* ---- Tableau des consultations : affichage plus léger, couleurs adoucies ---- */
.tab-outils{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.cols-menu{position:relative}
.cols-liste{position:absolute;z-index:30;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:8px 10px;display:grid;grid-template-columns:repeat(2,minmax(150px,auto));gap:4px 14px;font-size:13px}
.cols-liste[hidden]{display:none}
.cols-liste label{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.cols-liste button{grid-column:1/-1;margin-top:4px}
.th-masquer{position:absolute;right:9px;top:50%;transform:translateY(-50%);display:none;width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);cursor:pointer;z-index:2}
#t-consult th:hover .th-masquer{display:block}
.th-masquer:hover{color:#fff;background:#e03131;border-color:#e03131}
.tab-outils button.on{background:color-mix(in srgb,var(--accent) 14%,var(--card));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
/* Lignes plus basses ; nom, prénom et IAH mis en avant */
#t-consult td{padding-top:1px;padding-bottom:1px;line-height:1.2}
#t-consult td input,#t-consult td select{padding-top:1px;padding-bottom:1px}
#t-consult td img.logo-choix,#t-consult td .presta-logo img{max-height:18px}
#t-consult td .ct svg{width:16px;height:16px}
#t-consult .nom-lien{font-size:15px;font-weight:700;letter-spacing:.02em;padding:2px 6px}
#t-consult td input.prenom-in{font-size:15px;font-weight:600}
#t-consult input.iah-in{font-size:16px;font-weight:700}
.st-cell{display:flex;align-items:center;gap:6px;min-width:0}
.st-cell select{flex:1;min-width:0}
.ct-vide{border:1px dashed var(--line);background:transparent;color:var(--muted);width:22px;height:22px;border-radius:50%;padding:0;line-height:18px;font-size:12px;cursor:pointer}
.ct-vide:hover{border-color:var(--accent);color:var(--accent)}
.ct-menu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:5px;display:flex;flex-direction:column;gap:3px}
.ct-menu button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer;font:inherit;color:inherit;text-align:left;white-space:nowrap}
.ct-menu button:hover,.ct-menu button.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ct-menu .ct-retirer{color:var(--muted);font-size:12px}
#t-consult .ct.on{box-shadow:none}
.nom-cell{display:flex;align-items:center;gap:4px;min-width:0}
.nom-cell .nom-lien{flex:1;min-width:0}
.ic-informer{flex:none;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#e8590c;font-size:8px;line-height:1;box-shadow:0 0 0 1px color-mix(in srgb,#e8590c 30%,transparent);cursor:help}
/* à gauche de l'IAH : 📣 à informer + petit logo du prestataire PPC (IAH > 15) ; largeur fixe pour aligner les IAH */
.iah-ics{flex:none;display:inline-flex;align-items:center;justify-content:flex-end;gap:3px;width:46px}
.iah-presta{height:12px;max-width:26px;object-fit:contain}
.ic-trait{display:inline-flex;align-items:center;font-size:12px;line-height:1;cursor:default}
.ic-presta-choix{all:unset;box-sizing:border-box;width:16px;height:16px;border-radius:50%;border:1.5px dashed #2e8b3e;color:#2e8b3e;font-size:11px;font-weight:800;line-height:13px;text-align:center;cursor:pointer}
.ic-presta-choix:hover{background:#2e8b3e;color:#fff;border-style:solid}
.ct-menu .logo-p{height:14px;max-width:34px;object-fit:contain}
.medecins-liste td{padding:3px 6px}
.medecins-liste input[type=text]{width:100%}
.iah-presta-txt{font-size:9px;font-weight:700;color:var(--pc);border:1px solid var(--pc);border-radius:3px;padding:0 2px;line-height:11px}
/* vue simplifiée : chaque mois sur deux colonnes */
#t-consult.t-duo{border-collapse:collapse}
#t-consult.t-duo>tbody>tr.duo>td{padding:4px 0 12px;background:transparent;border:0}
.duo-grille{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-start}
table.mini{flex:none}
.cols-menu[hidden]{display:none}
.a-informer-l{flex:none;font-size:11px;font-weight:600;color:#c2410c;background:color-mix(in srgb,#e8590c 14%,var(--card));border:1px solid color-mix(in srgb,#e8590c 40%,transparent);border-radius:999px;padding:0 8px;line-height:18px;white-space:nowrap}
.nom-lien{all:unset;cursor:pointer;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 6px;border-radius:5px}
.nom-lien:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);text-decoration:underline}
.fp-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.fp-champ{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fp-champ.fp-large{grid-column:1/-1}
.fp-champ input,.fp-champ select,.fp-champ textarea{font-size:14px;color:var(--ink)}
.fp-bloc{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fp-autre{font-size:12px}
.docs-cell{white-space:nowrap;overflow-x:auto}
.doc-ic{border:1.5px solid color-mix(in srgb,var(--dc) 70%,transparent);background:color-mix(in srgb,var(--dc) 12%,var(--card));border-radius:7px;padding:0 5px;height:24px;min-width:28px;font-size:14px;line-height:20px;cursor:pointer;margin-right:4px;vertical-align:middle}
.doc-ic:hover{background:color-mix(in srgb,var(--dc) 28%,var(--card));transform:translateY(-1px)}
.barre-h{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 8px;margin-top:6px;box-shadow:0 -4px 14px rgba(0,0,0,.10)}
.barre-h .zoom-tab{display:flex;align-items:center;gap:3px;white-space:nowrap;font-size:13px}
.barre-h .zoom-tab button{min-width:28px}
.barre-h .defil{flex:1;overflow-x:auto;overflow-y:hidden;height:16px}
.barre-h .defil>div{height:1px}
.barre-h .defil::-webkit-scrollbar{height:14px}
.barre-h .defil::-webkit-scrollbar-track{background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:7px}
.barre-h .defil::-webkit-scrollbar-thumb{background:#8d97ab;border-radius:7px;border:2px solid transparent;background-clip:padding-box}
.barre-h .defil::-webkit-scrollbar-thumb:hover{background:#5f6b82;background-clip:padding-box}
.barre-h ~ .bulk{bottom:44px}
.bulk{position:sticky;bottom:0;z-index:4;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--bulk-bg);color:#fff;padding:8px 12px;border-radius:10px;margin-top:8px;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
.bulk[hidden]{display:none}
.bulk label{display:flex;gap:4px;align-items:center;font-size:12px}
.bulk .hint{color:#c9d3ea}
.bulk select{color:var(--ink)}
.bulk button.danger{background:var(--card)}
/* Page OAM */
tr.row-ctrl td{background:var(--ctrl-bg)}
select.sel-realise.v-oui,select.sel-controle.v-faite{background:var(--ok-soft);color:var(--ok);font-weight:600}
select.sel-realise.v-non{background:var(--bad-soft);color:var(--bad);font-weight:600}
select.sel-realise.v-encours,select.sel-controle.v-programmee{background:var(--info-soft);color:var(--info);font-weight:600}
select.sel-controle.v-aprogrammer{background:var(--warn-soft);color:var(--warn);font-weight:600}
input.num.val-ok{color:var(--ok)} input.num.val-warn{color:var(--warn)} input.num.val-bad{color:var(--bad)}
.btn-filtre.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* Séparateurs de mois */
tr.mois td{background:var(--mois-bg);color:#fff;font-weight:700;font-size:13px;padding:5px 10px;cursor:pointer;border-top:8px solid var(--bg)}
tr.mois:first-child td{border-top:0}
tr.mois .fl{display:inline-block;width:14px}
tr.mois .mois-n{font-weight:400;font-size:12px;opacity:.85;margin-left:10px}
table.fixed tr.mois td{overflow:visible}
tr.mois .mois-ligne{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
tr.mois .mois-presta{font-size:11px;padding:0 7px;line-height:17px}
tr.mois .mois-euros{margin-left:auto;position:sticky;right:10px;background:#1f8a4c;color:#fff;border-radius:8px;padding:1px 9px;font-weight:700}
.compta .compta-ans{display:flex;gap:10px;flex-wrap:wrap}
.compta-blocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.compta-bloc{border:1px solid var(--line);border-left:4px solid var(--fc);border-radius:8px;padding:8px 10px}
.compta-titre{font-weight:800;color:var(--fc);background:color-mix(in srgb,var(--fc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--fc) 35%,transparent);border-radius:6px;padding:1px 9px 1px 4px;display:inline-flex;align-items:center;gap:5px}
.an-cell{display:flex;align-items:center;gap:4px;min-width:0}
.an-cell select{flex:1;min-width:0}
img.logo-an{height:16px;width:auto;flex:none;vertical-align:-3px;margin-right:4px;background:#fff;border-radius:3px;padding:1px}
.an-cell img.logo-an{margin-right:0}
.compta-titre img.logo-an{height:18px;margin:0}
.compta .compta-an{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:4px 14px;min-width:120px}
.compta .compta-an b{font-size:17px;color:var(--ok)}
tr.mois .mois-alerte{background:#f5c400;color:#3d2e00;border-radius:8px;padding:1px 7px;font-weight:600}
/* Communication des résultats */
/* Contact avec le patient : icônes cliquables (la couleur = choisi) */
.contact{display:flex;gap:6px;justify-content:center;align-items:center}
/* Patient pas encore informé : case orangée + étiquette « À informer » */
#t-consult td.td-informer{box-shadow:inset 0 0 0 9999px color-mix(in srgb,#e8590c 12%,transparent)}
.a-informer{font-size:10.5px;font-weight:700;color:#fff;background:#e8590c;border-radius:9px;padding:1px 7px;white-space:nowrap;letter-spacing:.01em}
:root[data-theme="dark"] .a-informer{background:#f08c4b;color:#2a1405}
td.td-informer .ct{opacity:.5}
.somnum-masques{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);border:1px dashed color-mix(in srgb,#d63384 45%,var(--line));border-radius:8px;padding:3px 8px;cursor:pointer}
.somnum-masques img.logo-an,.voir-somnum img.logo-an{height:14px;margin-right:2px}
.voir-somnum{display:inline-flex;align-items:center;gap:4px}
.mois-informer{background:#e8590c;color:#fff;border-radius:8px;padding:0 7px;font-weight:600}
button.mois-informer{border:0;font:inherit;font-weight:600;line-height:inherit;cursor:pointer;min-height:0}
button.mois-informer:hover{background:#c2410c;text-decoration:underline}
.ic-informer[data-informer-mois]{cursor:pointer}
/* sélection au rectangle */
.lasso{position:fixed;z-index:70;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:3px;pointer-events:none}
body.selecting.lasso-on,body.selecting.lasso-on *{cursor:crosshair !important}
/* date : bouton (plus d'icône calendrier) + petite fenêtre saisie / calendrier */
.date-btn{all:unset;cursor:pointer;font-size:12px;color:var(--muted);padding:2px 5px;border-radius:5px;white-space:nowrap}
.date-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.dt-menu{padding:8px;gap:6px;width:236px}
.dt-saisie{display:flex;gap:6px}
.dt-saisie input{flex:1;min-width:0}
.dt-tete{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.dt-tete b{text-transform:capitalize;font-size:13px}
.dt-menu .dt-tete button{padding:2px 9px;justify-content:center}
.dt-grille{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dt-js{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.dt-menu .dt-grille button{justify-content:center;padding:4px 0;font-size:12px;border-radius:6px}
.dt-menu .dt-grille button.auj{box-shadow:inset 0 0 0 1px var(--accent)}
.dt-menu .dt-grille button.on{background:var(--accent);color:#fff}
.ct{display:inline-flex;padding:1px;border:0;background:transparent;border-radius:50%;cursor:pointer;opacity:.28;filter:grayscale(1);transition:.15s}
.ct:hover{opacity:.7;filter:none}
.ct.on{opacity:1;filter:none;box-shadow:0 0 0 2px var(--card),0 0 0 3px currentColor}
.nav-n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#e8590c;color:#fff;font-size:11px;font-weight:700;text-align:center;margin-left:3px}
.af-bloc{border-left:4px solid var(--fc)}
.af-bloc h3{margin:0 0 4px;display:flex;align-items:center;gap:8px}
.nb-af{background:var(--fc);color:#fff;border-radius:9px;padding:0 8px;font-size:13px}
.retard-af{color:var(--bad);font-weight:700}
.table-af img.logo-an{height:15px}
.table-af .iah-fort{font-weight:700;color:var(--warn)} .table-af .iah-grave{font-weight:800;color:var(--bad)}
select.info-Doctolib{background:var(--doc-bg);color:var(--doc);font-weight:600}
select.info-Appel{background:var(--appel-bg);color:var(--appel);font-weight:600}

/* ================= Présentation modernisée ================= */
:root{
  --bg:#eef1f7; --surface2:#f6f8fc; --line:#e2e6ef;
  --ombre:0 1px 2px rgba(16,24,40,.05),0 6px 16px -6px rgba(16,24,40,.08);
  --ombre-haute:0 10px 30px -10px rgba(16,24,40,.25);
  --rayon:14px;
  --entete-bg:rgba(255,255,255,.86);
  --degrade:linear-gradient(135deg,#3b5bdb 0%,#7048e8 100%);
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface2:#1a1f29; --line:#2b3240;
  --ombre:0 1px 2px rgba(0,0,0,.35),0 8px 20px -10px rgba(0,0,0,.6);
  --ombre-haute:0 12px 34px -10px rgba(0,0,0,.7);
  --entete-bg:rgba(22,26,34,.86);
  --degrade:linear-gradient(135deg,#4c6ef5 0%,#845ef7 100%);
}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;font-size:13px;letter-spacing:-.003em;
  background:radial-gradient(1200px 400px at 10% -10%,color-mix(in srgb,#7048e8 7%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
main{padding:18px 22px 40px}

/* En-tête : barre translucide, marque, onglets en pastilles */
header{background:var(--entete-bg);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);padding:10px 22px;gap:22px;box-shadow:0 1px 0 rgba(16,24,40,.02)}
header h1{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:-.01em}
header h1 small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
header h1 > span:last-child{display:flex;flex-direction:column;line-height:1.15}
.marque{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--degrade);font-size:18px;box-shadow:0 6px 14px -6px rgba(84,72,232,.7)}
nav{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
nav a{padding:6px 13px;border-radius:9px;font-weight:600;font-size:13px;transition:background .15s,color .15s}
nav a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
nav a.active{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.12)}
:root[data-theme="dark"] nav a.active{background:color-mix(in srgb,var(--accent) 22%,var(--card));color:#fff}
.actions-entete{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions-entete button{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.actions-entete button:hover{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.actions-entete #btn-theme{border-color:var(--line);background:var(--card);color:var(--ink)}
.actions-entete button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Boutons et champs */
button,.btn{border-radius:9px;padding:5px 12px;font-weight:500;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
button:active,.btn:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 10px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
button.primary:hover{filter:brightness(1.07)}
.small{padding:2px 8px;border-radius:7px}
input,select,textarea{border-radius:8px;padding:3px 7px;border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 22%,transparent);outline-offset:0}

/* Cartes et sections */
.card{border-radius:var(--rayon);padding:16px 18px;box-shadow:var(--ombre);border-color:color-mix(in srgb,var(--line) 85%,transparent)}
h2{font-size:20px;font-weight:700;letter-spacing:-.015em}
h3{font-weight:700;letter-spacing:-.01em}
.barre-options{margin-bottom:14px}
.btn-panneau{border-radius:11px;padding:8px 15px;box-shadow:var(--ombre)}
.btn-panneau.on{background:var(--degrade);border-color:transparent}

/* Zone d'options : 4 blocs bien distincts, chacun avec sa couleur */
.opts-grille{gap:14px;margin-bottom:18px}
.opt-box{border-radius:var(--rayon);padding:14px 16px;box-shadow:var(--ombre);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);position:relative;overflow:hidden}
.opt-box::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--sec,var(--accent))}
.opt-box h4{font-size:12px;letter-spacing:.06em;color:var(--sec,var(--muted));display:flex;align-items:center;gap:6px;margin-bottom:10px}
.opt-stats{--sec:#3b5bdb}
.opt-ajout{--sec:#7048e8;border-top:1px solid color-mix(in srgb,var(--line) 85%,transparent)}
.opt-filtres{--sec:#e8590c;border-left:1px solid color-mix(in srgb,var(--line) 85%,transparent)}
.opt-recherche{--sec:#0c8599}
.opt-adr{--sec:#5f3dc4}
.opt-adr.actif{box-shadow:var(--ombre),0 0 0 2px color-mix(in srgb,var(--sec) 60%,transparent)}
.adr-top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.adr-lieux{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.adr-top .btn-fc{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adr-top .rang{opacity:.55;font-weight:400;margin-right:4px}
#f-adr{min-width:260px;max-width:100%}
.adr-fusion{margin-top:8px;border:1px dashed color-mix(in srgb,#e8590c 55%,transparent);border-radius:8px;padding:6px 10px;background:color-mix(in srgb,#e8590c 6%,transparent)}
.adr-fusion summary{cursor:pointer;color:color-mix(in srgb,#e8590c 80%,var(--ink))}
.adr-paire{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.adr-paire:first-of-type{border-top:0}
.adr-actions{display:flex;flex-wrap:wrap;gap:4px}
/* blocs d'options repliables : seul le titre reste */
.opt-box .replier{margin-left:auto;border:1px solid color-mix(in srgb,currentColor 35%,transparent);background:transparent;color:inherit;cursor:pointer;font-size:12px;width:24px;height:22px;padding:0;border-radius:6px;line-height:1;opacity:.75;flex:none;display:inline-flex;align-items:center;justify-content:center}
.opt-box .replier:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}
.opt-box.replie{height:auto!important;min-height:0;resize:none;padding-bottom:4px}
.opt-box.replie>:not(h4){display:none!important}
.opt-box.replie h4{margin-bottom:0}
.opt-box.replie h4 .hint{display:none}
.opt-box.replie{padding:6px 12px 6px;min-height:0}
.opt-box.replie::before{height:2px}
.opt-box.replie h4{font-size:11.5px;gap:8px}
.opt-box.replie .replier{width:20px;height:18px;margin-left:10px}
.opt-filtres.actif{box-shadow:var(--ombre),0 0 0 2px color-mix(in srgb,var(--sec) 60%,transparent)}
/* Blocs plus compacts, et redimensionnables en hauteur (poignée en bas à droite ; taille mémorisée) */
.opts-grille{align-items:start}
.opt-box{padding:10px 14px;resize:vertical;overflow:auto;min-height:46px;align-self:start}
.opt-box h4{margin-bottom:7px}
.opt-box::-webkit-resizer{background:linear-gradient(135deg,transparent 50%,color-mix(in srgb,var(--sec,var(--muted)) 55%,transparent) 50% 60%,transparent 60% 70%,color-mix(in srgb,var(--sec,var(--muted)) 55%,transparent) 70% 80%,transparent 80%)}
.opt-box.taille-perso{box-shadow:var(--ombre),inset 0 -2px 0 color-mix(in srgb,var(--sec,var(--accent)) 25%,transparent)}
.stat{padding:5px 12px;min-width:96px}
.stat b{font-size:19px}
.opt-ajout{gap:5px}
.opt-ajout > button,.opt-ajout > .btn{padding:5px 10px}
.opt-ajout > button,.opt-ajout > .btn{border-radius:10px;padding:7px 10px}

/* Compteurs : tuiles */
.stats{gap:10px}
.stat{border-radius:12px;padding:8px 14px;min-width:110px;background:var(--surface2);border-color:transparent}
.stat b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}

/* Tableaux */
.tablewrap{border-radius:var(--rayon);box-shadow:var(--ombre);border-color:color-mix(in srgb,var(--line) 85%,transparent)}
th{background:var(--surface2);font-size:10.5px;letter-spacing:.06em;padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
td{border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
tbody tr:not(.mois):hover td{background-image:linear-gradient(color-mix(in srgb,var(--accent) 5%,transparent),color-mix(in srgb,var(--accent) 5%,transparent))}
tr.mois td{background:linear-gradient(90deg,var(--mois-bg),color-mix(in srgb,var(--mois-bg) 82%,#7048e8))}

/* Filtres rapides et puces */
.btn-fc{border-radius:999px;padding:4px 12px}
.chip{border-radius:999px}
.badge{border-radius:999px}

/* Fenêtres (compte rendu, mail, sauvegarde) */
.cr-modal{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.cr-boite{border-radius:16px;box-shadow:var(--ombre-haute);padding:16px 18px}

/* Bandeau d'import et zones de dépôt */
.drop{border-radius:var(--rayon)}
.importlog{border-left:4px solid var(--accent)}
.bulk{border-radius:14px;box-shadow:var(--ombre-haute)}
.sync-banniere{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;width:min(820px,calc(100% - 32px));display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:12px 16px;box-shadow:var(--ombre-haute)}
.sync-banniere .hint{display:block;margin-top:2px}
/* Moins de couleurs : filtres rapides et médecins sur fond blanc, seul le texte est coloré ;
   un filtre actif se reconnaît à son contour de la couleur du texte */
.btn-fc,.btn-fc:hover{background:var(--card);border:1.5px solid var(--line)}
.btn-fc:hover{border-color:color-mix(in srgb,var(--fc) 45%,var(--line))}
.btn-fc.on{background:var(--card);border:2px solid var(--fc);color:color-mix(in srgb,var(--fc) 80%,var(--ink));box-shadow:0 0 0 2px color-mix(in srgb,var(--fc) 18%,transparent)}
.adr-top .btn-fc,.adr-top .btn-fc.on{color:var(--ink)}
.adr-top .btn-fc.on{border-color:var(--ink);box-shadow:none}
#t-consult input.adr-in{color:var(--ink)}
/* Statut : petite pastille ronde */
.st-pastille{all:unset;box-sizing:border-box;display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;vertical-align:middle;background:#adb5bd}
button.st-pastille{cursor:pointer;margin:0 auto}
button.st-pastille:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.st-p-rien{background:#adb5bd}
.st-p-cr{background:#f08c00}
.st-p-termine{background:#2f9e44}

/* Calendrier des examens */
.cal-grille{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.55fr));gap:4px;margin-top:8px}
.cal-e{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:2px 6px}
.cal-j{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px 6px;min-height:84px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-j.vide{background:transparent;border:0}
.cal-j.we{background:color-mix(in srgb,var(--line) 35%,var(--card))}
.cal-j.ferie{background:color-mix(in srgb,var(--line) 35%,var(--card))}
.cal-j.auj{box-shadow:0 0 0 2px #1971c2 inset}
.cal-j.averif{border:2px solid #f08c00}
.cal-t{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:2px;flex-wrap:wrap}
.cal-tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.cal-tag.warn{color:#d9480f;border-color:#f5b971}
.cal-p{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;cursor:pointer;font-size:12.5px;padding:1px 3px;border-radius:5px}
.cal-p:hover{background:color-mix(in srgb,#1971c2 10%,transparent)}
.cal-p .logo-an{height:12px}
.cal-p img.logo-p{height:13px;max-width:42px;margin:0;flex:none}
.cal-nom{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-iah{font-weight:700;font-variant-numeric:tabular-nums}
.cal-iah.iah-fort,.toolbar .iah-fort{color:var(--warn)} .cal-iah.iah-grave,.toolbar .iah-grave{color:var(--bad);font-weight:800}
.cal-act{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.cal-ok{font-size:11px}
.cal-ajout{font-size:11px}
.cal-ajout:not(.fort){opacity:0;padding:0 7px}
.cal-j:hover .cal-ajout{opacity:1}
.cal-ajout.fort{border-color:#f08c00;color:#d9480f;font-weight:700}
.cal-form{display:flex;flex-direction:column;gap:3px;width:100%}
.cal-form input{font-size:12.5px;padding:3px 6px;min-width:0}
.cal-form input[name=nom]{text-transform:uppercase}
.cal-form-b{display:flex;gap:4px}
.cal-bloc{margin-bottom:18px}
.cal-stats{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:4px 0 2px;font-size:13px}
.cal-pr{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 5px;background:var(--card)}
.cal-pr img.logo-p{height:14px;margin:0}
.cal-periode{border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:8px 0 4px;background:var(--card)}
.cal-titre{margin:10px 0 0;text-transform:capitalize;display:flex;align-items:center;gap:10px}
.cal-titre .hint{text-transform:none;font-weight:400}
.cal-nb{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--muted)}
.cal-nb button.on{border-color:#1971c2;color:#1971c2;font-weight:700}
.cal-mois{min-width:150px;text-align:center;text-transform:capitalize}
.ml-mini{height:46px;max-width:80px;object-fit:cover;border:1px solid var(--line);border-radius:5px;vertical-align:middle;margin-right:6px;cursor:zoom-in}
.ppc-ouvrir{cursor:pointer}
.ppc-ouvrir:hover b,.ppc-ouvrir:hover{color:#1971c2;text-decoration:underline}
.dp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.dp-c{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);min-width:0}
.dp-large{grid-column:1/-1}
.dp-c h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dp-l{display:flex;gap:10px;font-size:13px;padding:2px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.dp-l>span{color:var(--muted);flex:0 0 150px}
.dp-l>b{font-weight:600;min-width:0}
.dp-l img.logo-p,.dp-mh img.logo-p{height:15px;vertical-align:middle;margin:0 4px 0 0}
.dp-inst{font-size:13px;margin-top:6px}
.dp-inst>span{color:var(--muted)}
.dp-inst>div{white-space:pre-line;background:color-mix(in srgb,var(--line) 25%,transparent);border-radius:6px;padding:4px 8px;margin-top:2px;max-height:140px;overflow:auto}
.dp-kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:6px}
.dp-kpi>div{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted)}
.dp-kpi b{display:block;font-size:15px;color:var(--text,inherit)}
.dp-t{width:100%;border-collapse:collapse;font-size:12.5px}
.dp-t th,.dp-t td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.dp-t td.hint{white-space:normal}
.dp-mail{border-left:3px solid var(--line);padding:3px 8px;margin:4px 0;font-size:13px}
.dp-mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){.dp{grid-template-columns:1fr}.dp-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ts-t{width:100%;border-collapse:collapse;font-size:13px}
.ts-t th,.ts-t td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ts-t th{position:sticky;top:0;background:var(--card);z-index:1}
.ts-t input.ts-pat{width:190px}
.ts-t input.ts-v{width:110px}
.ts-t input.ts-n{width:62px;text-align:right}
.ts-t tr.ts-inconnu td{background:color-mix(in srgb,#f59f00 10%,transparent)}
.pc-vues{display:inline-flex;gap:0;margin-left:6px}
.pc-vues button{border-radius:0}.pc-vues button:first-child{border-radius:8px 0 0 8px}.pc-vues button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.pc-vues button.on{background:#1971c2;color:#fff;border-color:#1971c2}
.pc-resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:6px 0 12px;font-size:14px}
.pc-filtre{border-color:#f5b971;color:#d9480f}.pc-filtre.on{background:color-mix(in srgb,#f08c00 16%,transparent)}
.pc-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(560px,100%),1fr));gap:18px;align-items:start}
.pc-carte{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.pc-tete{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:3px solid var(--pc);background:color-mix(in srgb,var(--pc) 9%,var(--card))}
.pc-tete h3{margin:0;font-size:18px}
.pc-tete img.logo-p{height:30px;max-width:110px;margin:0}
.pc-sans{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--line);font-weight:800;color:var(--muted)}
.pc-nb{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--card)}
.pc-al{font-size:13px;font-weight:700;color:#d9480f}
.pc-cols,.pc-row{display:grid;grid-template-columns:var(--pc-gabarit);gap:8px;align-items:center}
.pc-defile{overflow-x:auto}
.pc-th{position:relative;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.pc-th:hover,.pc-th.on{color:#1971c2}
.pc-grip{position:absolute;top:-7px;bottom:-7px;right:-6px;width:12px;cursor:col-resize}
.pc-grip::after{content:'';position:absolute;top:30%;bottom:30%;left:5px;width:2px;border-radius:2px;background:var(--line)}
.pc-grip:hover,body.pc-redim .pc-grip{background:color-mix(in srgb,#1971c2 35%,transparent)}
body.pc-redim{cursor:col-resize;user-select:none}
.pc-cols{position:sticky;top:0;z-index:1;background:var(--card);padding:7px 16px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.pc-cols span:not(:first-child),.pc-v{text-align:center}
.pc-liste{display:flex;flex-direction:column;max-height:calc(12 * 37px);overflow-y:auto;overscroll-behavior:contain}
.pc-liste.pc-ouvert{max-height:none;overflow:visible}
.pc-row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:var(--pc-gabarit);gap:8px;align-items:center;padding:7px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.pc-row:hover{background:color-mix(in srgb,#1971c2 8%,transparent)}
.pc-row.pc-alerte{background:color-mix(in srgb,#e03131 7%,transparent)}
.pc-row.pc-alerte:hover{background:color-mix(in srgb,#e03131 12%,transparent)}
.pc-nom{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-nom small{margin-left:6px;color:var(--muted);font-size:11.5px}
.pc-v{font-variant-numeric:tabular-nums;font-weight:600}
.pc-d{font-weight:400;color:var(--muted)}
.pc-plus{display:block;width:100%;border:0;border-radius:0;padding:9px;background:transparent;color:#1971c2;font-weight:600;cursor:pointer}
.pc-plus:hover{background:color-mix(in srgb,#1971c2 8%,transparent)}
@media (max-width:640px){.pc-cols{display:none}.pc-row{grid-template-columns:1fr auto auto;row-gap:2px}.pc-row .pc-d{display:none}}
.sv-secours{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sc-liste{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ml-rdv-l{display:block;margin-top:4px}
.ml-sug{color:#2f9e44;font-weight:600}
.ml-complet pre{white-space:pre-wrap;max-height:220px;overflow:auto;font-size:12px;background:color-mix(in srgb,var(--line) 25%,transparent);padding:6px 8px;border-radius:6px;margin:4px 0}
.ml-alerte{color:#d9480f;font-size:12.5px;margin-bottom:3px}
.pr-tete img.logo-p{height:36px;max-width:130px;margin:0}
.pr-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.pr-kpis>div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
.pr-kpis b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.pr-kpis span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.pr-h4{margin:6px 0 8px;font-size:15px}
.pr-an{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;background:var(--card)}
.pr-an-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.pr-an-t span{font-size:13px;color:var(--muted)}
.pr-barres{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end}
.pr-barre{display:flex;flex-direction:column;align-items:center;gap:2px}
.pr-barre i{display:block;width:100%;max-width:26px;border-radius:4px 4px 0 0;background:#1971c2;min-height:2px}
.pr-barre small{font-size:10.5px;color:var(--muted)}.pr-n{font-size:11.5px;font-weight:700;min-height:14px}
.pc-tete h3[title]:hover,.pc-tete img.logo-p[title]:hover{text-decoration:underline;opacity:.85}
.cf-table{width:100%;border-collapse:collapse;font-size:13px}
.cf-table th,.cf-table td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.cf-table td img.logo-p{height:16px;vertical-align:middle}
.cf-table input.cf-url{width:100%;min-width:260px;font-size:12.5px}
.cf-table input.cf-login,.cf-table input.cf-pass{width:150px;font-size:12.5px}
.cf-mdp{display:inline-flex;gap:3px;align-items:center}
.cf-act{display:flex;gap:4px}
.cf-focus{background:color-mix(in srgb,#f59f00 14%,transparent)}
.cf-etat{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.cf-etat.ok{color:#2f9e44;border-color:#2f9e44}
.cm-form{display:flex;flex-direction:column;gap:8px}
.cm-err{color:var(--bad);font-size:13px}
.cal-j.absent{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--line) 45%,var(--card)) 0 6px,var(--card) 6px 12px)}
.cal-tag.cal-tag-abs{color:#5f3dc4;border-color:#b197fc}
.cal-abs{font-size:11px}
.cal-abs:not(.fort):not(.on){opacity:0}
.cal-j:hover .cal-abs{opacity:1}
.cal-abs.fort{border-color:#b197fc;color:#5f3dc4}
.mc-j.abs{text-decoration:line-through;color:#7950f2}
.cal-taux{font-weight:700;font-variant-numeric:tabular-nums}
.cal-fait{color:#2f9e44;font-weight:900;font-size:12px;flex:none}
.cal-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
.cal-main{min-width:0}
.cal-side{position:sticky;top:64px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 76px);overflow:auto}
@media (max-width:900px){.cal-layout{grid-template-columns:1fr}.cal-side{position:static;max-height:none}}
.mc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.mc-tete{display:flex;align-items:center;gap:2px;text-transform:capitalize}
.mc-tete b{flex:1;text-align:center;font-size:14px}
.mc-nav{all:unset;cursor:pointer;padding:2px 6px;border-radius:6px;font-size:15px;color:var(--muted)}
.mc-nav:hover{background:color-mix(in srgb,#1971c2 12%,transparent);color:inherit}
.mc-grille{display:grid;grid-template-columns:24px repeat(7,1fr);gap:2px 0;text-align:center;font-size:12.5px;margin-top:6px}
.mc-e{font-size:11px;color:var(--muted);padding-bottom:2px}
.mc-sem{all:unset;font-size:11px;color:#1971c2;cursor:pointer;align-self:center;text-align:center}
.mc-sem:hover{text-decoration:underline}
.mc-j{all:unset;box-sizing:border-box;height:26px;line-height:26px;border-radius:999px;cursor:pointer;position:relative;font-variant-numeric:tabular-nums;text-align:center}
.mc-j:hover{background:color-mix(in srgb,#1971c2 14%,transparent)}
.mc-j.aff{background:color-mix(in srgb,#1971c2 7%,transparent);border-radius:0}
.mc-j.hors{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.mc-j.auj{background:color-mix(in srgb,#40c057 28%,transparent);border-radius:999px;font-weight:700}
.mc-j.trouve{background:color-mix(in srgb,#f59f00 40%,transparent);border-radius:999px;font-weight:800}
.mc-j.ex::after,.mc-pt{content:'';position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#1971c2}
.mc-j.averif::after,.mc-pt.or{background:#f08c00}
.mc-pt.tr{background:#f59f00;width:8px;height:8px}
.mc-auj{display:block;width:100%;margin-top:6px}
.mc-leg{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.mc-pt{position:static;display:inline-block;margin:0 0 0 6px}
.cal-cherche{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
.cal-cherche input{width:100%;box-sizing:border-box}
.cal-res .hint{margin:0}
.cr-tete{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
.cr-tete button{margin-left:auto}
.cr-p{border-top:1px solid var(--line);padding:6px 0;font-size:13px}
.cr-d{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cr-d button{font-size:11.5px}
.cal-p.trouve{background:color-mix(in srgb,#f59f00 22%,transparent);box-shadow:0 0 0 1px #f59f00 inset}
.cal-j.trouve{border-color:#f59f00}
.cal-sem .cal-j{min-height:96px}
.cal-j.flash{animation:calFlash 1.8s ease-out}
@keyframes calFlash{0%,55%{box-shadow:0 0 0 3px #f59f00;background:color-mix(in srgb,#f59f00 16%,var(--card))}100%{box-shadow:none}}

/* Patients PPC : colonne « Début d'installation » */
.inst-cell{cursor:pointer;max-width:280px;min-width:160px}
.inst-cell:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.inst-txt{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}

/* Mails des prestataires */
.ml-liste{max-height:68vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.ml-mail{padding:10px 12px}
.ml-item{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.ml-g{display:flex;flex-direction:column;gap:4px}
.ml-d{display:flex;flex-direction:column;gap:4px}
.ml-msg{width:100%;font-size:12.5px}
.ml-pjs{border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.mc-etapes{line-height:1.6;padding-left:20px}
.mc-etapes li{margin-bottom:10px}

/* ============ Données ============ */
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(s && Array.isArray(s.consults)) return migrer({consults:s.consults, ppc:s.ppc||{}, oam:s.oam||{}, complexes:s.complexes||{}, distincts:s.distincts||[], reglages:s.reglages||{}, rdv:s.rdv||{}, modifie:s.modifie||0});
  }catch(e){}
  return {consults:[], ppc:{}, oam:{}, complexes:{}, distincts:[], rdv:{}};
}
// Le statut « Sommeil analysé » a été supprimé : les anciennes lignes passent en « CR fait »
function migrer(s){ s.consults.forEach(c=>{ if(c.statut==='analyse') c.statut='cr'; regleStatut(c);
  // ancien import : « Adressé par Dr X » ou « Dr X » rangé dans le commentaire -> colonne « Médecin adresseur »
  if(!c.adresseur && c.commentaire){ const parts=c.commentaire.split(' · '), i=parts.findIndex(p=>/^(adress[ée] par\s+)?(dr\.?|docteur|pr\.?)\s+[A-ZÀ-Þ][\p{L}'-]+(\s+[A-ZÀ-Þ][\p{L}'-]+){0,2}$/iu.test(p.trim()));
    if(i>=0){ c.adresseur=formaterAdresseur(parts[i].replace(/^adress[ée] par\s+/i,'').trim()); parts.splice(i,1); c.commentaire=parts.join(' · '); } }
}); return s; }
// Un patient sous PPC ou OAM est considéré comme « Terminé »
function regleStatut(c){
  if(c.traitement==='PPC' || c.traitement==='OAM') c.statut='termine';
  // Analyse Somnum (polysomnographie) : toujours « Terminé », patient contacté par téléphone
  if(c.analyse==='PSG'){ c.statut='termine'; c.info='Appel'; }
  return c;
}
function save(){
  state.consults.forEach(regleStatut);
  state.modifie=Date.now(); // horodatage : sert à repérer une version plus récente faite sur un autre ordinateur
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ toast('⚠️ Impossible d\'enregistrer dans le navigateur'); }
  // sauvegarde « en continu » dans le dossier (Drive) : écrite ~30 s après la dernière modification
  if(typeof sauvContinu==='function') sauvContinu();
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const patientKey = c => norm(c.nom)+'|'+norm(c.prenom);
const esc = s => String(s??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const num = v => { if(v===''||v==null) return null; const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; };
const fmtDate = d => d ? d.split('-').reverse().join('/') : '';
const dateCourte = d => d ? d.slice(8,10)+'/'+d.slice(5,7) : '';
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2500); }

function severity(iah){
  const n=num(iah); if(n==null) return null;
  if(n<5)  return {cls:'sev-n', label:'Normal'};
  if(n<15) return {cls:'sev-l', label:'Léger'};
  if(n<30) return {cls:'sev-m', label:'Modéré'};
  return {cls:'sev-s', label:'Sévère'};
}
// Observance : "6h45", "6:45", "6,8" -> heures décimales
function parseObs(s){
  if(s==null||s==='') return null;
  s=String(s).trim().toLowerCase();
  let m=s.match(/^(\d{1,2})\s*[h:]\s*(\d{1,2})?/);
  if(m) return +m[1] + (m[2]?+m[2]/60:0);
  const n=num(s); return n;
}
function fmtObs(h){ if(h==null) return ''; const H=Math.floor(h), M=Math.round((h-H)*60); return M===60?`${H+1}h00`:`${H}h${String(M).padStart(2,'0')}`; }

/* ============ Hauteur des blocs d'options : réglée à la souris (poignée en bas à droite), mémorisée avec les données ============ */
const hauteursBlocs = () => (state.reglages && state.reglages.hauteurs) || {};
let hauteursObs=null;
function bindHauteursBlocs(app){
  if(hauteursObs) hauteursObs.disconnect();
  const H=hauteursBlocs();
  app.querySelectorAll('.opt-box[data-bloc]').forEach(b=>{ const h=H[b.dataset.bloc]; if(h){ b.style.height=h+'px'; b.classList.add('taille-perso'); } });
  // petit bouton dans le titre de chaque bloc : replier (ne garder que le titre) / déplier ; mémorisé avec les données
  const R=(state.reglages && state.reglages.replies) || {};
  app.querySelectorAll('.opt-box[data-bloc]').forEach(b=>{ const h4=b.querySelector('h4'); if(!h4) return;
    const k=b.dataset.bloc, maj=()=>{ const r=b.classList.contains('replie'); btn.textContent=r?'▾':'▴'; btn.title=r?'Déplier ce bloc':'Replier ce bloc (ne garder que le titre)'; };
    const btn=document.createElement('button'); btn.type='button'; btn.className='replier';
    if(R[k]) b.classList.add('replie'); maj(); h4.appendChild(btn);
    btn.onclick=e=>{ e.stopPropagation(); b.classList.toggle('replie'); maj();
      const n={...((state.reglages&&state.reglages.replies)||{})}; if(b.classList.contains('replie')) n[k]=true; else delete n[k];
      state.reglages={...(state.reglages||{}), replies:n}; save(); };
  });
  let minuterie=null;
  // la poignée du navigateur écrit une hauteur sur le bloc : on la retient (un peu après la fin du geste)
  hauteursObs=new ResizeObserver(entrees=>{
    clearTimeout(minuterie);
    minuterie=setTimeout(()=>{
      const n={...hauteursBlocs()}; let change=false;
      for(const b of app.querySelectorAll('.opt-box[data-bloc]')){ if(!b.style.height || b.offsetParent===null || b.classList.contains('replie')) continue;
        const h=Math.round(b.getBoundingClientRect().height); if(n[b.dataset.bloc]!==h){ n[b.dataset.bloc]=h; change=true; b.classList.add('taille-perso'); } }
      if(change){ state.reglages={...(state.reglages||{}), hauteurs:n}; save(); }
    },400);
  });
  app.querySelectorAll('.opt-box[data-bloc]').forEach(b=>hauteursObs.observe(b));
  const r=app.querySelector('#hauteurs-reset'); if(r) r.onclick=()=>{ if(state.reglages){ delete state.reglages.hauteurs; save(); } renderConsultations(); };
}

/* ============ Filtres rapides : ordre choisi par glisser-déposer (mémorisé dans ce navigateur) ============ */
const FILTRES_KEY='suiviSommeil_ordreFiltres';
let ordreFiltresMem=null;
function ordreFiltres(){ if(ordreFiltresMem) return ordreFiltresMem; try{ return JSON.parse(localStorage.getItem(FILTRES_KEY))||[]; }catch(e){ return []; } }
function ordonnerFiltres(boutons){
  // bouton ajouté depuis (ex. « Informer via Doctolib ») : placé après son voisin habituel plutôt qu'à la fin
  const o=ordreFiltres(), K=Object.keys(boutons), cles=o.filter(k=>k in boutons);
  K.forEach((k,i)=>{ if(cles.includes(k)) return; const p=cles.indexOf(K[i-1]); cles.splice(p>=0?p+1:cles.length,0,k); });
  return cles.map(k=>boutons[k].replace('<button ',`<button draggable="true" data-fk="${k}" `).replace('class="btn-fc','class="fdnd btn-fc')).join('');
}
function bindFiltresDnd(app){
  const zone=app.querySelector('.filtres-dnd'); if(!zone) return;
  let tire=null;
  zone.querySelectorAll('.fdnd').forEach(el=>{
    el.addEventListener('dragstart',e=>{ tire=el; el.classList.add('fdnd-tire'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',el.dataset.fk); }catch(_){} });
    el.addEventListener('dragend',()=>{ el.classList.remove('fdnd-tire'); zone.querySelectorAll('.fdnd-avant,.fdnd-apres').forEach(x=>x.classList.remove('fdnd-avant','fdnd-apres')); });
    el.addEventListener('dragover',e=>{ if(!tire||tire===el) return; e.preventDefault(); const r=el.getBoundingClientRect(), apres=e.clientX>r.left+r.width/2;
      el.classList.toggle('fdnd-apres',apres); el.classList.toggle('fdnd-avant',!apres); });
    el.addEventListener('dragleave',()=>el.classList.remove('fdnd-avant','fdnd-apres'));
    el.addEventListener('drop',e=>{ e.preventDefault(); if(!tire||tire===el) return;
      const apres=el.classList.contains('fdnd-apres'); el.after?(apres?el.after(tire):el.before(tire)):0;
      const ordre=[...zone.querySelectorAll('.fdnd')].map(x=>x.dataset.fk); ordreFiltresMem=ordre;
      try{ localStorage.setItem(FILTRES_KEY, JSON.stringify(ordre)); }catch(_){}
      zone.querySelectorAll('.fdnd-avant,.fdnd-apres').forEach(x=>x.classList.remove('fdnd-avant','fdnd-apres')); });
  });
}

/* ============ Page « À faire » ============ */
// 1) patients à informer (analyse faite, aucun contact noté)
// 2) examens de plus de 30 jours : compte rendu fait mais statut pas encore « Terminé »
const JOURS_ATTENTE=30;
const dateExamen = c => (c.poly&&c.poly.date) || c.date || '';
const joursDepuis = d => d ? Math.floor((Date.parse(today()+'T12:00:00')-Date.parse(d+'T12:00:00'))/864e5) : null;
// 3) jours à vérifier : en semaine, ~2 polygraphies (PMB) par jour ; un jour ouvré sans examen ou avec un seul est signalé
//    (sauf jour férié ou jour déjà confirmé « normal »), pour n'oublier aucun patient
const ANALYSES_PAR_JOUR=2, JOURS_CONTROLE=60, DELAI_SAISIE=2; // fenêtre contrôlée ; les 2 derniers jours sont laissés à la saisie
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const JOURS_NOMS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function joursFeries(an){ // jours fériés français (Pâques : algorithme de Meeus)
  const a=an%19, b=Math.floor(an/100), c=an%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
    mois=Math.floor((h+l-7*m+114)/31), jour=((h+l-7*m+114)%31)+1, paques=n=>isoLocal(new Date(an,mois-1,jour+n));
  return new Set([`${an}-01-01`,paques(1),`${an}-05-01`,`${an}-05-08`,paques(39),paques(50),`${an}-07-14`,`${an}-08-15`,`${an}-11-01`,`${an}-11-11`,`${an}-12-25`]);
}
function joursAVerifier(){
  const ok={...((state.reglages||{}).joursOK||{}), ...((state.reglages||{}).absences||{})}, parJour={}; // jours confirmés normaux ou d'absence : jamais signalés
  for(const c of state.consults){ const d=dateExamen(c); if(!c.nom || !d || c.analyse==='PSG') continue; (parJour[d]=parJour[d]||[]).push(c); }
  const dates=Object.keys(parJour).sort(); if(!dates.length) return [];
  const fin=new Date(); fin.setHours(12,0,0,0); fin.setDate(fin.getDate()-DELAI_SAISIE);
  const debut=new Date(fin); debut.setDate(debut.getDate()-JOURS_CONTROLE);
  const premier=new Date(dates[0]+'T12:00:00'); if(premier>debut) debut.setTime(premier.getTime()); // pas avant le 1er examen noté
  const out=[], feries={};
  for(const x=new Date(debut); x<=fin; x.setDate(x.getDate()+1)){
    const j=x.getDay(), d=isoLocal(x), an=x.getFullYear();
    if(j===0 || j===6 || ok[d]) continue;
    if(!(feries[an]=feries[an]||joursFeries(an)).has(d)){ const l=parJour[d]||[]; if(l.length<ANALYSES_PAR_JOUR) out.push({date:d, jour:j, patients:l}); }
  }
  return out.reverse(); // les plus récents d'abord
}
// Jour d'absence (congé, formation…) : noté depuis le calendrier, il n'est plus signalé « à vérifier »
function basculerAbsence(d){ const a={...((state.reglages||{}).absences||{})}; if(a[d]) delete a[d]; else a[d]=true; state.reglages={...(state.reglages||{}), absences:a}; save(); render(); }
function marquerJoursOK(dates){ const ok={...((state.reglages||{}).joursOK||{})}; dates.forEach(d=>ok[d]=true); state.reglages={...(state.reglages||{}), joursOK:ok}; save(); render(); }
function aFaire(){
  const informer=state.consults.filter(c=>c.nom && aInformer(c));
  const enAttente=state.consults.filter(c=>c.nom && (c.statut||'rien')==='cr' && joursDepuis(dateExamen(c))>JOURS_ATTENTE);
  const jours=joursAVerifier();
  return {informer, enAttente, jours, total:new Set([...informer,...enAttente]).size+jours.length};
}

  const app=document.getElementById('app'), {informer, enAttente, jours}=aFaire();
  const lundiDe=d=>{ const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()-((x.getDay()+6)%7)); return isoLocal(x); };

      <p class="hint">En semaine, ${ANALYSES_PAR_JOUR} polygraphies par jour en général (samedi, dimanche et jours fériés exclus ; Somnum non compté ; ${JOURS_CONTROLE} derniers jours, hors les ${DELAI_SAISIE} derniers laissés à la saisie). Vérifiez qu'aucun patient n'a été oublié, sinon confirmez que c'est normal.</p>
      ${jours.length?`<div class="tablewrap"><table class="table-af jours-af"><thead><tr><th>Jour</th><th>Examens notés</th><th>Patient(s)</th><th></th></tr></thead><tbody>
        ${jours.map(j=>`<tr data-jour="${j.date}"><td><b>${JOURS_NOMS[j.jour]}</b> ${fmtDate(j.date)}</td>
          <td class="${j.patients.length?'':'retard-af'}">${j.patients.length?'1 seul':'aucun'}</td>
          <td>${j.patients.map(c=>`<b>${esc(c.nom)}</b> ${esc(c.prenom)}`).join(', ')||'<span class="muted">—</span>'}</td>
          <td style="white-space:nowrap"><button class="small" data-jour-ok title="Ce jour-là, il n'y a pas eu d'autre examen : ne plus le signaler">✔ C'est normal</button>
            <button class="small" data-jour-cal title="Voir ce mois dans le calendrier">📅</button>
            <button class="small" data-semaine-ok title="Congés, formation… : ne plus signaler aucun jour de cette semaine">Semaine entière normale</button></td></tr>`).join('')}
      </tbody></table></div>`:`<p class="muted">✔ Aucun jour manquant ou incomplet.</p>`}
      ${nOK?`<p class="hint" style="margin:6px 0 0">${nOK} jour${nOK>1?'s':''} confirmé${nOK>1?'s':''} « normal ». <button class="small" id="af-jours-raz" title="Signaler de nouveau ces jours s'ils sont incomplets">Tout revérifier</button></p>`:''}</div>`;
  const tri=l=>l.slice().sort((a,b)=>dateExamen(a).localeCompare(dateExamen(b)));
  const ligne=c=>{ const j=joursDepuis(dateExamen(c));
    return `<tr data-id="${c.id}">

      <td><b>${esc(c.nom)}</b> ${esc(c.prenom)}</td><td><span class="${classeIAH(c.iah)}">${esc(c.iah)||'—'}</span></td>
      <td>${c.analyse?logoAnalyse(c.analyse)+esc(LIB_ANALYSE[c.analyse]):'<span class="muted">—</span>'}</td>
      <td><select data-st class="st-${c.statut||'rien'}">${STATUTS.map(s=>`<option value="${s.v}" ${s.v===(c.statut||'rien')?'selected':''}>${s.label}</option>`).join('')}</select></td>
      <td><div class="contact">${['Doctolib','Appel'].map(v=>`<button class="ct${c.info===v?' on':''}" data-ct="${v}" title="${v==='Doctolib'?'Prévenu par Doctolib':'Prévenu par téléphone'}">${ICONES_CONTACT[v]}</button>`).join('')}</div></td>
      <td>${boutonCR(c)}<button class="small" data-voir title="Voir dans le tableau des consultations">Voir →</button></td></tr>`; };
  const table=(l,vide)=>l.length?`<div class="tablewrap"><table class="table-af"><thead><tr><th>Examen</th><th>Depuis</th><th>Patient</th><th>IAH</th><th>Analyse</th><th>Statut</th><th>Contact</th><th></th></tr></thead><tbody>${tri(l).map(ligne).join('')}</tbody></table></div>`:`<p class="muted">✔ ${vide}</p>`;
  app.innerHTML=`<div class="toolbar"><h2 style="margin:0">✅ À faire</h2></div>
    <div class="card af-bloc" style="--fc:#e8590c"><h3>📣 Patients à informer <span class="nb-af">${informer.length}</span>${informer.length?` <button class="btn-fc" id="af-informer-doc" style="--fc:#107aca;margin-left:10px;font-size:12.5px" title="Envoyer à chacun le message Doctolib « 1 - Résultat de polygraphie »">📨 Informer via Doctolib</button>`:''}</h3>
      <p class="hint">Analyse terminée, aucun contact noté. Cliquez sur l'icône Doctolib ou téléphone une fois le patient prévenu : il quitte la liste.</p>
