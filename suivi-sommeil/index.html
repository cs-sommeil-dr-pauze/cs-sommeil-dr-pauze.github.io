    ${blocJours}
    <div class="card af-bloc" style="--fc:#7a55c9"><h3>⏳ Compte rendu fait depuis plus de ${JOURS_ATTENTE} jours, pas encore « Terminé » <span class="nb-af">${enAttente.length}</span></h3>
      <p class="hint">Examen de plus de ${JOURS_ATTENTE} jours au statut « CR fait » : passez-le en « Terminé » une fois la prise en charge décidée.</p>
      ${table(enAttente,'Aucun compte rendu en attente.')}</div>`;
  const bid=app.querySelector('#af-informer-doc'); if(bid) bid.onclick=fenetreInformerDoctolib;
  app.querySelectorAll('tr[data-jour]').forEach(tr=>{ const d=tr.dataset.jour;
    tr.querySelector('[data-jour-ok]').onclick=()=>marquerJoursOK([d]);
    tr.querySelector('[data-semaine-ok]').onclick=()=>marquerJoursOK(semaineDe(d));
    tr.querySelector('[data-jour-cal]').onclick=()=>{ view.calMois=d.slice(0,7); location.hash='calendrier'; }; });
  const raz=app.querySelector('#af-jours-raz'); if(raz) raz.onclick=()=>{ state.reglages={...(state.reglages||{}), joursOK:{}}; save(); render(); };

/* ============ Calendrier mensuel des examens ============ */
// Lundi → dimanche ; chaque jour : patients (NOM Prénom) et IAH ; jours ouvrés incomplets (< 2 polygraphies) signalés comme sur « À faire »
// Colonne de gauche : mini-calendrier (navigation rapide, n° de semaine) + recherche d'un patient → semaines où il apparaît
const semISO = x => { const t=new Date(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())), j=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-j); return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7); };
const lundiDe = d => { const x=new Date(d+'T12:00'); x.setDate(x.getDate()-(x.getDay()+6)%7); return isoLocal(x); };
function renderCalendrier(){
  const app=document.getElementById('app'), auj=isoLocal(new Date());
  if(!view.calMois) view.calMois=auj.slice(0,7);
  if(!view.calMini) view.calMini=view.calMois;
  // nombre de mois affichés ensemble (le mois choisi en haut, puis les précédents) — mémorisé avec les données
  const inverse=(state.reglages||{}).calInverse!==false;
  const NB=[1,2,3,6], nb=NB.includes(+(state.reglages||{}).calNb)?+state.reglages.calNb:1;
  const [an0,mo0]=view.calMois.split('-').map(Number);
  const mois=[...Array(nb)].map((_,i)=>{ const x=new Date(an0,mo0-1-i,1,12); return [x.getFullYear(), x.getMonth()+1]; });
  const parJour={};
  for(const c of state.consults){ const d=dateExamen(c); if(c.nom && d && c.analyse!=='PSG') (parJour[d]=parJour[d]||[]).push(c); } // Somnum toujours exclus
  // patient appareillé : prestataire PPC noté sur l'une de ses consultations
  const prestaDe=new Map(), ppcDe=new Map();
  for(const c of state.consults) if(c.traitement==='PPC'){ const k=patientKey(c); if(c.prestataire) prestaDe.set(k, c.prestataire); if(!ppcDe.get(k)) ppcDe.set(k, c.prestataire||''); }
  // Appareillés (sous PPC) parmi les patients examinés : nombre et répartition par prestataire
  const statsPPC=(cles, nTot)=>{ const ap=[...cles].filter(k=>ppcDe.has(k)); if(!nTot) return '';
    const par={}; ap.forEach(k=>{ const p=ppcDe.get(k)||'__none'; par[p]=(par[p]||0)+1; });
    const det=Object.entries(par).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<span class="cal-pr" title="${p==='__none'?'Prestataire non renseigné':esc(p)}">${p==='__none'?'<span class="muted">non renseigné</span>':logoPresta(p)||esc(p)} <b>${n}</b></span>`).join('');
    return `<div class="cal-stats"><span class="cal-ap">🫁 <b>${ap.length}</b> appareillé${ap.length>1?'s':''} sur ${nTot} patient${nTot>1?'s':''} (${Math.round(ap.length/nTot*100)} %)</span>${det}</div>`; };
  const clesPeriode=new Set();
  const aVerif=new Set(joursAVerifier().map(j=>j.date)), ok=(state.reglages||{}).joursOK||{}, absences=(state.reglages||{}).absences||{};
  // Recherche d'un patient (nom et/ou prénom, sans tenir compte des accents ni de l'ordre)
  const q=view.calQ||'', mots=norm(q).split(/[\s,'’-]+/).filter(Boolean);
  const trouve=c=>mots.length>0 && mots.every(m=>norm(`${c.nom} ${c.prenom||''}`).replace(/[-’']/g,' ').includes(m));
  const occ=mots.length?Object.keys(parJour).filter(d=>parJour[d].some(trouve)).sort():[];
  const vueSem=occ.length>0 && !view.calVueMois;
  const feriesDe={}, estFerie=d=>(feriesDe[d.slice(0,4)]=feriesDe[d.slice(0,4)]||joursFeries(+d.slice(0,4))).has(d);
  const ENTETES=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'].map((n,i)=>`<div class="cal-e${i>4?' we':''}">${n}</div>`).join('');
  // Case d'un jour (avecMois : affiche aussi le mois, pour la vue par semaines)
  const caseJour=(d, avecMois)=>{
    const x=new Date(d+'T12:00'), j=x.getDate(), we=x.getDay()===0||x.getDay()===6, l=(parJour[d]||[]).slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
    const nPG=l.length, ferie=estFerie(d), abs=!!absences[d];
    const cls=['cal-j', we?'we':'', d===auj?'auj':'', aVerif.has(d)?'averif':'', ferie?'ferie':'', abs?'absent':'', l.some(trouve)?'trouve':''].filter(Boolean).join(' ');
    return `<div class="${cls}" data-d="${d}"><div class="cal-t"><b>${j}</b>${avecMois?`<span class="muted">${x.toLocaleDateString('fr-FR',{month:'short',year:'numeric'})}</span>`:''}${ferie?'<span class="cal-tag">férié</span>':''}${abs?'<span class="cal-tag cal-tag-abs">🏖️ Absence</span>':''}${aVerif.has(d)?`<span class="cal-tag warn" title="Jour de semaine avec ${nPG?'une seule polygraphie':'aucune polygraphie'} notée">${nPG?'1 seul':'aucun'} — à vérifier</span>`:ok[d]&&!we&&nPG<ANALYSES_PAR_JOUR?'<span class="cal-tag" title="Confirmé normal">✔ normal</span>':''}</div>
        ${l.map(c=>`<button class="cal-p${trouve(c)?' trouve':''}" data-id="${c.id}" title="Ouvrir la fiche du patient${c.statut==='termine'?' — dossier terminé':''}">${prestaDe.has(patientKey(c))?logoPresta(prestaDe.get(patientKey(c))):''}<span class="cal-nom"><b>${esc(c.nom)}</b> ${esc(c.prenom||'')}</span>${c.statut==='termine'?'<span class="cal-fait" title="Terminé">✔</span>':''}<span class="cal-iah ${classeIAH(c.iah)}">${esc(c.iah)||'—'}</span></button>`).join('')}
        <div class="cal-act">${aVerif.has(d)?'<button class="small cal-ajout fort" data-ajout title="Ajouter un patient oublié ce jour-là">➕ Patient</button><button class="small cal-ok" data-ok title="Ne plus signaler ce jour">✔ C’est normal</button>':!we?'<button class="small cal-ajout" data-ajout title="Ajouter un patient ce jour-là">+</button>':''}${we?'':abs?'<button class="small cal-abs on" data-abs title="Ce jour n’est plus une absence">✕ Absence</button>':`<button class="small cal-abs${aVerif.has(d)?' fort':''}" data-abs title="Noter ce jour comme une absence (il ne sera plus signalé à vérifier)">🏖️ Absence</button>`}</div></div>`;
  };
  // Taux de remplissage : examens / (2 par jour de semaine travaillé), hors week-ends, jours fériés et absences ;
  // mois en cours : jusqu'à aujourd'hui seulement
  let capPeriode=0, nCapPeriode=0;
  const taux=(n,cap,lib)=>{ if(!cap) return ''; const t=Math.round(n/cap*100);
    return `<span class="cal-taux ${t>=90?'val-ok':t>=70?'val-warn':'val-bad'}" title="${n} examen${n>1?'s':''} pour ${cap} places (${cap/ANALYSES_PAR_JOUR} jour${cap/ANALYSES_PAR_JOUR>1?'s':''} travaillé${cap/ANALYSES_PAR_JOUR>1?'s':''} × ${ANALYSES_PAR_JOUR})${lib||''} — week-ends, jours fériés et absences exclus">remplissage ${t} %</span>`; };
  const grille=(an,mo)=>{
    const premier=new Date(an,mo-1,1,12), nbJ=new Date(an,mo,0).getDate(), cle=`${an}-${String(mo).padStart(2,'0')}`;
    let total=0, nAv=0, cap=0, nCap=0; const cles=new Set(), cases=[];
    for(let i=0;i<(premier.getDay()+6)%7;i++) cases.push('<div class="cal-j vide"></div>');
    for(let j=1;j<=nbJ;j++){
      const d=`${cle}-${String(j).padStart(2,'0')}`, l=parJour[d]||[];
      total+=l.length; if(aVerif.has(d)) nAv++; l.forEach(c=>{ cles.add(patientKey(c)); clesPeriode.add(patientKey(c)); });
      const js=new Date(d+'T12:00').getDay();
      if(js!==0 && js!==6 && !estFerie(d) && !absences[d] && (d<=auj || cle>auj.slice(0,7))){ cap+=ANALYSES_PAR_JOUR; nCap+=l.length; }
      cases.push(caseJour(d, false));
    }
    // ordre des semaines au choix (bouton ⇅) : par défaut la dernière semaine du mois en haut, la première en bas
    while(cases.length%7) cases.push('<div class="cal-j vide"></div>');
    const semainesInv=[]; for(let i=0;i<cases.length;i+=7) semainesInv[inverse?'unshift':'push'](cases.slice(i,i+7).join(''));
    const nom=premier.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    capPeriode+=cap; nCapPeriode+=nCap;
    return `<section class="cal-bloc" data-mois="${cle}"><h3 class="cal-titre">${nom} <span class="hint">${total} examen${total>1?'s':''}${cap?' · '+taux(nCap,cap,cle===auj.slice(0,7)?', jusqu’à aujourd’hui':''):''}${nAv?` · <span class="cal-tag warn">${nAv} jour${nAv>1?'s':''} à vérifier</span>`:''}</span></h3>
      ${statsPPC(cles, cles.size)}
      <div class="cal-grille">${ENTETES}${semainesInv.join('')}</div></section>`;
  };
  // Vue « semaines du patient » : chaque semaine (lundi → dimanche) où un patient recherché a un examen
  const blocSemaine=l0=>{
    const jours=[...Array(7)].map((_,i)=>{ const x=new Date(l0+'T12:00'); x.setDate(x.getDate()+i); return isoLocal(x); });
    const d0=new Date(l0+'T12:00'), d6=new Date(jours[6]+'T12:00'), cible=jours.find(d=>occ.includes(d));
    return `<section class="cal-bloc cal-sem" data-sem="${l0}"><h3 class="cal-titre">Semaine ${semISO(d0)} <span class="hint">du ${d0.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} au ${d6.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span>
      <button class="small" data-aller="${cible}" data-mois-de="1" title="Afficher tout le mois">Voir le mois</button></h3>
      <div class="cal-grille">${ENTETES}${jours.map(d=>caseJour(d, true)).join('')}</div></section>`;
  };
  // Mini-calendrier (style Doctolib) : n° de semaine, jours avec examens, jours à vérifier, patient recherché
  const miniCal=()=>{
    const [a,m]=view.calMini.split('-').map(Number), p=new Date(a,m-1,1,12), x=new Date(p);
    x.setDate(1-(p.getDay()+6)%7);
    const affiches=new Set(vueSem?[]:mois.map(([y,mm])=>`${y}-${String(mm).padStart(2,'0')}`));
    let h=`<div class="mc"><div class="mc-tete"><button class="mc-nav" data-mini="-12" title="Année précédente">«</button><button class="mc-nav" data-mini="-1" title="Mois précédent">‹</button>
      <b>${p.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><button class="mc-nav" data-mini="1" title="Mois suivant">›</button><button class="mc-nav" data-mini="12" title="Année suivante">»</button></div>
      <div class="mc-grille"><span></span>${['Lu','Ma','Me','Je','Ve','Sa','Di'].map(n=>`<span class="mc-e">${n}</span>`).join('')}`;
    for(let s=0;s<6;s++){
      h+=`<button class="mc-sem" data-mini-d="${isoLocal(x)}" title="Aller à la semaine ${semISO(x)}">${semISO(x)}</button>`;
      for(let i=0;i<7;i++){
        const d=isoLocal(x), hors=x.getMonth()!==m-1, n=(parJour[d]||[]).length, tr=n&&parJour[d].some(trouve);
        const cls=['mc-j', hors?'hors':'', d===auj?'auj':'', absences[d]?'abs':'', !hors&&affiches.has(d.slice(0,7))?'aff':'', n?'ex':'', tr?'trouve':'', aVerif.has(d)?'averif':''].filter(Boolean).join(' ');
        h+=`<button class="${cls}" data-mini-d="${d}" title="${x.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}${n?` — ${n} examen${n>1?'s':''}`:''}">${x.getDate()}</button>`;
        x.setDate(x.getDate()+1);
      }
    }
    return h+`</div><button class="small mc-auj" data-auj title="Revenir à aujourd’hui">📍 Aujourd’hui</button><div class="mc-leg"><span class="mc-pt"></span> examen(s) <span class="mc-pt or"></span> à vérifier${mots.length?' <span class="mc-pt tr"></span> patient recherché':''}</div></div>`;
  };
  // Résultats de la recherche : un patient par ligne, ses dates d'examen cliquables
  const resultats=()=>{
    if(!mots.length) return '<p class="hint">Tapez un nom pour voir toutes les semaines où le patient apparaît.</p>';
    if(!occ.length) return '<p class="hint">Aucun examen trouvé (Somnum non affichés).</p>';
    const parP=new Map();
    occ.forEach(d=>parJour[d].filter(trouve).forEach(c=>{ const k=patientKey(c); if(!parP.has(k)) parP.set(k,{c, l:[]}); parP.get(k).l.push(c); }));
    return `<div class="cr-tete"><b>${parP.size} patient${parP.size>1?'s':''}</b> · ${occ.length} jour${occ.length>1?'s':''}
        <button class="small" id="cal-bascule">${vueSem?'📅 Vue mensuelle':'🔍 Semaines du patient'}</button></div>`+
      [...parP.values()].slice(0,30).map(({c,l})=>`<div class="cr-p"><div><b>${esc(c.nom)}</b> ${esc(c.prenom||'')}</div><div class="cr-d">${l.map(e=>{ const d=dateExamen(e); return `<button class="small" data-aller="${d}" title="Aller à ce jour">${fmtDate(d)}${e.iah?` · IAH ${esc(e.iah)}`:''}${e.statut==='termine'?' <span class="cal-fait">✔</span>':''}</button>`; }).join('')}</div></div>`).join('');
  };
  const periode=nb>1?`${new Date(mois[nb-1][0],mois[nb-1][1]-1,1).toLocaleDateString('fr-FR',{month:'short',year:'numeric'})} → ${new Date(an0,mo0-1,1).toLocaleDateString('fr-FR',{month:'short',year:'numeric'})}`:new Date(an0,mo0-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const semaines=[...new Set(occ.map(lundiDe))];
  const corps=vueSem
    ? `<div class="cal-periode"><b>🔍 « ${esc(q.trim())} »</b> — ${semaines.length} semaine${semaines.length>1?'s':''} avec un examen, de la plus ancienne à la plus récente</div>${semaines.slice(-40).map(blocSemaine).join('')}`
    : (()=>{ const g=mois.map(([a,m])=>grille(a,m)).join(''); return (nb>1&&clesPeriode.size?`<div class="cal-periode"><b>Sur ces ${nb} mois</b> ${taux(nCapPeriode,capPeriode)}${statsPPC(clesPeriode, clesPeriode.size)}</div>`:'')+g; })();
  app.innerHTML=`<div class="toolbar"><h2 style="margin:0">📅 Calendrier des examens</h2>
      <button class="small" id="cal-prec" title="Mois précédent">‹</button><b class="cal-mois"${vueSem?' style="text-transform:none"':''}>${vueSem?'Semaines du patient':periode}</b><button class="small" id="cal-suiv" title="Mois suivant">›</button>
      <button class="small" id="cal-auj" title="Revenir à aujourd’hui">📍 Aujourd’hui</button>
      <button class="small" id="cal-sens" title="Inverser l’ordre des semaines dans le mois">⇅ ${inverse?'Fin du mois en haut':'Début du mois en haut'}</button>
      <span class="cal-nb" role="group" aria-label="Nombre de mois affichés">Afficher ${NB.map(n=>`<button class="small${n===nb?' on':''}" data-nb="${n}">${n} mois</button>`).join('')}</span>
      <span class="hint"><span class="iah-fort">IAH &gt; 15</span> · <span class="iah-grave">IAH &gt; 30</span> · <span class="cal-fait">✔</span> terminé · cadre orange = jour de semaine à vérifier · Somnum non affichés</span></div>
    <div class="cal-layout"><aside class="cal-side">${miniCal()}
      <div class="cal-cherche"><input id="cal-q" type="search" placeholder="🔍 Rechercher un patient…" value="${esc(q)}" autocomplete="off" spellcheck="false"><div class="cal-res">${resultats()}</div></div></aside>
      <div class="cal-main">${corps}</div></div>`;
  // Aller à une date : mois correspondant, case mise en évidence
  const flash=el=>{ el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); };
  const allerA=(d, mois)=>{ const el=!mois&&app.querySelector(`.cal-main .cal-j[data-d="${d}"]`);
    if(el){ flash(el); return; }
    view.calMois=d.slice(0,7); view.calMini=view.calMois; view.calVueMois=true; view.calCible=d; renderCalendrier(); };
  const aller=n=>{ const x=new Date(an0,mo0-1+n,1); view.calMois=isoLocal(x).slice(0,7); view.calMini=view.calMois; view.calVueMois=true; renderCalendrier(); };
  app.querySelector('#cal-prec').onclick=()=>aller(-1); app.querySelector('#cal-suiv').onclick=()=>aller(1);
  app.querySelectorAll('[data-nb]').forEach(b=>b.onclick=()=>{ state.reglages={...(state.reglages||{}), calNb:+b.dataset.nb}; save(); view.calVueMois=true; renderCalendrier(); });
  app.querySelectorAll('#cal-auj,[data-auj]').forEach(b=>b.onclick=()=>{ view.calMois=auj.slice(0,7); view.calMini=view.calMois; view.calVueMois=true; view.calCible=auj; renderCalendrier(); });
  app.querySelector('#cal-sens').onclick=()=>{ state.reglages={...(state.reglages||{}), calInverse:!inverse}; save(); renderCalendrier(); };
  app.querySelectorAll('[data-mini]').forEach(b=>b.onclick=()=>{ const [a,m]=view.calMini.split('-').map(Number), x=new Date(a,m-1+ +b.dataset.mini,1,12); view.calMini=isoLocal(x).slice(0,7); renderCalendrier(); });
  app.querySelectorAll('[data-mini-d]').forEach(b=>b.onclick=()=>allerA(b.dataset.miniD, true));
  app.querySelectorAll('[data-aller]').forEach(b=>b.onclick=()=>allerA(b.dataset.aller, !!b.dataset.moisDe));
  const bas=app.querySelector('#cal-bascule'); if(bas) bas.onclick=()=>{ view.calVueMois=vueSem; if(vueSem&&occ.length){ view.calMois=occ[occ.length-1].slice(0,7); view.calMini=view.calMois; } renderCalendrier(); };
  const iq=app.querySelector('#cal-q');
  iq.oninput=()=>{ clearTimeout(view.calQt); view.calQt=setTimeout(()=>{ view.calQ=iq.value; view.calVueMois=false; view.calFocus=true; renderCalendrier(); }, 250); };
  iq.onkeydown=e=>{ if(e.key==='Escape'&&iq.value){ e.preventDefault(); view.calQ=''; view.calFocus=true; renderCalendrier(); } };
  if(view.calFocus){ view.calFocus=false; iq.focus(); iq.setSelectionRange(iq.value.length, iq.value.length); }
  if(view.calCible){ const el=app.querySelector(`.cal-main .cal-j[data-d="${view.calCible}"]`); view.calCible=null; if(el) requestAnimationFrame(()=>flash(el)); }
  app.querySelectorAll('.cal-p').forEach(b=>b.onclick=()=>{ const c=state.consults.find(x=>x.id===b.dataset.id); if(c) fichePatient(c); });
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>marquerJoursOK([b.closest('.cal-j').dataset.d]));
  app.querySelectorAll('[data-abs]').forEach(b=>b.onclick=()=>basculerAbsence(b.closest('.cal-j').dataset.d));
  // Ajout d'un patient oublié, directement dans la case du jour (polygraphie PMB, « Rien de fait »)
  app.querySelectorAll('[data-ajout]').forEach(b=>b.onclick=()=>{
    const cas=b.closest('.cal-j'), d=cas.dataset.d, act=cas.querySelector('.cal-act');
    act.innerHTML=`<form class="cal-form"><input name="nom" placeholder="NOM" required autocomplete="off"><input name="prenom" placeholder="Prénom" autocomplete="off"><input name="iah" placeholder="IAH" inputmode="decimal" autocomplete="off">
      <div class="cal-form-b"><button class="small primary" type="submit">Ajouter</button><button class="small" type="button" data-annul>Annuler</button></div></form>`;
    const f=act.querySelector('form'); f.nom.focus();
    f.querySelector('[data-annul]').onclick=()=>renderCalendrier();
    f.onkeydown=e=>{ if(e.key==='Escape') renderCalendrier(); };
    f.onsubmit=e=>{ e.preventDefault();
      const nom=f.nom.value.trim().toUpperCase(), prenom=capName(f.prenom.value||''), iah=f.iah.value.trim().replace('.',',');
      if(!nom){ f.nom.focus(); return; }
      if(state.consults.some(c=>c.date===d && samePatient({nom,prenom},c))){ toast('Ce patient est déjà noté ce jour-là'); return; }
      state.consults.push(regleStatut({id:uid(), date:d, nom, prenom, iah, analyse:'PG', info:'', statut:'rien', traitement:'', prestataire:'', commentaire:''}));
      save(); toast(`${nom} ${prenom} ajouté(e) le ${fmtDate(d)} ✔`); render(); };
  });
}

  {k:'analyse',label:'Analyse',w:100},{k:'info',label:'Contact',w:76},{k:'annonce',label:'Annonce',w:96},{k:'statut',label:'Statut',w:130},{k:'traitement',label:'Traitement',w:115},
  {k:'prestataire',label:'Prestataire PPC',w:150},{k:'adresseur',label:'Médecin adresseur',w:170},{k:'commentaire',label:'Commentaire',w:220},{k:'_act',label:'',w:160},{k:'docs',label:'Documents',w:130}];
const COMMUNICATION=['', 'Doctolib', 'Appel'];

const ICONES_CONTACT={

const LARGEURS_KEY='suiviSommeil_largeurs';
// (gardées aussi en mémoire, au cas où le stockage du navigateur serait indisponible)
let largeursMem=null, ordreMem=null;
// Largeurs choisies : gardées dans ce navigateur ET avec les données (elles suivent la sauvegarde / un autre ordinateur)
function largeurs(){ let l=largeursMem || (state.reglages&&state.reglages.largeurs); if(!l){ try{ l=JSON.parse(localStorage.getItem(LARGEURS_KEY)); }catch(e){} } l=l||{};
  // ancien réglage (avant l'ajout des logos et de « À informer ») : élargi une seule fois, ensuite on respecte vos largeurs

const ORDRE_KEY='suiviSommeil_ordreCols';
function colonnes(){
  let o=ordreMem; if(!o){ try{ o=JSON.parse(localStorage.getItem(ORDRE_KEY)); }catch(e){} } o=o||[];
  const parK=Object.fromEntries(COLS.map(c=>[c.k,c]));
  const res=[parK._sel, ...o.filter(k=>parK[k]&&k!=='_sel').map(k=>parK[k])];
  // colonne ajoutée depuis (ex. « Analyse ») : placée après sa voisine habituelle plutôt qu'à la fin
  COLS.forEach((c,i)=>{ if(res.includes(c)) return; const p=res.indexOf(COLS[i-1]); res.splice(p>=0?p+1:res.length,0,c); });
  return res;
}

function bindLargeursSimples(tb){
  tb.querySelectorAll('.rz-s').forEach(h=>{ h.onclick=e=>e.stopPropagation(); h.onmousedown=e=>{
    e.preventDefault(); e.stopPropagation();

    t.querySelectorAll('col[data-k]').forEach(c=>{ W[c.dataset.k]=parseFloat(c.style.width)||W[c.dataset.k]; });

    const move=ev=>{ W[k]=Math.max(30,Math.round(w0+(ev.clientX-x0)/z)); poserLargeursSimples(tb,W); };
    const up=()=>{ removeEventListener('mousemove',move); removeEventListener('mouseup',up);

      const bloque=ev=>{ ev.stopPropagation(); ev.preventDefault(); }; addEventListener('click',bloque,true);
      colResizeVientDeFinir=true; setTimeout(()=>{ colResizeVientDeFinir=false; removeEventListener('click',bloque,true); },50);

      state.reglages={...(state.reglages||{}), largeursSimple:W, colsAuto:false}; save();

// Ajuste chaque colonne à son contenu le plus large (en-tête compris)
function ajusterColsSimples(tb){
  const cv=ajusterColsSimples.cv||(ajusterColsSimples.cv=document.createElement('canvas').getContext('2d')), cache=new Map();
  const st=el=>{ const cle=el.tagName+'.'+el.className; let s=cache.get(cle);
    if(!s){ const cs=getComputedStyle(el); s={font:cs.font, flex:cs.display.includes('flex'), gap:parseFloat(cs.columnGap)||0, ls:parseFloat(cs.letterSpacing)||0,
      box:['paddingLeft','paddingRight','borderLeftWidth','borderRightWidth'].reduce((a,p)=>a+(parseFloat(cs[p])||0),0)}; cache.set(cle,s); } return s; };
  const txt=(el,t)=>{ const s=st(el); cv.font=s.font; return cv.measureText(t||'').width+s.ls*(t||'').length; };
  const nat=el=>{
    if(el.matches('input.num,input[type=checkbox],.iah-ics,.ct,.ct-vide')) return el.offsetWidth;
    if(el.matches('input')) return txt(el, el.value||el.placeholder)+st(el).box+3;
    if(el.matches('select')) return txt(el, (el.options[el.selectedIndex]||{}).text)+st(el).box+30;
    if(el.matches('button')) return txt(el, el.textContent)+st(el).box+2;
    const s=st(el), ch=[...el.children];
    if(s.flex && ch.length) return ch.reduce((a,c)=>a+nat(c),0)+s.gap*(ch.length-1)+s.box;
    return el.offsetWidth;
  };
  const W={};
  tb.querySelectorAll('table.mini').forEach(t=>{
    t.querySelectorAll('thead th').forEach((h,i)=>{ const k=COLS_SIMPLES[i]; W[k]=Math.max(W[k]||0, txt(h, h.textContent.toUpperCase())+st(h).box+10); });
    t.querySelectorAll('tbody tr[data-id]').forEach(tr=>[...tr.children].forEach((td,i)=>{ const k=COLS_SIMPLES[i];
      W[k]=Math.max(W[k]||0, (td.firstElementChild?nat(td.firstElementChild):0)+st(td).box); }));
  });
  for(const k of COLS_SIMPLES) W[k]=Math.max(30, Math.ceil((W[k]||LARG_SIMPLE_DEF[k])+2));
  poserLargeursSimples(tb, W);
}

// Lieu choisi dans le bloc « Médecins adresseurs » : '' = tous, 'PG' = PMB (polygraphies, et consultations sans analyse précisée), 'PSG' = Somnum
const lieuAdrOk = c => !view.fAdrLieu || compteEn(c)===view.fAdrLieu;
function statsAdresseurs(){
  const m=new Map();
  for(const c of state.consults){ const a=(c.adresseur||'').trim(); if(!a || !lieuAdrOk(c)) continue; const k=norm(a);
    let e=m.get(k); if(!e){ e={nom:a, pats:new Set()}; m.set(k,e); } e.pats.add(norm(c.nom+'|'+(c.prenom||''))); }
  return [...m.values()].map(e=>({nom:e.nom, n:e.pats.size})).sort((a,b)=>b.n-a.n || a.nom.localeCompare(b.nom,'fr'));
}
// Médecins écrits un peu différemment (« Dr CHENON » / « Dr Chenon Tiphaine » / « Dr CHENNON Tiphaine ») : proposés à la fusion
const motsMedecin = s => norm(s).replace(/^(dr|pr|docteur|professeur)\b\.?\s*/,'').replace(/[^a-z ]/g,' ').split(' ').filter(w=>w.length>1);
function medecinsProches(S=statsAdresseurs()){
  const res=[];
  for(let i=0;i<S.length;i++) for(let j=i+1;j<S.length;j++){
    const a=S[i], b=S[j], cle='adr:'+[norm(a.nom),norm(b.nom)].sort().join('#');
    if((state.distincts||[]).includes(cle)) continue;
    const ma=motsMedecin(a.nom), mb=motsMedecin(b.nom); if(!ma.length||!mb.length) continue;
    const [court,long]=ma.length<=mb.length?[ma,mb]:[mb,ma];
    // chaque mot du nom le plus court se retrouve (à une faute près) dans l'autre
    const inclus=court.every(w=>long.some(x=>x===w || (w.length>3 && ressemblance(w,x)>=0.8)));
    const sTout=ressemblance([...ma].sort().join(''),[...mb].sort().join(''));
    let raison='';
    if([...ma].sort().join(' ')===[...mb].sort().join(' ')) raison='mêmes mots dans un autre ordre';
    else if(inclus && court.length<long.length) raison='prénom ou mot en plus';
    else if(inclus || sTout>=0.85) raison='écriture presque identique';
    if(raison) res.push({a, b, cle, raison});
  }
  return res;
}
function fusionnerMedecins(garder, remplacer){
  let n=0; const det=state.consults.find(c=>norm(c.adresseur||'')===norm(garder) && c.adresseurDetail);
  for(const c of state.consults) if(norm(c.adresseur||'')===norm(remplacer)){ c.adresseur=garder; if(!c.adresseurDetail && det) c.adresseurDetail=det.adresseurDetail; n++; }
  if(norm(view.fAdr||'')===norm(remplacer)) view.fAdr=garder;
  save(); return n;
}

// Petite icône du traitement à gauche de l'IAH :
//  - PPC (IAH > 15) : logo du prestataire

function icTraitement(c){
  const n=num(c.iah), p=c.traitement==='PPC'?c.prestataire:'';
  if(c.traitement==='PPC' && p && n>15) return LOGOS_PRESTA[p]?`<img class="iah-presta" src="${LOGOS_PRESTA[p]}" alt="" title="PPC — ${esc(p)}">`
    :`<span class="iah-presta-txt" style="--pc:${couleurPresta(p)}" title="PPC — ${esc(p)}">${esc(p.slice(0,3))}</span>`;
  if(!(n>30)) return '';
  if(c.traitement==='OAM') return `<span class="ic-trait" title="Orthèse d'avancée mandibulaire (OAM)">${SVG_MACHOIRE}</span>`;
  if(c.traitement==='Dispositif positionnel') return '<span class="ic-trait" title="Dispositif positionnel">🎾</span>';

function menuStatut(btn, c){

  const fermer=()=>{ m.remove(); document.removeEventListener('mousedown',dehors,true); };
  const dehors=e=>{ if(!m.contains(e.target)) fermer(); };

// Déplacement des colonnes : maintenir le clic sur un en-tête et le faire glisser à gauche ou à droite
function bindDeplacement(table){
  table.querySelectorAll('thead th[data-k]').forEach(thEl=>thEl.addEventListener('mousedown',e=>{
    if(e.button!==0 || e.target.closest('.rz,input,.th-masquer')) return;
    const k=thEl.dataset.k, x0=e.clientX; let actif=false, cible=null, indic=null;
    const ths=()=>[...table.querySelectorAll('thead th[data-k]')];
    const move=ev=>{
      if(!actif){ if(Math.abs(ev.clientX-x0)<6) return; actif=true; thEl.classList.add('col-drag'); document.body.classList.add('col-moving');
        indic=document.createElement('div'); indic.className='col-indic'; document.body.appendChild(indic); }
      ev.preventDefault();
      const L=ths(), r=table.getBoundingClientRect();
      let i=L.findIndex(t=>{ const b=t.getBoundingClientRect(); return ev.clientX<b.left+b.width/2; });
      if(i<0) i=L.length; cible=i;
      const x=i<L.length?L[i].getBoundingClientRect().left:L[L.length-1].getBoundingClientRect().right;
      Object.assign(indic.style,{left:(x-2)+'px', top:Math.max(r.top,0)+'px', height:Math.min(r.height,innerHeight-Math.max(r.top,0))+'px'});
    };
    const up=()=>{
      document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
      if(!actif) return; // simple clic : tri de la colonne
      thEl.classList.remove('col-drag'); document.body.classList.remove('col-moving'); indic&&indic.remove();
      colResizeVientDeFinir=true; setTimeout(()=>colResizeVientDeFinir=false,250);
      const vis=ths().map(t=>t.dataset.k), de=vis.indexOf(k);
      let a=cible; if(a>de) a--;
      if(a===de || a==null) return;
      // ordre complet (les colonnes masquées par l'affichage allégé gardent leur place)
      const avant=vis.filter(x=>x!==k)[a], keys=colonnes().map(c=>c.k).filter(x=>x!==k);
      const p=avant?keys.indexOf(avant):keys.length; keys.splice(p<0?keys.length:p,0,k);
      sauverOrdre(keys); renderConsultations();
    };
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  }));
}
// Zoom du tableau des consultations (propre à chaque écran : gardé dans ce navigateur)
const ZOOM_KEY='suiviSommeil_zoomTableau';
function zoomTableau(){ let z=1; try{ z=parseFloat(localStorage.getItem(ZOOM_KEY))||1; }catch(e){} return Math.min(1.5,Math.max(0.4,z)); }
function appliquerZoom(z){ z=Math.round(Math.min(1.5,Math.max(0.4,z))*100)/100; try{ localStorage.setItem(ZOOM_KEY,String(z)); }catch(e){}
  document.documentElement.style.setProperty('--zoom-tab',z); const v=document.getElementById('zm-val'); if(v) v.textContent=Math.round(z*100)+' %'; majDefil(); }

// Barre de défilement horizontal toujours visible en bas de l'écran (celle du tableau est tout en bas de la liste)
let majDefil=()=>{};
function bindBarreH(app){
  const wrap=app.querySelector('#wrap-consult'), defil=app.querySelector('#defil-h'), barre=app.querySelector('#barre-h'); if(!wrap||!defil) return;
  const inner=defil.firstElementChild; let meneur=null;
  // recopie la position d'un ascenseur sur l'autre (en proportion : le tableau peut être zoomé)
  const copier=(de,vers)=>{ if(meneur && meneur!==de) return; meneur=de; const a=de.scrollWidth-de.clientWidth, b=vers.scrollWidth-vers.clientWidth;
    vers.scrollLeft=a>0?de.scrollLeft/a*b:0; requestAnimationFrame(()=>{ meneur=null; }); };
  majDefil=()=>{ const deborde=wrap.scrollWidth-wrap.clientWidth>2;
    defil.style.visibility=deborde?'':'hidden';
    inner.style.width=(deborde?defil.clientWidth*wrap.scrollWidth/wrap.clientWidth:0)+'px';
    if(deborde) copier(wrap,defil); };
  wrap.addEventListener('scroll',()=>copier(wrap,defil));
  defil.addEventListener('scroll',()=>copier(defil,wrap));
  if(window.ResizeObserver){ const ro=new ResizeObserver(()=>majDefil()); ro.observe(wrap); ro.observe(wrap.querySelector('table')); }
  app.querySelector('#zm-moins').onclick=()=>appliquerZoom(zoomTableau()-0.1);
  app.querySelector('#zm-plus').onclick=()=>appliquerZoom(zoomTableau()+0.1);
  app.querySelector('#zm-val').onclick=()=>appliquerZoom(1);
  app.querySelector('#zm-ajust').onclick=()=>{ const t=wrap.querySelector('table'); appliquerZoom(Math.min(1, Math.floor((barre.clientWidth-4)/(parseFloat(t.dataset.total)||t.offsetWidth)*100)/100)); };
  appliquerZoom(zoomTableau());
}
// Redimensionnement des colonnes à la souris
let colResizeVientDeFinir=false;
function bindResize(table){
  table.querySelectorAll('.rz').forEach(h=>h.addEventListener('mousedown',e=>{
    e.preventDefault(); e.stopPropagation();
    const k=h.dataset.k, col=table.querySelector(`col[data-k="${k}"]`), x0=e.clientX, w0=parseFloat(col.style.width);
    const L=largeurs(), t0=colonnesVisibles().reduce((s,c)=>s+L[c.k],0)-L[k];
    document.body.style.cursor='col-resize';
    const z=zoomTableau(); // tableau zoomé : le déplacement de la souris est ramené à l'échelle du tableau
    const move=ev=>{ const w=Math.max(40,Math.round(w0+(ev.clientX-x0)/z)); col.style.width=w+'px'; if(table.dataset.total){ table.dataset.total=t0+w; table.style.width=`max(${t0+w}px,100%)`; } else table.style.width=(t0+w)+'px'; L[k]=w; };
    const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); document.body.style.cursor='';
      sauverLargeurs(L); colResizeVientDeFinir=true; setTimeout(()=>colResizeVientDeFinir=false,250); };
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  }));
}

const logoAnalyse = a => LOGOS_ANALYSE[a] ? `<img class="logo-an" src="${LOGOS_ANALYSE[a]}" alt="" title="${LIB_ANALYSE[a]}">` : '';
const selAnalyse = (v, attr='data-f="analyse"') => {

  return LOGOS_ANALYSE[v] ? choixLogo(LOGOS_ANALYSE[v], LIB_ANALYSE[v], s) : `<div class="an-cell">${s}</div>`;
};
// Prestataire déjà choisi : son logo suffit (nom au survol) ; sans logo (Elivie, Isis) : pastille avec le nom
const chipPresta = p => !p ? '<span class="muted">—</span>'
  : LOGOS_PRESTA[p] ? `<span class="presta-logo" title="${esc(p)}"><img class="logo-choix" src="${LOGOS_PRESTA[p]}" alt="${esc(p)}"></span>`
  : `<span class="presta" style="--pc:${couleurPresta(p)}">${esc(p)}</span>`;
// Menu déroulant qui, une fois une valeur choisie, n'affiche plus que son logo et une petite flèche ; un clic rouvre le menu
const choixLogo = (src, titre, selectHtml) => `<div class="choix-logo" title="${esc(titre)} — cliquer pour changer"><img class="logo-choix" src="${src}" alt="${esc(titre)}"><span class="fleche">▾</span>${selectHtml}</div>`;
const selPresta = (v, vide='— choisir —') => {
  const s=`<select data-f="prestataire"${v?` class="presta-sel" style="--pc:${couleurPresta(v)}"`:''}><option value="">${vide}</option>${PRESTATAIRES.map(p=>`<option ${p===v?'selected':''}>${p}</option>`).join('')}</select>`;
  return v && LOGOS_PRESTA[v] ? choixLogo(LOGOS_PRESTA[v], v, s) : `<div class="presta-cell">${logoPresta(v)}${s}</div>`;
};

function fillConsultRows(){
  const q=norm(view.q);
  let rows=state.consults.filter(c=>{
    if(q && !norm(c.nom+' '+c.prenom).includes(q) && !norm(c.prenom+' '+c.nom).includes(q)) return false;
    if(view.fAlerte && !alerte(c)) return false;
    if(view.fIah30 && !(num(c.iah)>30)) return false;
    if(view.fStatut && (c.statut||'rien')!==view.fStatut) return false;
    if(view.fTrait==='__none' && c.traitement) return false;
    if(view.fTrait && view.fTrait!=='__none' && c.traitement!==view.fTrait) return false;
    if(view.fAnalyse && (c.analyse||'')!==view.fAnalyse) return false;
    if(view.fInformer && !aInformer(c)) return false;
    if(view.fAdr && (norm(c.adresseur||'')!==norm(view.fAdr) || !lieuAdrOk(c))) return false;
    // patients Somnum masqués par défaut (ils restent dans les données et dans la page Patients PPC)
    if(c.analyse==='PSG' && !somnumVisibles()) return false;
    return true;
  });
  const k=view.sortKey, d=view.sortDir;
  const val=c=> k==='iah' ? num(c.iah) : k==='statut' ? STATUTS.findIndex(s=>s.v===(c.statut||'rien')) : k==='annonce' ? (((state.rdv||{})[patientKey(c)]||{}).annonce||'')
    : k==='prestataire' ? (c.traitement==='PPC'?c.prestataire:'') : (c[k]||'');
  // à valeur égale : ordre alphabétique des noms
  rows.sort((a,b)=>cmpVals(val(a),val(b),d) || cmpVals(a.nom+' '+a.prenom, b.nom+' '+b.prenom, 1));
  // vue simplifiée : chaque mois en deux colonnes (date, nom, prénom, IAH, contact, statut)
  const simple=!vueDetaillee(), tb=document.getElementById('tbody'), ORD=simple?COLS_SIMPLES.map(k=>COLS.find(c=>c.k===k)):colonnesVisibles(), NC=simple?1:ORD.length;
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="${NC}" class="empty">${state.consults.length?'Aucun résultat.':'Aucune consultation. Cliquez sur « + Nouvelle consultation ».'}</td></tr>`; majSelection(rows); return; }

  const docsPar=documentsParPatient();
  const ligne=c=>{
    const st=c.statut||'rien', isPPC=c.traitement==='PPC';
    const cls=[isPPC?'row-ppc':'', alerte(c)?'row-alerte':'', num(c.iah)>30?'row-iah30':'', st==='cr'?'row-cr':''].filter(Boolean).join(' ');
    const cellules={
      _sel:`<td class="cell-sel" title="Cliquer pour cocher · glisser vers le haut ou le bas pour cocher plusieurs lignes · Maj+clic pour cocher une plage"><input type="checkbox" class="sel" ${view.sel.has(c.id)?'checked':''}></td>`,
      date:`<td><button class="date-btn" data-date-menu title="${esc(fmtDate(c.date)||'Sans date')} — cliquer pour modifier (saisie ou calendrier)">${c.date?esc(dateCourte(c.date)):'<span class="muted">jj/mm</span>'}</button></td>`,
      // nom : un clic ouvre la fiche complète du patient (modifiable) ; ligne nouvelle sans nom : saisie directe
      nom:c.nom?`<td><div class="nom-cell"><button class="nom-lien" data-fiche="${c.id}" title="Ouvrir la fiche de ${esc(c.nom)} ${esc(c.prenom||'')}">${esc(c.nom)}</button></div></td>`
        :`<td><input type="text" class="nom-in" data-f="nom" value="" placeholder="NOM"></td>`,
      prenom:`<td><input type="text" class="prenom-in" data-f="prenom" value="${esc(c.prenom)}" placeholder="Prénom" title="${esc(c.prenom)}"></td>`,
      // à gauche de l'IAH : 📣 si le patient est à informer, puis le traitement (icTraitement)
      iah:`<td><div class="iahcell"><span class="iah-ics">${aInformer(c)?`<span class="ic-informer" data-informer-mois="${esc((c.date||'').slice(0,7)||'sans')}" title="À informer : compte rendu fait mais patient pas encore prévenu — cliquer pour choisir les patients à prévenir via Doctolib">📣</span>`:''}${icTraitement(c)}</span><input class="num iah-in ${classeIAH(c.iah)}" type="text" inputmode="decimal" data-f="iah" value="${esc(c.iah)}" placeholder="—"></div></td>`,
      analyse:`<td>${selAnalyse(c.analyse)}</td>`,
      annonce:(()=>{ const a=((state.rdv||{})[patientKey(c)]||{}).annonce; return `<td class="hint" title="Date de la consultation d'annonce des résultats (lue dans Doctolib, modifiable dans la fiche du patient)">${estDate(a)?esc(dateCourte(a)):a==='fait'?'✔':'—'}</td>`; })(),
      info:`<td><div class="contact">${c.info&&ICONES_CONTACT[c.info]?`<button class="ct on" data-ct-menu title="${c.info==='Doctolib'?'Prévenu par Doctolib':'Prévenu par téléphone'} — cliquer pour changer">${ICONES_CONTACT[c.info]}</button>`:`<button class="ct-vide" data-ct-menu title="Pas encore prévenu — cliquer pour choisir Doctolib ou téléphone">○</button>`}</div></td>`,
      // statut : simple pastille (gris rien de fait, orange CR fait, vert terminé) ; un clic propose les trois
      statut:`<td><div class="st-cell"><button class="st-pastille st-p-${st}" data-st-menu title="${esc(ST_LABEL(st))} — cliquer pour changer"></button></div></td>`,
      traitement:`<td><select data-f="traitement">${TRAITEMENTS.map(t=>`<option value="${t}" ${t===(c.traitement||'')?'selected':''}>${t||'—'}</option>`).join('')}</select></td>`,
      prestataire:`<td>${isPPC?selPresta(c.prestataire):'<span class="muted">—</span>'}</td>`,
      adresseur:`<td><input type="text" class="adr-in" data-f="adresseur" list="dl-adresseurs" value="${esc(c.adresseur||'')}" placeholder="—" title="${esc([c.adresseur,c.adresseurDetail].filter(Boolean).join(' — ')||'Médecin adresseur')}"></td>`,
      commentaire:`<td><input type="text" data-f="commentaire" value="${esc(c.commentaire||'')}" title="${esc(c.commentaire||'')}"></td>`,
      docs:`<td class="docs-cell">${iconesDocs(c, docsPar)}</td>`,
      _act:`<td style="white-space:nowrap">${isPPC?`<button class="small" data-act="mail" title="Préparer le mail au prestataire">✉️</button> `:''}${isPPC?`<button class="small" data-act="fiche" title="Ouvrir la fiche de suivi PPC">Fiche PPC →</button> `:''}${c.traitement==='OAM'?`<button class="small" data-act="oam" title="Voir le suivi OAM du patient">Suivi OAM →</button> `:''}<button class="small danger" data-act="del" title="Supprimer">✕</button></td>`,
    };
    return `<tr data-id="${c.id}" data-sel="${c.id}"${(cls||view.sel.has(c.id))?` class="${cls}${view.sel.has(c.id)?' row-sel':''}"`:''}${isPPC?` style="--pc:${couleurPresta(c.prestataire)}"`:''}>${ORD.map(col=>cellules[col.k]).join('')}</tr>`;
  };
  // vue simplifiée : les plus récents dans la colonne de gauche, la suite dans celle de droite
  const W=largeursSimples(), totW=ORD.reduce((s,c)=>s+W[c.k],0);
  const mini=liste=>`<table class="fixed mini" style="width:${totW}px"><colgroup>${ORD.map(c=>`<col data-k="${c.k}" style="width:${W[c.k]}px">`).join('')}</colgroup>
    <thead><tr>${ORD.map(c=>c.k==='_sel'?'<th class="cell-sel"></th>':th(c.k,c.label).replace('</th>',`<span class="rz rz-s" data-k="${c.k}" title="Glisser pour régler la largeur (les colonnes suivantes se décalent)"></span></th>`)).join('')}</tr></thead><tbody>${liste.map(ligne).join('')}</tbody></table>`;
  const lignes=liste=>{ if(!simple) return liste.map(ligne).join('');
    const n=Math.ceil(liste.length/2);
    return `<tr class="duo"><td colspan="1"><div class="duo-grille">${mini(liste.slice(0,n))}${liste.length>n?mini(liste.slice(n)):'<div></div>'}</div></td></tr>`; };

  // Regroupement par mois (quand le tableau est trié par date)
  if(k==='date' && view.groupMois!==false){
    view.moisFermes=view.moisFermes||{};
    const groupes=[]; for(const c of rows){ const m=(c.date||'').slice(0,7)||'sans'; let g=groupes[groupes.length-1]; if(!g||g.m!==m) groupes.push(g={m,rows:[]}); g.rows.push(c); }
    tb.innerHTML=groupes.map(g=>{
      const ferme=!!view.moisFermes[g.m], nA=g.rows.filter(alerte).length, nP=g.rows.filter(c=>c.traitement==='PPC').length;
      const prestas=PRESTATAIRES.map(p=>[p,g.rows.filter(c=>c.traitement==='PPC'&&c.prestataire===p).length]).filter(x=>x[1]);
      return `<tr class="mois" data-m="${g.m}"><td colspan="${NC}"><div class="mois-ligne"><input type="checkbox" class="sel-mois" title="Cocher tout le mois" ${g.rows.every(c=>view.sel.has(c.id))?'checked':''}> <span class="fl">${ferme?'▸':'▾'}</span> ${g.m==='sans'?'Sans date':nomMois(g.m)}
        <span class="mois-n">${g.rows.length} consultation${g.rows.length>1?'s':''}${nP?` · ${nP} sous PPC`:''}${nA?` · <span class="mois-alerte">${nA} IAH &gt; 30 non terminé${nA>1?'s':''}</span>`:''}${(n=>n?` · <button class="mois-informer" data-informer-mois="${g.m}" title="Choisir les patients à prévenir et copier la liste pour « Informer via Doctolib »">📣 ${n} à informer</button>`:'')(g.rows.filter(aInformer).length)}</span>
        ${prestas.map(([p,n])=>`<span class="presta mois-presta" style="--pc:${couleurPresta(p)}" title="${n} patient${n>1?'s':''} ${esc(p)}">${LOGOS_PRESTA[p]?logoPresta(p)+n:`${n} ${esc(p)}`}</span>`).join('')}
        ${(()=>{ const nPG=g.rows.filter(c=>compteEn(c)==='PG').length; return `<span class="mois-euros" title="PMB uniquement : ${nPG} polygraphie(s) (et consultations sans analyse précisée) × ${euros(tarif('PG'))}">PMB ≈ ${euros(nPG*tarif('PG'))}</span>`; })()}</div></td></tr>`
        + (ferme?'':lignes(g.rows));
    }).join('');
    tb.querySelectorAll('tr.mois').forEach(tr=>tr.onclick=e=>{ if(e.target.matches('.sel-mois')) return;
      const inf=e.target.closest('[data-informer-mois]'); if(inf){ fenetreInformerDoctolib({mois:inf.dataset.informerMois}); return; } const m=tr.dataset.m; view.moisFermes[m]=!view.moisFermes[m]; fillConsultRows(); });
    tb.querySelectorAll('.sel-mois').forEach(cb=>cb.onchange=()=>{
      const g=groupes.find(g=>g.m===cb.closest('tr').dataset.m);
      g.rows.forEach(c=>cb.checked?view.sel.add(c.id):view.sel.delete(c.id)); fillConsultRows();
    });
  } else tb.innerHTML=lignes(rows);
  if(simple){ bindSort(tb, view, ()=>{ if(!colResizeVientDeFinir) renderConsultations(); }); bindLargeursSimples(tb); if(ajustAuto()) ajusterColsSimples(tb); }

  // Cases à cocher : sélection de lignes pour les actions groupées
  selectionRapide(tb, 'consult', id=>view.sel.has(id), (id,on)=>on?view.sel.add(id):view.sel.delete(id), ()=>majSelection(rows));
  const all=document.getElementById('sel-all');
  if(all) all.onchange=()=>{ rows.forEach(c=>all.checked?view.sel.add(c.id):view.sel.delete(c.id)); fillConsultRows(); };
  majSelection(rows);
  bindIconesDocs(tb);
  tb.querySelectorAll('[data-fiche]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const c=state.consults.find(x=>x.id===b.dataset.fiche); if(c) fichePatient(c); });

  tb.querySelectorAll('tr[data-id] [data-f]').forEach(el=>{
    const c=state.consults.find(x=>x.id===el.closest('tr').dataset.id), f=el.dataset.f;
    if(f==='date'){
      // petit calendrier (icône 📅) : ouvre le calendrier du navigateur
      const cal=el.parentElement.querySelector('.cal-in');
      if(cal){
        cal.addEventListener('click',e=>{ e.stopPropagation(); try{ cal.showPicker(); }catch(_){} });
        cal.addEventListener('change',()=>{ if(cal.value){ c.date=cal.value; save(); renderConsultations(); } });
      }
      // affichée « jj/mm » ; en cliquant on voit et on modifie la date complète « jj/mm/aaaa »
      el.addEventListener('focus',()=>{ el.value=fmtDate(c.date); el.select(); });
      el.addEventListener('blur',()=>{ el.value=dateCourte(c.date); });
      el.addEventListener('keydown',e=>{ if(e.key==='Enter') el.blur(); if(e.key==='Escape'){ el.value=fmtDate(c.date); el.blur(); } });
      el.addEventListener('change',()=>{
        const v=el.value.trim();
        if(!v){ c.date=''; } else { const iso=toISO(v, c.date?+c.date.slice(0,4):new Date().getFullYear()); if(!iso){ toast('Date non reconnue (format jj/mm ou jj/mm/aaaa)'); el.value=fmtDate(c.date); return; } c.date=iso; }
        save(); renderConsultations();
      });
      return;
    }
    el.addEventListener('input',()=>{ c[f]=el.value; if(f==='nom') c.nom=el.value.toUpperCase(); save(); });
    el.addEventListener('change',()=>{
      if(f==='nom'){ el.value=c.nom; }
      if(f==='prenom'){ c.prenom=el.value.trim().replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()); el.value=c.prenom; }
      save();
      if(['iah','statut','traitement','prestataire','info','date','analyse'].includes(f)) renderConsultations();
    });
  });
  bindLasso(tb, ()=>majSelection(rows));
  tb.querySelectorAll('tr[data-id] [data-informer-mois]').forEach(x=>x.onclick=e=>{ e.stopPropagation(); fenetreInformerDoctolib({mois:x.dataset.informerMois}); });
  tb.querySelectorAll('[data-date-menu]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const c=state.consults.find(x=>x.id===b.closest('tr').dataset.id); if(c) menuDate(b, c); });
  tb.querySelectorAll('[data-st-menu]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const c=state.consults.find(x=>x.id===b.closest('tr').dataset.id); if(c) menuStatut(b, c); });
  tb.querySelectorAll('[data-presta-menu]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const c=state.consults.find(x=>x.id===b.closest('tr').dataset.id); if(c) menuPresta(b, c); });
  tb.querySelectorAll('[data-ct-menu]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const c=state.consults.find(x=>x.id===b.closest('tr').dataset.id); if(c) menuContact(b, c); });
  tb.querySelectorAll('button[data-act]').forEach(b=>b.onclick=()=>{
    const c=state.consults.find(x=>x.id===b.closest('tr').dataset.id);
    if(b.dataset.act==='del'){
      if(confirm(`Supprimer la consultation de ${c.nom} ${c.prenom} du ${fmtDate(c.date)} ?`)){ state.consults=state.consults.filter(x=>x!==c); save(); renderConsultations(); }
    } else if(b.dataset.act==='cr'){
      ouvrirCR(c);
    } else if(b.dataset.act==='mail'){
      fenetreMailPresta(patientKey(c));
    } else if(b.dataset.act==='oam'){
      viewOAM.q=c.nom; viewOAM.filtre=''; location.hash='oam';
    } else {
      if(!c.nom){ toast('Renseignez d\'abord le nom du patient'); return; }
      location.hash='fiche/'+encodeURIComponent(patientKey(c));
    }
  });
}

let fermerFiche=null;
// Dossier PPC complet, affiché dans la fiche du patient : examen du sommeil, appareillage, efficacité, échanges avec le prestataire
function blocDossierPPC(c, k, o){

  const exams=cs.filter(x=>dateExamen(x)).sort((a,b)=>dateExamen(a).localeCompare(dateExamen(b)));
  const init=exams[0]||c, sev=severity(init.iah), s=suivis(k), l=s[s.length-1], pv=suivisPrevus(k,o), auj=today();
  const ligne=(lib,val)=>val?`<div class="dp-l"><span>${lib}</span><b>${val}</b></div>`:'';
  const rdv=(v,prevu)=>estDate(v)?`✔ fait le ${fmtDate(v)}`:v==='fait'?'✔ fait (date non notée)':prevu?`<span class="${prevu<auj?'val-bad':'muted'}">à faire${prevu<auj?' (en retard)':''} — prévu vers ${nomMois(prevu.slice(0,7)).toLowerCase()}</span>`:'—';
  const fin=o.finPrescr&&estDate(o.finPrescr)?`<span class="${o.finPrescr<auj?'val-bad':o.finPrescr<plusMois(auj,1)?'val-warn':''}">${fmtDate(o.finPrescr)}${o.finPrescr<auj?' (échue)':o.finPrescr<plusMois(auj,1)?' (dans moins d’un mois)':''}</span>`:'';
  const detailsPoly=init.poly?polyResume(init).split('\n').slice(1).join(' · '):'';
  const delai=l&&estDate(dateExamen(init))?Math.round((new Date(l.date)-new Date(dateExamen(init)))/864e5/30.44):null;
  const mails=(o.mails||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const inst=(o.install||'').trim();
  return `<div class="dp">
    <div class="dp-c"><h4>🧪 Examen du sommeil</h4>
      ${ligne('Date', fmtDate(dateExamen(init))||'—')}
      ${ligne('Examen', init.analyse?`${logoAnalyse(init.analyse)} ${esc(LIB_ANALYSE[init.analyse]||init.analyse)} (${init.analyse==='PSG'?'polysomnographie':'polygraphie'})`:'')}
      ${ligne('IAH initial', init.iah?`<span class="${classeIAH(init.iah)}">${esc(init.iah)} /h</span>${sev?` <span class="badge ${sev.cls}">${sev.label}</span>`:''}`:'—')}
      ${detailsPoly?`<div class="dp-l dp-pl"><span>Détails</span><b>${esc(detailsPoly)}</b></div>`:''}
      ${ligne('Adressé par', esc(init.adresseur||''))}
      ${exams.length>1?`<div class="dp-l dp-pl"><span>Autres examens</span><b>${exams.slice(1).map(x=>`${fmtDate(dateExamen(x))} (IAH ${esc(x.iah||'?')})`).join(' · ')}</b></div>`:''}</div>
    <div class="dp-c"><h4>🫁 Appareillage</h4>
      ${ligne('Prestataire', presta?`${logoPresta(presta)} ${esc(presta)}`:'<span class="muted">non renseigné</span>')}
      ${ligne('Appareil', esc(o.appareil||''))}
      ${ligne('Installation', estDate(o.installation)?fmtDate(o.installation):'')}
      ${ligne('IMC', o.imc?esc(o.imc)+' kg/m²':'')}
      ${ligne('IAH initial (prestataire)', o.iahInitPresta?esc(o.iahInitPresta)+' /h':'')}
      ${ligne('Début estimé de la PPC', pv.base?(()=>{ const x=new Date(pv.base+'T12:00'); x.setDate(x.getDate()+15); return 'vers le '+fmtDate(isoLocal(x))+' <span class="hint">(examen + 15 j)</span>'; })():'')}
      ${ligne('Suivi à 4 mois', rdv(o.suivi4, pv.s4))}
      ${ligne('Suivi annuel', rdv(o.suiviAn, pv.sAn))}
      ${ligne('Visites ponctuelles', (o.ponctuels||[]).map(fmtDate).join(' · '))}
      ${ligne('Fin de prescription', fin)}
      ${ligne('N° de sécurité sociale', o.nir?esc(fmtNir(o.nir)):'')}
      ${inst?`<div class="dp-inst"><span>Début d’installation</span><div>${esc(inst)}</div></div>`:''}
      ${presta?`<div style="margin-top:6px">${boutonTelesuivi(presta,true)}</div>`:''}</div>
    <div class="dp-c dp-large"><h4>📈 Efficacité du traitement ${l?`<span class="hint">dernier rapport du ${fmtDate(l.date)}${delai!=null?` · ${delai} mois après l’examen`:''}</span>`:''}</h4>
      ${s.length?`<div class="dp-kpi"><div><span>IAH résiduel</span><b>${cellIAHres(l.iahRes)}</b></div><div><span>Observance</span><b>${cellObs(l.obs)}</b></div><div><span>Nuits ≥ 4 h</span><b>${l.obsPct?esc(l.obsPct)+' %':'—'}</b></div><div><span>${l.pPct==90?'P90':'P95'}</span><b>${cellP(l.p95,l.pPct)}</b></div><div><span>Fuites</span><b>${cellFuites(l.fuites,false)}</b></div><div><span>Fuites ${l.fPct==90?'90e':'95e'} c.</span><b>${cellFuites(l.fuitesP95,true,l.fPct)}</b></div></div>
        ${s.length>1?`<table class="dp-t"><thead><tr><th>Rapport</th><th>IAH rés.</th><th>Observance</th><th>≥ 4 h</th><th>Pression</th><th>Fuites</th><th>Fuites 95e</th><th>Commentaire</th></tr></thead><tbody>${s.slice().reverse().slice(0,12).map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${cellIAHres(x.iahRes)}</td><td>${cellObs(x.obs)}</td><td>${x.obsPct?esc(x.obsPct)+' %':'—'}</td><td>${cellP(x.p95,x.pPct)}</td><td>${cellFuites(x.fuites,false)}</td><td>${cellFuites(x.fuitesP95,true,x.fPct)}</td><td class="hint">${esc(x.commentaire||'')}</td></tr>`).join('')}</tbody></table>${s.length>12?`<p class="hint">… ${s.length-12} rapport(s) plus ancien(s) dans la fiche PPC.</p>`:''}`:''}`
        :'<p class="muted" style="margin:0">Aucun rapport de télésuivi importé.</p>'}</div>
    <div class="dp-c dp-large"><h4>📨 Échanges avec le prestataire <span class="hint">${mails.length?mails.length+' mail'+(mails.length>1?'s':''):''}</span></h4>
      ${mails.length?mails.map(m=>`<div class="dp-mail"><div class="dp-mh">${m.presta?logoPresta(m.presta):''}<b>${fmtDate(m.date)||''}</b> <span class="hint">${esc(m.objet||'')}</span></div>${m.msg?`<div>${esc(m.msg)}</div>`:''}${(m.pj||[]).length?`<div class="hint">📎 ${m.pj.map(esc).join(', ')}</div>`:''}</div>`).join('')
        :'<p class="muted" style="margin:0">Aucun mail de prestataire intégré pour ce patient. Les prochains mails intégrés (📨 Mails prestataires) s’afficheront ici.</p>'}</div>
  </div>`;
}
function fichePatient(c){
  if(fermerFiche) fermerFiche(true);
  const k=patientKey(c), o=(state.rdv||{})[k]||{}, autres=state.consults.filter(x=>x!==c && patientKey(x)===k).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const sev=severity(c.iah), st=c.statut||'rien', s=c.traitement==='PPC'?suivis(k):[], l=s[s.length-1];
  const opt=(liste,v)=>liste.map(x=>{ const [val,lib]=Array.isArray(x)?x:[x,x||'—']; return `<option value="${esc(val)}" ${val===(v||'')?'selected':''}>${esc(lib)}</option>`; }).join('');
  const champ=(lib,html,large)=>`<label class="fp-champ${large?' fp-large':''}"><span>${lib}</span>${html}</label>`;
  const age=o.ddn?Math.floor((Date.now()-new Date(o.ddn))/31557600000):null;
  const fond=document.createElement('div'); fond.className='cr-modal fiche-pat';
  fond.innerHTML=`<div class="cr-boite" style="width:min(${c.traitement==='PPC'?1020:760}px,100%)">
    <div class="toolbar" style="margin:0 0 10px"><b style="font-size:17px">${esc(c.nom)} ${esc(c.prenom||'')}</b>
      ${aInformer(c)?'<span class="a-informer-l">À informer</span>':''}<span class="hint">${[o.ddn?'né(e) le '+fmtDate(o.ddn)+(age!=null?` (${age} ans)`:''):'', o.tel?'☎ '+esc(o.tel):''].filter(Boolean).join(' · ')}</span>
      <div class="spacer"></div><button class="small" id="fp-fermer">✕ Fermer</button></div>
    <div class="fp-grille">
      ${champ('Nom',`<input data-ff="nom" value="${esc(c.nom)}">`)}
      ${champ('Prénom',`<input data-ff="prenom" value="${esc(c.prenom||'')}">`)}
      ${champ('Date de consultation',`<input type="date" data-ff="date" value="${esc(c.date||'')}">`)}
      ${champ('IAH'+(sev?` <span class="badge ${sev.cls}">${sev.label}</span>`:''),`<input data-ff="iah" class="${classeIAH(c.iah)}" value="${esc(c.iah||'')}" inputmode="decimal">`)}
      ${champ('Analyse',`<select data-ff="analyse">${opt([['','—'],...ANALYSES.map(a=>[a,LIB_ANALYSE[a]])],c.analyse)}</select>`)}
      ${champ('Statut',`<select data-ff="statut" class="st-${st}">${opt(STATUTS.map(x=>[x.v,x.label]),st)}</select>`)}
      ${champ('Contact avec le patient',`<select data-ff="info">${opt([['','Pas encore informé'],['Doctolib','Doctolib'],['Appel','Téléphone']],c.info)}</select>`)}
      ${champ('Traitement',`<select data-ff="traitement">${opt(TRAITEMENTS,c.traitement)}</select>`)}
      ${c.traitement==='PPC'?champ('Prestataire PPC',`<select data-ff="prestataire">${opt([['','— choisir —'],...PRESTATAIRES.map(p=>[p,p])],c.prestataire)}</select>`):''}
      ${champ('Médecin adresseur',`<input data-ff="adresseur" list="dl-adresseurs" value="${esc(c.adresseur||'')}" title="${esc(c.adresseurDetail||'')}">`)}
      ${champ('Téléphone',`<input data-fr="tel" value="${esc(o.tel||'')}">`)}
      ${champ('Date de naissance',`<input type="date" data-fr="ddn" value="${esc(o.ddn||'')}">`)}
      ${champ('Annonce des résultats',`<input type="date" data-fr="annonce" value="${esc(estDate(o.annonce)?o.annonce:'')}">`)}
      ${champ('Commentaire',`<textarea data-ff="commentaire" rows="2">${esc(c.commentaire||'')}</textarea>`,true)}
    </div>
    ${c.poly&&c.traitement!=='PPC'?`<div class="fp-bloc"><b>${c.analyse==='PSG'?'Polysomnographie':'Polygraphie'}</b><div class="hint" style="white-space:pre-line">${esc(polyResume(c))}</div></div>`:''}
    ${c.traitement!=='PPC'&&(o.suivi4||o.suiviAn||(o.ponctuels||[]).length)?`<div class="fp-bloc"><b>Visites de suivi</b> <span class="hint">${[o.suivi4?'4 mois : '+(estDate(o.suivi4)?fmtDate(o.suivi4):'fait'):'', o.suiviAn?'annuelle : '+(estDate(o.suiviAn)?fmtDate(o.suiviAn):'faite'):'', (o.ponctuels||[]).length?'ponctuelles : '+o.ponctuels.map(fmtDate).join(', '):''].filter(Boolean).join(' · ')}</span></div>`:''}
    ${c.adresseurDetail?`<div class="fp-bloc"><b>Adressage</b> <span class="hint">${esc(c.adresseurDetail)}</span></div>`:''}
    <div class="fp-bloc"><b>Documents</b> <span class="docs-cell">${iconesDocs(c)||'<span class="hint">aucun</span>'}</span></div>
    ${c.traitement==='PPC'?blocDossierPPC(c,k,o):''}
    ${autres.length?`<div class="fp-bloc"><b>Autres consultations</b>${autres.map(x=>`<button class="small fp-autre" data-autre="${x.id}">${fmtDate(x.date)||'sans date'} · IAH ${esc(x.iah||'—')} · ${esc((STATUTS.find(y=>y.v===(x.statut||'rien'))||{}).label||'')}</button>`).join('')}</div>`:''}
    <div class="toolbar" style="margin:14px 0 0;gap:8px;flex-wrap:wrap">
      ${c.traitement==='PPC'?'<button class="small" id="fp-ppc">Fiche PPC →</button><button class="small" id="fp-mail">✉️ Mail au prestataire</button>'+boutonTelesuivi(c.prestataire,true):''}

  document.body.appendChild(fond);
  let modifie=false;
  const q=s=>fond.querySelector(s), fermer=(sansRendu)=>{ fond.remove(); document.removeEventListener('keydown',echap); fermerFiche=null; if(modifie && sansRendu!==true) render(); };

  const echap=e=>{ if(e.key==='Escape' && !e.target.closest('input,select,textarea')) fermer(); };
  document.addEventListener('keydown',echap);
  fond.onclick=e=>{ if(e.target===fond) fermer(); }; q('#fp-fermer').onclick=fermer;
  fond.querySelectorAll('[data-ff]').forEach(el=>el.onchange=()=>{
    const f=el.dataset.ff; let v=el.value.trim();
    if(f==='nom') v=v.toUpperCase(); if(f==='prenom') v=capName(v); if(f==='adresseur') v=formaterAdresseur(v);
    c[f]=v; save(); modifie=true;
    if(['statut','traitement','iah','info','nom','prenom'].includes(f)){ render(); modifie=false; fichePatient(c); }
  });
  fond.querySelectorAll('[data-fr]').forEach(el=>el.onchange=()=>{ rdvInfo(k)[el.dataset.fr]=el.value.trim(); save(); });
  bindIconesDocs(fond); bindTelesuivi(fond);

// Sélection au rectangle : cliquer dans une zone libre du tableau puis glisser coche toutes les lignes touchées
function bindLasso(tb, fin){
  tb.onmousedown=e=>{
    if(e.button!==0 || e.target.closest('input,select,textarea,.rz,td.cell-sel,th,[data-ct-menu],[data-st-menu],[data-date-menu],.iah-ics,a')) return;
    const x0=e.clientX, y0=e.clientY, surBouton=!!e.target.closest('button');
    if(!surBouton) e.preventDefault(); // pas de sélection de texte
    let rect=null; const avant=new Set(view.sel);
    const move=ev=>{
      if(!rect){ if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<6) return; rect=document.createElement('div'); rect.className='lasso'; document.body.appendChild(rect); document.body.classList.add('selecting','lasso-on'); }
      ev.preventDefault();
      const l=Math.min(x0,ev.clientX), t=Math.min(y0,ev.clientY), r=Math.max(x0,ev.clientX), b=Math.max(y0,ev.clientY);
      Object.assign(rect.style,{left:l+'px',top:t+'px',width:(r-l)+'px',height:(b-t)+'px'});
      tb.querySelectorAll('tr[data-sel]').forEach(tr=>{ const q=tr.getBoundingClientRect(), dedans=q.left<r && q.right>l && q.top<b && q.bottom>t, on=dedans||avant.has(tr.dataset.sel);
        on?view.sel.add(tr.dataset.sel):view.sel.delete(tr.dataset.sel);
        const cb=tr.querySelector('td.cell-sel input'); if(cb) cb.checked=on; tr.classList.toggle('row-sel',on); });
    };
    const up=()=>{ removeEventListener('mousemove',move); removeEventListener('mouseup',up);
      if(!rect) return; rect.remove(); document.body.classList.remove('selecting','lasso-on');
      // le clic qui suit (sur un nom par exemple) ne doit pas ouvrir la fiche
      const bloque=ev=>{ ev.stopPropagation(); ev.preventDefault(); }; addEventListener('click',bloque,true); setTimeout(()=>removeEventListener('click',bloque,true),50);
      fin(); };
    addEventListener('mousemove',move); addEventListener('mouseup',up);
  };
}
// Sélection rapide de lignes (colonne des cases) :
//  - clic n'importe où dans la case : coche / décoche
//  - clic maintenu puis glisser vers le haut ou le bas : coche (ou décoche) toutes les lignes survolées
//  - Maj+clic : coche (ou décoche) toute la plage depuis la dernière ligne cliquée
const ancreSel={};
function selectionRapide(tbody, nom, estSel, poser, fin){
  const lignes=()=>[...tbody.querySelectorAll('tr[data-sel]')];
  let mode=null;
  const appliquer=tr=>{
    const id=tr.dataset.sel; if(estSel(id)===mode) return;
    poser(id,mode); const cb=tr.querySelector('td.cell-sel input'); if(cb) cb.checked=mode;
    tr.classList.toggle('row-sel',mode); tr.style.opacity='';
  };
  tbody.querySelectorAll('tr[data-sel] td.cell-sel').forEach(td=>{
    const cb=td.querySelector('input'); if(cb) cb.addEventListener('click',e=>e.preventDefault()); // géré au mousedown
    td.addEventListener('mousedown',e=>{
      if(e.button!==0) return; e.preventDefault();
      const tr=td.closest('tr'), L=lignes(), i=L.indexOf(tr), a=L.findIndex(t=>t.dataset.sel===ancreSel[nom]);
      mode=!estSel(tr.dataset.sel);
      ancreSel[nom]=tr.dataset.sel;
      if(e.shiftKey && a>=0){ L.slice(Math.min(a,i),Math.max(a,i)+1).forEach(appliquer); mode=null; fin(); return; }
      appliquer(tr);
      document.body.classList.add('selecting');
      const survol=ev=>{ const t=ev.target.closest&&ev.target.closest('tr[data-sel]'); if(t && tbody.contains(t)) appliquer(t); };
      const stop=()=>{ tbody.removeEventListener('mouseover',survol); document.removeEventListener('mouseup',stop); document.body.classList.remove('selecting'); mode=null; fin(); };
      tbody.addEventListener('mouseover',survol); document.addEventListener('mouseup',stop);
    });
  });
}

function ppcPatients(){
  const map=new Map();
  state.consults.filter(c=>c.traitement==='PPC' && c.nom).forEach(c=>{
    const k=patientKey(c), p=map.get(k);
    if(!p || c.date>p.date) map.set(k,{key:k, nom:c.nom, prenom:c.prenom, prestataire:c.prestataire||(p&&p.prestataire)||'', date:c.date, iah:c.iah});
  });
  // type d'analyse (PG / PSG) : celui noté sur l'une des consultations du patient
  for(const p of map.values()) p.analyse=(state.consults.filter(c=>patientKey(c)===p.key && c.analyse).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||{}).analyse||'';
  return [...map.values()].sort((a,b)=>norm(a.nom+a.prenom).localeCompare(norm(b.nom+b.prenom)));
}
function suivis(key){ return (state.ppc[key]||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')); }
// Rendez-vous d'un patient : consultation d'annonce, suivi à 4 mois, dernier suivi annuel ('' = pas encore fait)
const rdvInfo = k => { state.rdv=state.rdv||{}; return state.rdv[k]=state.rdv[k]||{}; };
const plusMois = (d,n) => { if(!d) return ''; const x=new Date(d+'T12:00:00'); x.setMonth(x.getMonth()+n); return x.toISOString().slice(0,10); };
// Valeur d'un rendez-vous : une date, 'fait' (fait sans date connue) ou '' (pas fait)
const estDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v||'');
// Consultation de suivi (agenda ou fusion) : la 1re va dans « 4 mois », les suivantes dans « annuel » (on garde la plus récente).
// Un « fait » sans date est complété par la date quand elle arrive.
function rdvApresSuivi(o, date){
  const d4=o.suivi4||'', dA=o.suiviAn||'';
  if(date==='fait') return !d4 ? {suivi4:'fait', suiviAn:dA} : {suivi4:d4, suiviAn:dA||'fait'};
  if(!d4) return {suivi4:date, suiviAn:dA};
  if(d4==='fait'){
    // 4 mois fait sans date : une date proche de l'annonce (≤ 8 mois) est celle du suivi à 4 mois, sinon c'est un suivi annuel
    if(estDate(o.annonce) && date<=plusMois(o.annonce,8) && date>=o.annonce && !estDate(dA)) return {suivi4:date, suiviAn:dA};
    return {suivi4:'fait', suiviAn:estDate(dA)&&dA>date?dA:date};
  }
  const ds=[...new Set([d4, estDate(dA)?dA:'', date].filter(Boolean))].sort();
  return {suivi4:ds[0], suiviAn:ds.length>1?ds[ds.length-1]:dA};
}
function noterRdv(k, type, date){
  if(!date) return;
  const o=rdvInfo(k);
  if(type==='annonce'){ if(!o.annonce || (o.annonce==='fait' && date!=='fait')) o.annonce=date; }
  else Object.assign(o, rdvApresSuivi(o, date));
}

// Répartition des patients sous PPC par prestataire : anneau + légende (logo, nombre, %) ; survol = détail, clic = filtre
function camembertPresta(tous){
  const parts=[...PRESTATAIRES.map(p=>({p, n:tous.filter(x=>x.prestataire===p).length})), {p:'__none', n:tous.filter(x=>!x.prestataire).length}].filter(x=>x.n);
  const total=parts.reduce((s,x)=>s+x.n,0);
  if(!total) return '';
  const R=74, r=46, cx=80, cy=80, gap=2;
  let a0=-Math.PI/2;
  const pt=(rad,a)=>[cx+rad*Math.cos(a), cy+rad*Math.sin(a)];
  const arcs=parts.map(x=>{
    const a1=a0+x.n/total*2*Math.PI, grand=(a1-a0)>Math.PI?1:0, coul=x.p==='__none'?COULEUR_PPC_SANS_PRESTA:couleurPresta(x.p);
    const lib=x.p==='__none'?'Non renseigné':x.p, pct=Math.round(x.n/total*100);
    let d;
    if(parts.length===1) d=`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-0.01} ${cy-R}L${cx-0.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`;
    else { const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0); d=`M${x0} ${y0}A${R} ${R} 0 ${grand} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${grand} 0 ${x3} ${y3}Z`; }
    a0=a1;
    return `<path d="${d}" fill="${coul}" data-p="${esc(x.p)}" data-info="${esc(lib)} : ${x.n} patient${x.n>1?'s':''} (${pct} %)" class="part${viewPPC.presta===x.p?' on':''}"/>`;
  }).join('');
  const legende=parts.map(x=>{ const lib=x.p==='__none'?'Non renseigné':x.p, coul=x.p==='__none'?COULEUR_PPC_SANS_PRESTA:couleurPresta(x.p);
    return `<button class="leg${viewPPC.presta===x.p?' on':''}" data-p="${esc(x.p)}" title="Filtrer : ${esc(lib)}"><span class="pastille" style="background:${coul}"></span>${x.p==='__none'?'':logoPresta(x.p)}<span class="leg-nom">${esc(lib)}</span><b>${x.n}</b><span class="muted">${Math.round(x.n/total*100)} %</span></button>`; }).join('');
  return `<div class="card camembert">
    <div class="cam-graph"><svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Répartition des ${total} patients sous PPC par prestataire">${arcs}

    <div class="cam-leg"><div class="hint" style="margin-bottom:4px"><b>Répartition par prestataire</b> — cliquez pour filtrer</div>${legende}</div>
  </div>`;
}

// Fiche d'un prestataire (clic sur son logo ou son nom) : télésuivi + statistiques
// (patients, installations par année et par mois, bien observants, IAH résiduel, fins de prescription)
const MOIS_INIT=['J','F','M','A','M','J','J','A','S','O','N','D'];
function fichePrestataire(nom){
  document.querySelector('.pr-modal')?.remove();
  const presta=nom==='Prestataire non renseigné'?'':nom, auj=isoLocal(new Date());
  const pts=ppcPatients().filter(p=>(p.prestataire||'')===presta);
  const premier=new Map(); for(const c of state.consults){ const d=dateExamen(c); if(!estDate(d)) continue; const k=patientKey(c); if(!premier.has(k)||d<premier.get(k)) premier.set(k,d); }
  const plus15=d=>{ const x=new Date(d+'T12:00'); x.setDate(x.getDate()+15); return isoLocal(x); };
  let nRap=0, nObsMes=0, nObs=0, sObs=0, nIah=0, nIahOk=0, nFin=0, nFinBientot=0, nEst=0; const parAn={};
  for(const p of pts){
    const s=suivis(p.key), l=s[s.length-1], o=(state.rdv||{})[p.key]||{};
    if(l){ nRap++; const h=parseObs(l.obs); if(h!=null){ nObsMes++; sObs+=h; if(h>=4) nObs++; } const i=num(l.iahRes); if(i!=null){ nIah++; if(i<5) nIahOk++; } }
    if(estDate(o.finPrescr)){ if(o.finPrescr<auj) nFin++; else if(o.finPrescr<plusMois(auj,1)) nFinBientot++; }
    // installation : date réelle (portail du prestataire) sinon estimée = 1er examen + 15 jours
    let d=estDate(o.installation)?o.installation:''; if(!d && premier.has(p.key)){ d=plus15(premier.get(p.key)); nEst++; }
    if(d){ const a=d.slice(0,4); (parAn[a]=parAn[a]||Array(12).fill(0))[+d.slice(5,7)-1]++; }
  }
  const pct=(a,b)=>b?Math.round(a/b*100)+' %':'—';
  const ans=Object.keys(parAn).sort().reverse(), max=Math.max(1,...ans.flatMap(a=>parAn[a]));
  const fond=document.createElement('div'); fond.className='cr-modal fiche-pat pr-modal';
  fond.innerHTML=`<div class="cr-boite" style="width:min(820px,100%)">
    <div class="toolbar pr-tete" style="margin:0 0 10px">${presta?logoPresta(presta):''}<b style="font-size:19px">${esc(nom)}</b><div class="spacer"></div>${presta?boutonTelesuivi(presta,false):''}<button class="small" data-x>✕ Fermer</button></div>
    <div class="pr-kpis">
      <div><b>${pts.length}</b><span>patients sous PPC</span></div>
      <div><b class="${nObsMes&&nObs/nObsMes>=0.7?'val-ok':nObsMes?'val-warn':''}">${pct(nObs,nObsMes)}</b><span>bien observants (≥ 4 h)<br>${nObs} / ${nObsMes}</span></div>
      <div><b>${nObsMes?fmtObs(sObs/nObsMes):'—'}</b><span>observance moyenne</span></div>
      <div><b class="${nIah&&nIahOk/nIah>=0.8?'val-ok':nIah?'val-warn':''}">${pct(nIahOk,nIah)}</b><span>IAH résiduel &lt; 5<br>${nIahOk} / ${nIah}</span></div>
      <div><b>${pts.length-nRap}</b><span>sans rapport de télésuivi</span></div>
      <div><b class="${nFin?'val-bad':''}">${nFin}</b><span>fin de prescription échue${nFinBientot?`<br>+ ${nFinBientot} dans moins d’un mois`:''}</span></div>
    </div>
    <h4 class="pr-h4">Installations par année et par mois</h4>
    ${ans.length?ans.map(a=>{ const t=parAn[a].reduce((x,y)=>x+y,0); return `<div class="pr-an"><div class="pr-an-t"><b>${a}</b><span>${t} installation${t>1?'s':''}</span></div>
      <div class="pr-barres">${parAn[a].map((n,i)=>`<div class="pr-barre" title="${new Date(+a,i,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})} : ${n} installation${n>1?'s':''}"><span class="pr-n">${n||''}</span><i style="height:${Math.round(n/max*56)}px"></i><small>${MOIS_INIT[i]}</small></div>`).join('')}</div></div>`; }).join('')
      :'<p class="muted">Aucune date d’installation connue.</p>'}
    <p class="hint" style="margin-bottom:0">Date d’installation : celle du portail du prestataire quand elle est connue${nEst?`, sinon estimée (premier examen + 15 jours) pour ${nEst} patient${nEst>1?'s':''}`:''}. Observance et IAH résiduel : dernier rapport de télésuivi importé.</p>
  </div>`;
  document.body.appendChild(fond);
  const fermer=()=>{ fond.remove(); document.removeEventListener('keydown',ech); };
  const ech=e=>{ if(e.key==='Escape') fermer(); }; document.addEventListener('keydown',ech);
  fond.querySelector('[data-x]').onclick=fermer; fond.onclick=e=>{ if(e.target===fond) fermer(); };
  bindTelesuivi(fond);
}
function bindCartesPPC(app){

  app.querySelectorAll('[data-pctri]').forEach(h=>h.onclick=e=>{ if(e.target.closest('.pc-grip')) return; const k=h.dataset.pctri, T=viewPPC.pcTri||{k:'nom',dir:1};

    g.onclick=e=>e.stopPropagation();
    g.ondblclick=e=>{ e.stopPropagation(); const r=largeursPC(); r[+g.dataset.col]=PPC_COLS[+g.dataset.col].w; state.reglages={...(state.reglages||{}), pcCols:r}; save(); renderPPCList(); };
    g.onmousedown=e=>{ e.preventDefault(); e.stopPropagation(); const i=+g.dataset.col, x0=e.clientX, w0=g.parentElement.getBoundingClientRect().width, r=largeursPC();
      document.body.classList.add('pc-redim');

      const lache=()=>{ document.removeEventListener('mousemove',bouge); document.removeEventListener('mouseup',lache); document.body.classList.remove('pc-redim');
        state.reglages={...(state.reglages||{}), pcCols:r}; save(); };
      document.addEventListener('mousemove',bouge); document.addEventListener('mouseup',lache); };
  });
  // logo ou nom d'un prestataire : sa fiche (télésuivi + statistiques)
  app.querySelectorAll('.pc-tete img.logo-p,.pc-tete h3,.pc-tete .pc-sans').forEach(e=>{ e.style.cursor='pointer'; e.title='Statistiques et télésuivi du prestataire'; e.onclick=ev=>{ ev.stopPropagation(); fichePrestataire(e.closest('.pc-tete').querySelector('h3').textContent.trim()); }; });
  bindTelesuivi(app);
}

function suivisPrevus(key, rv){

  if(!dates.length) return {base:'', s4:'', sAn:''};
  const x=new Date(dates[0]+'T12:00:00'); x.setDate(x.getDate()+15); const debut=isoLocal(x);

/* ---- Retours de début d'installation PPC (capture du prestataire) ----

const RX_INSTALL=/(?:^|\n)[ \t]*(Madame|Monsieur|Mme\.?|Mlle\.?|M\.|Mr\.?)[ \t]+([^\n:]*?)[ \t]+(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})[ \t]*[:;]/g;

  const t=texte.normalize('NFC').replace(/\r/g,''), ms=[...t.matchAll(RX_INSTALL)];
  return ms.map((m,i)=>{ const fin=i+1<ms.length?ms[i+1].index:t.length;
    let an=+m[5]; if(an<100) an+=an>(new Date().getFullYear()%100)?1900:2000;
    return {nomComplet:m[2].replace(/[^\p{L}' -]/gu,' ').replace(/\s+/g,' ').trim(),
      ddn:`${an}-${m[4].padStart(2,'0')}-${m[3].padStart(2,'0')}`,
      msg:t.slice(m.index+m[0].length, fin).replace(/\s*\n\s*/g,' ').replace(/\s+/g,' ').trim()}; });
}
// Patient correspondant : tous les mots de son nom et prénom présents (une lettre d'écart tolérée) ; une date de naissance connue et différente écarte l'homonyme
function patientInstallation(r){
  const mots=nomComplet(r.nomComplet).split(' ').filter(Boolean), vu=w=>mots.some(m=>m===w||(w.length>=5&&lev1(w,m)));
  const parCle=new Map(); for(const c of state.consults) if(c.nom && !estNonPatient(c.nom, c.prenom)){ const k=patientKey(c); if(!parCle.has(k)) parCle.set(k,{key:k, nom:c.nom, prenom:c.prenom, ppc:false}); if(c.traitement==='PPC') parCle.get(k).ppc=true; }
  const ddnDe=p=>((state.rdv||{})[p.key]||{}).ddn;
  const L=[...parCle.values()].filter(p=>nomComplet(p.nom+' '+p.prenom).split(' ').filter(Boolean).every(vu) && (!ddnDe(p)||ddnDe(p)===r.ddn));

async function ocrInstallation(blob, setP){
  const w=await moduleOCR(setP), bmp=await createImageBitmap(blob), k=bmp.width<1600?2:1, c=document.createElement('canvas');
  c.width=bmp.width*k; c.height=bmp.height*k; const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(bmp,0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height), d=im.data; let somme=0;
  for(let i=0;i<d.length;i+=4) somme+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  const sombre=somme/(d.length/4)<128; // texte clair sur fond sombre : inversé pour la lecture
  for(let i=0;i<d.length;i+=4){ let v=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; if(sombre) v=255-v; d[i]=d[i+1]=d[i+2]=v; }
  g.putImageData(im,0,0);

}

/* ============ Doublons : détection et fusion ============ */
// Nombre d'informations renseignées sur une ligne (pour choisir la plus complète)
const nbInfos = c => ['date','iah','info','traitement','prestataire','commentaire'].filter(f=>c[f]).length + (c.poly?2:0) + ((c.statut||'rien')!=='rien'?1:0);
function groupesDoublons(){
  const groupes=new Map();
  for(const c of state.consults){
    if(!c.nom) continue;
    const k=nomComplet(c.nom+' '+c.prenom).split(' ').sort().join(' '); // insensible à l'ordre nom / prénom
    if(!groupes.has(k)) groupes.set(k,[]); groupes.get(k).push(c);
  }
  return [...groupes.values()].filter(g=>g.length>1).map(g=>{
    // Doublon probable : même date, date manquante, ou même IAH
    const probable=g.some((a,i)=>g.some((b,j)=>j>i && (a.date===b.date || !a.date || !b.date || (num(a.iah)!=null && num(a.iah)===num(b.iah)))));
    return {rows:g.slice().sort((a,b)=>nbInfos(b)-nbInfos(a)), probable, cle:g.map(c=>c.id).sort().join('+')};
  }).filter(g=>!(state.distincts||[]).includes(g.cle));
}
const nbDoublons = () => groupesDoublons().filter(g=>g.probable).length;
function fusionner(rows, baseId){
  const base=rows.find(c=>c.id===baseId), autres=rows.filter(c=>c!==base), kb=patientKey(base);
  for(const o of autres){
    for(const f of ['date','iah','info','traitement','prestataire','analyse','adresseur','adresseurDetail']) if(!base[f] && o[f]) base[f]=o[f];
    if((RANG[o.statut||'rien']||0)>(RANG[base.statut||'rien']||0)) base.statut=o.statut;
    if(o.commentaire && !(base.commentaire||'').includes(o.commentaire)) base.commentaire=[base.commentaire,o.commentaire].filter(Boolean).join(' · ');
    if(!base.poly && o.poly) base.poly=o.poly;
    if(!base.cr && o.cr){ base.cr=o.cr; copierCR(o.id, base.id).catch(console.error); } // compte rendu attaché
    if(o.docs && o.docs.length) base.docs=[...(base.docs||[]), ...o.docs]; // autres documents (rapports PPC, DAP…)
    deplacerCles(patientKey(o), kb);
  }
  state.consults=state.consults.filter(c=>!autres.includes(c));
}
// Suivis PPC / OAM / rendez-vous enregistrés sous une autre écriture du nom : regroupés sous la bonne
function deplacerCles(ko, kb){
  if(ko===kb) return;
  if(state.ppc[ko]){ const l=state.ppc[kb]||[]; state.ppc[kb]=l.concat(state.ppc[ko].filter(x=>!l.some(y=>y.date===x.date))); delete state.ppc[ko]; }
  if(state.oam&&state.oam[ko]){ const b=state.oam[kb]||{}; state.oam[kb]={...state.oam[ko], ...Object.fromEntries(Object.entries(b).filter(([,v])=>v))}; delete state.oam[ko]; }
  if(state.rdv&&state.rdv[ko]){ const o=state.rdv[ko], b=rdvInfo(kb); for(const f of ['finPrescr','nir','tel','ddn']) if(!b[f] && o[f]) b[f]=o[f]; noterRdv(kb,'annonce',o.annonce); noterRdv(kb,'suivi',o.suivi4); noterRdv(kb,'suivi',o.suiviAn); delete state.rdv[ko]; }
}
// Ressemblance de deux écritures (1 = identiques), d'après le nombre de lettres à changer
function ressemblance(a,b){
  a=norm(a).replace(/[^a-z]/g,''); b=norm(b).replace(/[^a-z]/g,'');
  if(!a||!b) return 0; if(a===b) return 1;
  let prec=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ const cur=[i]; for(let j=1;j<=b.length;j++) cur[j]=Math.min(prec[j]+1, cur[j-1]+1, prec[j-1]+(a[i-1]===b[j-1]?0:1)); prec=cur; }
  return 1-prec[b.length]/Math.max(a.length,b.length);
}
// Patients différents dont le nom de famille ou le prénom est identique (ou presque) : faute de frappe possible
let viewDbl={tousPrenoms:false};
function nomsProches(){
  const pats=new Map();
  for(const c of state.consults){ if(!c.nom) continue; const k=motsTries(c.nom+' '+c.prenom); if(!pats.has(k)) pats.set(k,{k, nom:c.nom, prenom:c.prenom||'', rows:[]}); pats.get(k).rows.push(c); }
  const L=[...pats.values()], res=[];
  for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++){
    const a=L[i], b=L[j], cle='proche:'+[a.k,b.k].sort().join('#');
    if((state.distincts||[]).includes(cle)) continue;
    const memeNom=norm(a.nom)===norm(b.nom), memePrenom=!!a.prenom && norm(a.prenom)===norm(b.prenom);
    const sNom=ressemblance(a.nom,b.nom), sPrenom=ressemblance(a.prenom,b.prenom);
    let raison='', score=0;
    if(memeNom){ raison=sPrenom>=0.6?'même nom, prénom presque identique':'même nom de famille'; score=1+sPrenom; }
    else if(memePrenom && (sNom>=0.6 || viewDbl.tousPrenoms)){ raison=sNom>=0.6?'même prénom, nom presque identique':'même prénom'; score=1+sNom; }
    else if(sNom>=0.75 && sPrenom>=0.75){ raison='nom et prénom presque identiques'; score=sNom+sPrenom; }
    if(raison) res.push({a, b, cle, raison, score});
  }
  return res.sort((x,y)=>y.score-x.score);
}
// « Même patient » : les lignes de l'un prennent l'écriture de l'autre
function renommerPatient(de, vers){
  const ko=patientKey(de.rows[0]);
  de.rows.forEach(c=>{ c.nom=vers.nom; c.prenom=vers.prenom; });
  deplacerCles(ko, patientKey(vers.rows[0]));
}
function renderDoublons(){
  const app=document.getElementById('app'), G=groupesDoublons(), prob=G.filter(g=>g.probable), autres=G.filter(g=>!g.probable), P=nomsProches();
  const lab=v=>(STATUTS.find(s=>s.v===(v||'rien'))||{}).label;
  // Met en évidence les lettres qui diffèrent entre les deux écritures
