  const lignesPat=(p,autre,lettre)=>p.rows.map((c,i)=>`<tr>${i===0?`<td rowspan="${p.rows.length}" class="pp-lettre">${lettre}</td>`:''}
      <td><b>${ecriture(c.nom,autre.nom)}</b></td><td>${ecriture(c.prenom,autre.prenom)}</td><td>${fmtDate(c.date)||'—'}</td><td>${esc(c.iah)||'—'}</td><td>${lab(c.statut)}</td>
      <td>${esc(c.traitement)||'—'}</td><td>${c.traitement==='PPC'?chipPresta(c.prestataire):'—'}</td><td>${esc(c.commentaire||'')}</td></tr>`).join('');
  const blocProche=p=>`<div class="card card-proche" data-proche="${esc(p.cle)}">
    <div class="toolbar" style="margin:0 0 6px"><span class="badge" style="background:var(--alerte-soft);color:var(--alerte-ink)">${esc(p.raison)}</span><b>Est-ce le même patient ?</b></div>
    <table><thead><tr><th></th><th>Nom</th><th>Prénom</th><th>Date</th><th>IAH</th><th>Statut</th><th>Traitement</th><th>Prestataire</th><th>Commentaire</th></tr></thead>
      <tbody>${lignesPat(p.a,p.b,'A')}${lignesPat(p.b,p.a,'B')}</tbody></table>
    <div class="toolbar" style="margin:6px 0 0">
      <button class="primary small" data-garder="a">Oui, même patient : garder « ${esc(p.a.nom)} ${esc(p.a.prenom)} »</button>
      <button class="primary small" data-garder="b">Oui, même patient : garder « ${esc(p.b.nom)} ${esc(p.b.prenom)} »</button>
      <button class="small" data-act="diff">Non, ce sont deux patients différents</button></div></div>`;
  const bloc=g=>`<div class="card" data-cle="${g.cle}">
    <table><thead><tr><th>Garder</th><th>Date</th><th>Nom</th><th>Prénom</th><th>IAH</th><th>Contact</th><th>Statut</th><th>Traitement</th><th>Prestataire</th><th>Commentaire</th><th>Infos</th></tr></thead>
    <tbody>${g.rows.map((c,i)=>`<tr><td><input type="radio" name="b-${g.cle}" value="${c.id}" ${i===0?'checked':''} title="Ligne gardée comme base"></td>
      <td>${fmtDate(c.date)||'—'}</td><td><b>${esc(c.nom)}</b></td><td>${esc(c.prenom)}</td><td>${esc(c.iah)||'—'}</td><td>${c.info?`<span class="ct on" title="${esc(c.info)}">${ICONES_CONTACT[c.info]||esc(c.info)}</span>`:'—'}</td><td>${lab(c.statut)}</td>
      <td>${esc(c.traitement)||'—'}</td><td>${c.traitement==='PPC'?chipPresta(c.prestataire):'—'}</td><td>${esc(c.commentaire||'')}</td><td>${nbInfos(c)}${i===0?' <span class="badge sev-n">la plus complète</span>':''}</td></tr>`).join('')}</tbody></table>
    <div class="toolbar" style="margin:6px 0 0"><button class="primary small" data-act="fus">Fusionner</button><button class="small" data-act="dist">Ce ne sont pas des doublons</button></div></div>`;
  app.innerHTML=`<p><a href="#consultations">← Consultations</a></p>
    <div class="toolbar"><h2 style="margin:0">Doublons</h2><span class="hint">${prob.length} doublon(s) probable(s) · <a href="#doublons" id="aller-proches">${P.length} nom(s) proche(s) à vérifier ↓</a></span>${prob.length?`<div class="spacer"></div><button class="primary" id="fus-tout">Fusionner les ${prob.length} doublons probables</button>`:''}</div>
    <p class="hint">À la fusion, la ligne cochée (par défaut la plus complète) est gardée : ses cases vides sont complétées par celles des autres lignes, le statut le plus avancé est retenu, les commentaires sont réunis, puis les autres lignes sont supprimées. Les suivis PPC et OAM sont regroupés.</p>
    <h3>Doublons probables (${prob.length})</h3><p class="hint">Même patient avec la même date, une date manquante ou le même IAH.</p>
    ${prob.map(bloc).join('')||'<p class="muted">Aucun doublon probable.</p>'}
    <h3 id="proches">Noms proches : même patient mal orthographié ? (${P.length})</h3>
    <p class="hint">Patients écrits différemment mais qui ont <b>le même nom de famille</b>, ou <b>le même prénom avec un nom presque identique</b> (faute de frappe, lettre en trop ou en moins…).
      Dites s'il s'agit du même patient : ses lignes prennent alors l'écriture que vous choisissez (suivis PPC, OAM et rendez-vous compris) ; s'il s'agit de la même consultation, elle apparaîtra ensuite dans « Doublons probables » pour être fusionnée.</p>

  app.querySelector('#aller-proches').onclick=e=>{ e.preventDefault(); document.getElementById('proches').scrollIntoView({behavior:'smooth'}); };

  const parProche=Object.fromEntries(P.map(p=>[p.cle,p]));
  app.querySelectorAll('[data-proche]').forEach(card=>{

    });
    card.querySelector('[data-act=diff]').onclick=()=>{ state.distincts=(state.distincts||[]).concat(p.cle); save(); renderDoublons(); };

  const parCle=Object.fromEntries(G.map(g=>[g.cle,g]));
  app.querySelectorAll('[data-cle]').forEach(card=>{

  });
  const ft=document.getElementById('fus-tout');
  if(ft) ft.onclick=()=>{
    if(!confirm(`Fusionner les ${prob.length} groupes de doublons probables, en gardant à chaque fois la ligne cochée (la plus complète par défaut) ?`)) return;

}

/* ============ Oxymétrie / capnographie : analyse des rapports ============ */
// Formats reconnus : SenTec V-STATS (capnographie), oxymétrie nocturne (Nonin…), compte-rendu Bastide « OXYCAPNO » (formulaire PDF)
const MOIS_EN_FR={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,
  janvier:1,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,aout:8,septembre:9,octobre:10,novembre:11,decembre:12};
function parseOxyCapno(text){
  const orig=text.normalize('NFC'), n=normText(orig);
  const r={...nomPatient(orig)};
  r.type=/oxy\s*-?\s*capno/.test(n)?'Oxycapnographie':/capnograph|ptc\s*co\s*2|\bpco\s*2/.test(n)?'Capnographie':/oxym[e]trie|spo\s*2/.test(n)?'Oxymétrie':'';
  const UNITE='\\s*(mmhg|kpa)';
  const kpa=(m)=>m?(m[2]==='kpa'?String(Math.round(num(m[1])*7.50062*10)/10):m[1].replace(',','.')):null;
  // PtcCO2 (capnographie SenTec : section « PCO2 » puis « Médiane » / « Maximum »)
  r.ptco2Med=kpa(n.match(new RegExp(/p(?:tc)?\s*c?o\s*2[\s\S]{0,300}?m[e]diane\s*:?\s*/.source+RX_NUM+UNITE)));
  r.ptco2Max=kpa(n.match(new RegExp(/p(?:tc)?\s*c?o\s*2[\s\S]{0,300}?maxim(?:um|ale)\s*(?:\(temps\))?\s*:?\s*/.source+RX_NUM+UNITE)));
  // SpO2 médiane (section « SpO2 »)
  r.spo2Med=grab(n,[/spo\s*2[\s\S]{0,250}?m[e]diane\s*:?\s*NUM\s*%/]);
  // Compte-rendu Bastide : tableau « Valeur min. / médiane / max. » (colonnes PCO2 puis SpO2)
  const vm=n.match(rx(/valeur m[e]diane\s*NUM\s+NUM/)), vx=n.match(rx(/valeur max\.?\s*NUM/));
  if(vm){ r.ptco2Med=r.ptco2Med||vm[1].replace(',','.'); r.spo2Med=r.spo2Med||vm[2].replace(',','.'); }
  if(vx) r.ptco2Max=r.ptco2Max||vx[1].replace(',','.');
  // Oxymétrie sans médiane : SpO2 moyenne
  if(!r.spo2Med){ const moy=grab(n,[/spo\s*2 moyen\.?\s*(?:sans evenem\.?)?\s*\(%\)\s*NUM/, /spo\s*2[^\n]{0,20}moyenne\s*:?\s*NUM\s*%/]); if(moy){ r.spo2Med=moy; r.spo2Moy=true; } }
  r.t90=grab(n,[/temps \(minutes\)\s*<\s*90\s*%\s*NUM/]);
  const th=n.match(/temps\s*>\s*50(?:[.,]0)?\s*mmhg\s*:?\s*(\d{1,2}:\d{2}(?::\d{2})?)/), tp=n.match(rx(/temps\s*>\s*50(?:[.,]0)?\s*mmhg\s*\[%\]\s*:?\s*NUM/));
  if(th) r.tHyper=th[1]+(tp?` (${tp[1].replace('.',',')} %)`:'');
  r.ido=grab(n,[/indice de desaturation en oxygene\s*NUM/, /desaturations\s+NUM/]);
  // Date de l'examen
  let d=n.match(rx(/debut mesure\s*:?\s*DATE/)) || n.match(rx(/date de l'?examen[^\d\n]{0,60}DATE/));
  if(d) r.date=toISO(d[1]);
  if(!r.date){ const m=n.match(/(\d{1,2})\s+(january|february|march|april|may|june|july|august|september|october|november|december|janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)\s+(\d{4})/);
    if(m) r.date=`${m[3]}-${String(MOIS_EN_FR[m[2]]).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  if(!r.date){ const ds=[...n.matchAll(/(?<!\d)\d{1,2}[\/.-]\d{1,2}[\/.-]\d{4}\b/g)].map(x=>toISO(x[0])).filter(Boolean).sort(); r.date=ds[ds.length-1]||''; }
  // Interprétation : champ de formulaire le plus long, sinon texte après « Interprétation / Conclusion / Commentaire »
  const fi=orig.indexOf('=== Champs du formulaire ===');
  if(fi>=0){ const l=orig.slice(fi).split('\n').slice(1).filter(s=>s.length>=40 && /\p{L}{3}/u.test(s)).sort((a,b)=>b.length-a.length)[0]; if(l) r.interpretation=l; }
  if(!r.interpretation){
    // (après « Commentaires : » on ne prend que la même ligne : une rubrique vide ne doit pas avaler la suite du rapport)
    const cm=n.match(/(?:interpretation|conclusion|commentaires?)(?: (?:de l'examen|du medecin|conseiller respiratoire))?[ \t]*:[ \t]*/);
    if(cm){
      const reste=orig.slice(cm.index+cm[0].length, cm.index+cm[0].length+800);
      let c=reste.split('\n')[0].trim() || (/^(interpretation|conclusion)/.test(cm[0]) ? reste.split(/\n\s*\n/)[0] : '');
      c=c.replace(/_{3,}/g,' ').replace(/\s+/g,' ').trim();
      if(c.length>=5 && !/^(taux de stockage|evenements)/i.test(normText(c))) r.interpretation=c;
    }
  }
  r.found=!!(r.ptco2Med||r.ptco2Max||r.spo2Med);
  return r;
}

/* ============ Vue 6 : patients compliqués ============ */
const TYPES_EXAMEN=['Oxymétrie','Capnographie','Oxycapnographie'];
let viewCx={sortKey:'nom', sortDir:1, presta:'', q:'', ouverts:{}, msgOuvert:true};

let cxImportMemo=null;
function cxImportMasque(){ if(cxImportMemo!=null) return cxImportMemo; try{ return localStorage.getItem('suiviSommeil_cxImportMasque')==='1'; }catch(e){ return false; } }
function ajouterComplexe(nom, prenom){
  state.complexes=state.complexes||{};
  const k=norm(nom)+'|'+norm(prenom);
  if(!state.complexes[k]) state.complexes[k]={key:k, nom:(nom||'').toUpperCase(), prenom:prenom||'', prestataire:'', probleme:'', examens:[], ajoute:today()};
  return state.complexes[k];
}
// Prestataire : celui choisi sur cette page, sinon celui du tableau des consultations
function prestaComplexe(p){ return p.prestataire || ([...state.consults].filter(c=>patientKey(c)===p.key).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).find(c=>c.prestataire)||{}).prestataire || ''; }
function cxPatients(){
  return Object.values(state.complexes||{}).map(p=>{ const ex=(p.examens||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')); return {p, presta:prestaComplexe(p), ex, der:ex[ex.length-1]||{}}; });
}
const clsPtco2=(v,max)=>{ const x=num(v); return x==null?'':x>(max?50:45)?'val-bad':x>(max?45:42)?'val-warn':'val-ok'; };
const clsSpo2=v=>{ const x=num(v); return x==null?'':x<90?'val-bad':x<94?'val-warn':'val-ok'; };
// Ajoute un examen ; les rapports de la même nuit (à un jour près) sont regroupés dans un seul examen
function fusionnerExamen(p, r, source){
  p.examens=p.examens||[];
  const proche=r.date && p.examens.find(e=>e.date && Math.abs(new Date(e.date)-new Date(r.date))<=1.5*864e5);
  const champs=['ptco2Med','ptco2Max','tHyper','spo2Med','t90','ido'];
  if(proche){
    champs.forEach(f=>{ if(r[f] && (!proche[f] || (f==='spo2Med' && proche.spo2Moy && !r.spo2Moy))){ proche[f]=r[f]; if(f==='spo2Med') proche.spo2Moy=!!r.spo2Moy; } });
    if(r.type && proche.type!==r.type) proche.type='Oxycapnographie';
    if(r.interpretation && !(proche.interpretation||'').includes(r.interpretation)) proche.interpretation=[proche.interpretation,r.interpretation].filter(Boolean).join('\n');
    proche.sources=[...new Set([...(proche.sources||[]),source])];
    return 'complété';
  }
  p.examens.push({id:uid(), date:r.date||today(), type:r.type||'Oxymétrie', ...Object.fromEntries(champs.map(f=>[f,r[f]||''])), spo2Moy:!!r.spo2Moy, interpretation:r.interpretation||'', sources:[source]});
  return 'ajouté';
}
async function cxImporter(p, files, info){
  const msgs=[];
  for(const f of [...files].filter(f=>isPdf(f)||isImage(f))){
    const nomF=f.name||'capture';
    try{
      const text=await fileToText(f,(l,x)=>info(`${nomF} — ${l}`));
      const r=parseOxyCapno(text);
      if(!r.found){
        if(classify(text)==='obs'){ const m=applyObs(parseObservance(text), nomF); msgs.push('📈 '+m+(m.startsWith('✅')?' <span class="muted">(rapport PPC ajouté au suivi PPC)</span>':'')); continue; }
        msgs.push(`⚠️ ${esc(nomF)} : aucune valeur d'oxymétrie / capnographie reconnue.`); continue;
      }
      const alerteNom=r.nom && !samePatient(r,p) ? ` <b style="color:var(--bad)">⚠️ ce rapport semble concerner ${esc(r.nom)} ${esc(r.prenom)}</b>` : '';
      const etat=fusionnerExamen(p, r, nomF);
      msgs.push(`✅ ${esc(nomF)} : ${esc(r.type)} du ${fmtDate(r.date)||'?'} — PtcCO₂ méd. ${esc(r.ptco2Med||'—')}, max ${esc(r.ptco2Max||'—')}${r.tHyper?`, &gt; 50 mmHg pendant ${esc(r.tHyper)}`:''} ; SpO₂ ${r.spo2Moy?'moy.':'méd.'} ${esc(r.spo2Med||'—')}${r.interpretation?' ; interprétation trouvée':''} (examen ${etat})${alerteNom}`);
    }catch(e){ console.error(e); msgs.push(`❌ ${esc(nomF)} : erreur de lecture (${esc(e.message||e)}).`); }
  }
  save(); return msgs;
}

// Cadre « Ajouter des comptes-rendus » (et dépôt n'importe où sur la page) :
// rangés d'après le nom lu dans le rapport, ou dans le patient choisi dans la liste
async function cxImportGlobal(files, cibleKey){
  files=[...files].filter(f=>isPdf(f)||isImage(f)); if(!files.length) return;
  const lignes=[], cible=cibleKey && (state.complexes||{})[cibleKey];
  const info=t=>{ const el=document.getElementById('cx-glob-msg'); if(el) el.textContent=t; };
  for(const [i,f] of files.entries()){
    const nomF=f.name||'capture d\'écran';
    try{
      info(`Lecture ${i+1}/${files.length} : ${nomF}…`);
      const text=await fileToText(f,(l)=>info(`${nomF} — ${l}`)), r=parseOxyCapno(text);
      if(!r.found){
        // rapport d'observance PPC -> suivi PPC du patient
        if(classify(text)==='obs'){ const o=parseObservance(text); if(cible && !o.nom){ o.nom=cible.nom; o.prenom=cible.prenom; }
          const m=applyObs(o, nomF); lignes.push('📈 '+m+(m.startsWith('✅')?' <span class="muted">(ajouté au suivi PPC)</span>':'')); continue; }
        lignes.push(`⚠️ ${esc(nomF)} : aucune valeur d'oxymétrie / capnographie reconnue.`); continue;
      }
      let p=cible;
      if(!p){
        if(!r.nom){ lignes.push(`⚠️ ${esc(nomF)} : nom du patient introuvable dans le rapport — choisissez le patient dans la liste « Patient » puis recommencez.`); continue; }
        p=Object.values(state.complexes||{}).find(p=>samePatient(r,p));
        const c=!p && state.consults.find(c=>samePatient(r,c));
        if(!p) p=ajouterComplexe(c?c.nom:r.nom, c?c.prenom:r.prenom);
      }
      const alerteNom=cible && r.nom && !samePatient(r,cible) ? ` <b style="color:var(--bad)">⚠️ le rapport indique ${esc(r.nom)} ${esc(r.prenom)}</b>` : '';
      const etat=fusionnerExamen(p, r, nomF); viewCx.ouverts[p.key]=true;
      lignes.push(`✅ ${esc(nomF)} → <b>${esc(p.nom)} ${esc(p.prenom)}</b> : ${esc(r.type)} du ${fmtDate(r.date)||'?'} — PtcCO₂ méd. ${esc(r.ptco2Med||'—')}, max ${esc(r.ptco2Max||'—')} ; SpO₂ ${r.spo2Moy?'moy.':'méd.'} ${esc(r.spo2Med||'—')} (examen ${etat})${alerteNom}`);
    }catch(e){ console.error(e); lignes.push(`❌ ${esc(nomF)} : erreur de lecture (${esc(e.message||e)}). Une connexion internet est nécessaire au premier usage.`); }
  }
  viewCx.msgGlobal=lignes.join('<br>'); viewCx.msgOuvert=true; save(); renderComplexes();
  if(cxImportMasque()) toast(`${lignes.length} élément(s) traité(s) — détail : bouton « 📥 Comptes-rendus »`);
}

/* ============ E-mails : lecture d'un fichier .eml (corps + pièces jointes) ou d'un texte collé ============ */
const octetsVersTexte = u8 => { let s=''; for(let i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return s; };
const texteVersOctets = s => { const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&255; return u; };
const deBase64 = s => texteVersOctets(atob(s.replace(/[^A-Za-z0-9+/=]/g,'')));
const deQP = (s,entete) => texteVersOctets((entete?s.replace(/_/g,' '):s).replace(/=\r?\n/g,'').replace(/=([0-9A-Fa-f]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16))));
const decoderCharset = (u8,cs) => { try{ return new TextDecoder((cs||'utf-8').trim()).decode(u8); }catch(e){ return new TextDecoder('utf-8').decode(u8); } };
// En-têtes encodés : « =?UTF-8?B?…?= » / « =?iso-8859-1?Q?…?= »
const decoderEntete = s => (s||'').replace(/(\?=)\s+(=\?)/g,'$1$2').replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g,(m,cs,e,t)=>decoderCharset(e.toUpperCase()==='B'?deBase64(t):deQP(t,true),cs));
function parserMime(brut){
  const i=brut.search(/\r?\n\r?\n/);
  const entete=i<0?brut:brut.slice(0,i), corps=i<0?'':brut.slice(i).replace(/^\r?\n\r?\n/,'');
  const h={}; entete.replace(/\r?\n[ \t]+/g,' ').split(/\r?\n/).forEach(l=>{ const m=l.match(/^([\w-]+):\s*(.*)$/); if(m) h[m[1].toLowerCase()]=m[2]; });
  const ct=h['content-type']||'text/plain', bd=ct.match(/boundary="?([^";]+)"?/i);
  if(/^multipart\//i.test(ct) && bd) return {h, parts:corps.split('--'+bd[1]).slice(1).filter(p=>!/^--/.test(p)).map(p=>parserMime(p.replace(/^\r?\n/,'')))};
  return {h, corps};
}
function lireEml(brut){
  const racine=parserMime(brut), textes=[], htmls=[], pj=[];
  const parcourir=n=>{
    if(n.parts) return n.parts.forEach(parcourir);
    const ct=(n.h['content-type']||'text/plain').toLowerCase(), enc=(n.h['content-transfer-encoding']||'').toLowerCase(), disp=n.h['content-disposition']||'';
    const octets = enc.includes('base64') ? deBase64(n.corps) : enc.includes('quoted') ? deQP(n.corps) : texteVersOctets(n.corps);
    if(ct.startsWith('message/rfc822')) return parcourir(parserMime(octetsVersTexte(octets)));
    let nom=(disp.match(/filename\*=(?:[\w-]+'[^']*')?([^;]+)/i)||[])[1]; if(nom) nom=decodeURIComponent(nom.replace(/"/g,''));
    nom=nom || decoderEntete(((disp+';'+ct).match(/(?:file)?name="?([^";]+)"?/i)||[])[1]||'');
    const cs=(ct.match(/charset="?([^";]+)"?/i)||[])[1];
    if(!/attachment/i.test(disp) && !nom && ct.startsWith('text/plain')) textes.push(decoderCharset(octets,cs));
    else if(!/attachment/i.test(disp) && !nom && ct.startsWith('text/html')) htmls.push(decoderCharset(octets,cs));
    else if(nom || /^(application\/pdf|image\/)/.test(ct)) pj.push(new File([octets], nom||('piece-jointe.'+(ct.split('/')[1]||'bin').split(';')[0]), {type:ct.split(';')[0].trim()}));
  };
  parcourir(racine);
  const htmlEnTexte = html => new DOMParser().parseFromString(html.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|tr|h\d|li|table)>/gi,'\n').replace(/<\/t[dh]>/gi,'\t'),'text/html').documentElement.textContent.replace(/\n{3,}/g,'\n\n');
  return {objet:decoderEntete(racine.h.subject), de:decoderEntete(racine.h.from), date:racine.h.date||'', corps:(textes.join('\n\n')||htmls.map(htmlEnTexte).join('\n\n')).trim(), pj};
}

// Range un document (texte déjà extrait) au bon endroit ; « cible » = patient choisi si le nom n'est pas trouvé
function rangerDocument(text, nom, ctx){
  const cible=ctx.cible;
  const type=classify(text);
  if(type==='poly'){ const r=parsePolygraphie(text); if(!r.nom&&cible) Object.assign(r,cible); return applyPoly(r, nom); }
  if(type==='ppcliste') return applyListePPC(parseListePPC(text), nom).join('<br>');
  if(type==='consultliste'){ const rows=lignesVersConsultations(text, imp.annee); ctx.consult.push(...rows); return `📋 ${esc(nom)} : liste de ${rows.length} consultation(s) → à vérifier dans l'aperçu d'import.`; }
  const ox=parseOxyCapno(text);
  if(ox.found && (type==='oxycapno' || /capno|oxym|pco\s*2|ptc\s*co/.test(normText(text)))){
    if(!ox.nom && cible) Object.assign(ox,cible);
    if(!ox.nom) return `⚠️ ${esc(nom)} : examen d'oxymétrie / capnographie, mais nom du patient introuvable — choisissez le patient ci-dessus puis recommencez.`;
    let p=Object.values(state.complexes||{}).find(p=>samePatient(ox,p));
    const c=!p && state.consults.find(c=>samePatient(ox,c));
    if(!p) p=ajouterComplexe(c?c.nom:ox.nom, c?c.prenom:ox.prenom);
    const etat=fusionnerExamen(p, ox, nom);
    return `🫁 ${esc(nom)} → Patients compliqués, <b>${esc(p.nom)} ${esc(p.prenom)}</b> : ${esc(ox.type)} du ${fmtDate(ox.date)||'?'} — PtcCO₂ méd. ${esc(ox.ptco2Med||'—')}, max ${esc(ox.ptco2Max||'—')} ; SpO₂ ${esc(ox.spo2Med||'—')} (examen ${etat})`;
  }
  const r=parseObservance(text);
  if(['iahRes','obs','p95','fuites','fuitesP95'].some(k=>r[k])){ if(!r.nom && cible) Object.assign(r,cible); return applyObs(r, nom); }
  return `ℹ️ ${esc(nom)} : aucune donnée reconnue (ni polygraphie, ni rapport PPC, ni oxymétrie / capnographie, ni liste de consultations).`;
}

/* ============ Graphique simple ============ */
function chart(title, pts, o){
  pts=pts.filter(p=>p.y!=null&&p.d);
  if(pts.length<1) return `<div class="chart"><h4>${title}</h4><p class="muted">Pas de données</p></div>`;
  const W=320,H=150,L=34,R=10,T=10,B=24, fmt=o.fmt||(v=>Math.round(v*10)/10);
  const ys=pts.map(p=>p.y).concat(o.ref!=null?[o.ref]:[]);
  let y0=Math.min(0,...ys), y1=Math.max(...ys)*1.15||1;
  const ts=pts.map(p=>new Date(p.d).getTime()), t0=Math.min(...ts), t1=Math.max(...ts);
  const X=t=>L+(t1===t0?(W-L-R)/2:(t-t0)/(t1-t0)*(W-L-R)), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const path=pts.map((p,i)=>(i?'L':'M')+X(ts[i]).toFixed(1)+','+Y(p.y).toFixed(1)).join('');
  const ticks=[y0,(y0+y1)/2,y1];
  return `<div class="chart"><h4>${title}</h4><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L-4}" y="${Y(v)+4}" font-size="10" text-anchor="end" style="fill:var(--muted)">${fmt(v)}</text>`).join('')}
    ${o.ref!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" style="stroke:var(--warn)" stroke-dasharray="4 3"/><text x="${W-R}" y="${Y(o.ref)-3}" font-size="9" text-anchor="end" style="fill:var(--warn)">seuil ${o.refLabel}</text>`:''}
    <path d="${path}" fill="none" style="stroke:var(--accent)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${X(ts[i])}" cy="${Y(p.y)}" r="3.5" style="fill:var(--accent)"><title>${fmtDate(p.d)} : ${fmt(p.y)}</title></circle>`).join('')}
    <text x="${L}" y="${H-6}" font-size="10" style="fill:var(--muted)">${fmtDate(pts[0].d)}</text>
    <text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" style="fill:var(--muted)">${fmtDate(pts[pts.length-1].d)}</text>
  </svg></div>`;
}

/* ============ OCR (lecture des captures d'écran) ============ */
let ocrWorker=null, ocrProgress=()=>{};
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('chargement du module de lecture impossible')); document.head.appendChild(s); }); }
async function moduleOCR(progress){
  ocrProgress=progress;
  progress('Préparation du module de lecture…',0.05);
  if(!window.Tesseract) await loadScript(TESSERACT_URL);
  if(!ocrWorker){
    ocrWorker=await Tesseract.createWorker('fra',1,{logger:m=>{
      const labels={'recognizing text':'Lecture du texte…','loading language traineddata':'Chargement du dictionnaire français…','initializing api':'Initialisation…'};
      ocrProgress(labels[m.status]||m.status, m.progress||0);
    }});
  }
  return ocrWorker;
}
// Second lecteur réservé aux nombres (une ligne, chiffres et virgule seulement) : relit les IAH dont la virgule a été perdue
let ocrChiffresW=null;
async function ocrChiffres(){
  if(!ocrChiffresW){ await moduleOCR(()=>{}); ocrChiffresW=await Tesseract.createWorker('eng');
    await ocrChiffresW.setParameters({tessedit_char_whitelist:'0123456789,./', tessedit_pageseg_mode:'7'}); }
  return ocrChiffresW;
}
async function relireNombre(bmp, m){
  const w=await ocrChiffres(), pad=Math.max(3,m.h*0.4), k=5;
  const x0=Math.max(0,m.x-pad), y0=Math.max(0,m.y-pad), cw=Math.min(bmp.width-x0,m.w+2*pad), ch=Math.min(bmp.height-y0,m.h+2*pad);
  const c=document.createElement('canvas'); c.width=Math.round(cw*k); c.height=Math.round(ch*k);
  const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(bmp,x0,y0,cw,ch,0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height), d=im.data;
  for(let i=0;i<d.length;i+=4){ const v=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; d[i]=d[i+1]=d[i+2]=v; }
  g.putImageData(im,0,0);
  const {data}=await w.recognize(c);
  return (data.text||'').replace(/\s/g,'');
}
// Couleur de fond dominante d'une zone : rouge vif = Bastide, vert foncé = Helli Santé (colonne F du tableau)
function prestaCouleur(img, x0, y0, x1, y1){
  const W=img.width, H=img.height, d=img.data; let n=0, rouge=0, vert=0, bleu=0;
  x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0)); x1=Math.min(W-1,Math.ceil(x1)); y1=Math.min(H-1,Math.ceil(y1));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const i=(y*W+x)*4, r=d[i], g=d[i+1], b=d[i+2]; n++;
    if(r>170 && g<90 && b<90) rouge++;
    else if(g>70 && g<190 && r<110 && b<130 && g-r>35 && g-b>25) vert++;
    else if(b>170 && r<90 && g<120) bleu++; }
  if(!n) return '';
  const max=Math.max(rouge,vert,bleu);
  if(max/n<0.15) return '';
  return max===rouge ? 'Bastide' : max===vert ? 'Helli Santé' : 'Ax Air';
}
// Pastille de la colonne « Etat » (Google Sheets) : verte = Ok, saumon = CR fait
function statutPastille(img, x0, y0, x1, y1){
  const W=img.width, H=img.height, d=img.data; let vert=0, saumon=0, n=0;
  x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0)); x1=Math.min(W-1,Math.ceil(x1)); y1=Math.min(H-1,Math.ceil(y1));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const i=(y*W+x)*4, r=d[i], g=d[i+1], b=d[i+2]; n++;
    if(g>185 && g>r+10 && g>b+10 && r>140) vert++; else if(r>225 && r-g>25 && r-b>30 && g>140) saumon++; }
  if(!n) return null;
  return saumon/n>0.12 && saumon>vert ? 'CR fait' : vert/n>0.12 ? 'Ok' : null;
}
// Lignes surlignées d'une couleur franche (rouge, vert, bleu) avec texte blanc : chaque bande colorée est relue à part, inversée
async function lignesColorees(blob, det){
  const {img}=det, W=img.width, H=img.height, d=img.data;
  const fort=(x,y)=>{ const i=(y*W+x)*4, r=d[i], g=d[i+1], b=d[i+2];
    return (r>190 && g<90 && b<90) || (g>120 && r<110 && b<130 && g-r>50 && g-b>30) || (b>170 && r<90 && g<120); };
  // plus longue suite de pixels colorés sur la ligne y
  const plage=y=>{ let best=[0,-1], s=-1, trous=0;
    for(let x=0;x<=W;x++){ const f=x<W&&fort(x,y);
      if(f){ if(s<0) s=x; trous=0; } else if(s>=0 && ++trous>6){ if(x-6-s>best[1]-best[0]) best=[s,x-7]; s=-1; trous=0; } }
    return best; };
  const bandes=[]; let cur=null;
  for(let y=0;y<H;y++){ const [a,b]=plage(y);
    // (deux lignes colorées voisines sont séparées par le trait de la grille : on ne fusionne que des pixels contigus)
    if(b-a>=140){ if(cur && y-cur.y1<=1){ cur.y1=y; cur.a=Math.min(cur.a,a); cur.b=Math.max(cur.b,b); } else bandes.push(cur={y0:y,y1:y,a,b}); } }
  const w=await moduleOCR(()=>{}), bmp=await createImageBitmap(blob), out=[];
  for(const bd of bandes.filter(b=>b.y1-b.y0>=8)){
    // binarisation : texte blanc -> noir, tout le reste (fond coloré) -> blanc ; agrandi ×4
    const k=4, cw=bd.b-bd.a+1, ch=bd.y1-bd.y0+3, c=document.createElement('canvas'); c.width=cw*k+40; c.height=ch*k+30;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.imageSmoothingQuality='high';
    g.drawImage(bmp,bd.a,bd.y0-1,cw,ch,20,15,cw*k,ch*k);
    const im=g.getImageData(0,0,c.width,c.height), p=im.data;
    for(let i=0;i<p.length;i+=4){ const q=i/4, X=q%c.width, Y=(q/c.width)|0, dedans=X>=20 && X<20+cw*k && Y>=15 && Y<15+ch*k;
      const mn=Math.min(p[i],p[i+1],p[i+2]), mx=Math.max(p[i],p[i+1],p[i+2]); const v=(dedans && mn>150 && mx-mn<70)?0:255; p[i]=p[i+1]=p[i+2]=v; }
    g.putImageData(im,0,0);
    const {data}=await w.recognize(c);
    // « MARTINEZMaxime » : nom et prénom collés -> séparés
    const texte=(data.text||'').split('\n').map(l=>l.replace(/([A-ZÀ-ÖØ-Þ]{2,})(?=[A-ZÀ-ÖØ-Þ][a-zß-öø-ÿ])/g,'$1 ').trim()).filter(Boolean).join('\n');
    if(texte) out.push({texte, y:(bd.y0+bd.y1)/2, x0:bd.a, x1:bd.b, y0:bd.y0, y1:bd.y1});
  }
  return out;
}
// Capture d'un tableau : on reprend chaque ligne lue pour relire l'IAH (virgule) et la case colorée du prestataire
async function complementsTableau(blob, det, rows, setP=()=>{}){
  const {mots,img}=det; if(!mots.length || !rows.length) return;
  const hs=mots.map(m=>m.h).sort((a,b)=>a-b), hm=hs[hs.length>>1]||10;
  const bmp=await createImageBitmap(blob), pris=new Set(), cle=s=>norm(s).replace(/[^a-z]/g,'');
  // Largeur d'un chiffre, d'après les IAH lus avec leur virgule (« 1,8 », « 15,2 ») : la virgule vaut ~½ chiffre
  const med=a=>a.length?a.sort((x,y)=>x-y)[a.length>>1]:0;

    if(/^\d{2,3}$/.test(mi.s) && r.iah===mi.s && dW && mi.h<=hV*1.15 && mi.w-mi.s.length*dW>0.45*dW){

    }
    // 2) sinon relecture agrandie

      try{ const v=await relireNombre(bmp, mi); if(/^\d{1,2}[.,]\d{1,2}$/.test(v) && v.replace(/[.,]/,'')===mi.s){ r.iah=v.replace('.',','); r._virgule=true; } }catch(e){ console.error(e); }

      if(/^\d{3}$/.test(r.iah) && +r.iah>150){ r.iah=r.iah.slice(0,-1)+','+r.iah.slice(-1); r._virgule=true; }
    }
    // Prestataire : case colorée entre l'IAH et la colonne « Etat » (Ok / CR fait…) ; prime sur la lettre lue (B / H)
    {

  // on garde l'interprétation la plus proche des dates voisines.
  const jours=d=>d?Date.parse(d+'T12:00:00')/864e5:null;
  rows.forEach((r,i)=>{
    if(!r._dateLue) return;
    const voisins=[...rows.slice(Math.max(0,i-3),i), ...rows.slice(i+1,i+4)].filter(x=>x.date && !x._dateLue).map(x=>jours(x.date));
    const cands=new Set([r._dateLue]); const s=r._dateLue;
    for(let k=0;k<s.length;k++) if(s[k]==='1') cands.add(s.slice(0,k)+'/'+s.slice(k+1));
    const valides=[...cands].filter(c=>/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(c)).map(c=>toISO(c,imp.annee)).filter(Boolean);

    if(!voisins.length){ r.date=r.date||valides[0]; return; }
    const ref=voisins.sort((a,b)=>a-b)[voisins.length>>1];
    r.date=valides.sort((a,b)=>Math.abs(jours(a)-ref)-Math.abs(jours(b)-ref))[0];

  rows.forEach((r,i)=>{ if(!r.date && i>0 && rows[i-1].date && rows[i+1] && rows[i+1].date===rows[i-1].date) r.date=rows[i-1].date; });
}
async function ocr(blob, progress=()=>{}){

}

async function preprocessGris(blob, k){

async function ocrDetail(blob, progress=()=>{}, fonce=false, echelle=0){

  const {data}=await w.recognize(canvas,{},{text:true,tsv:true});

// Reconstitue les lignes d'après la position des mots (sinon les tableaux sont lus colonne par colonne).
// Deux mots éloignés sur une même ligne sont séparés par une tabulation.
function lignesDepuisTSV(tsv){
  if(!tsv) return '';
  const mots=[];
  for(const l of tsv.split('\n')){
    const c=l.split('\t');
    if(c.length<12 || c[0]!=='5' || !c[11].trim()) continue;
    mots.push({x:+c[6], y:+c[7], w:+c[8], h:+c[9], s:c[11].trim()});
  }
  if(!mots.length) return '';
  const hs=mots.map(m=>m.h).sort((a,b)=>a-b), hm=hs[hs.length>>1]||10;
  mots.sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2));
  const lignes=[];
  for(const m of mots){
    const cy=m.y+m.h/2, l=lignes[lignes.length-1];
    if(l && Math.abs(cy-l.cy)<hm*0.6){ l.mots.push(m); l.cy+=(cy-l.cy)/l.mots.length; }
    else lignes.push({cy, mots:[m]});
  }
  return lignes.map(l=>{
    l.mots.sort((a,b)=>a.x-b.x);
    return l.mots.map((m,i)=>(i?(m.x-(l.mots[i-1].x+l.mots[i-1].w)>hm*1.5?'\t':' '):'')+m.s).join('');
  }).join('\n');
}
// Agrandit, passe en niveaux de gris et neutralise les fonds colorés : dans une zone colorée
// (ligne surlignée en rouge/vert…), le fond devient blanc et le texte blanc devient noir.
async function preprocess(blob){
  const bmp=await createImageBitmap(blob);
  const k=bmp.width<1400?3:bmp.width<2000?2:1, W=bmp.width*k, H=bmp.height*k, c=document.createElement('canvas');
  c.width=W; c.height=H;
  const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(bmp,0,0,W,H);
  const im=g.getImageData(0,0,W,H), d=im.data, N=W*H, gray=new Float32Array(N), sat=new Uint8Array(N);
  const I=new Float64Array((W+1)*(H+1)); // image intégrale des pixels « colorés » (saturés)
  for(let y=0;y<H;y++){ let s=0;
    for(let x=0;x<W;x++){ const p=y*W+x, i=p*4, r=d[i], gg=d[i+1], b=d[i+2], mx=Math.max(r,gg,b), mn=Math.min(r,gg,b);
      gray[p]=0.299*r+0.587*gg+0.114*b;
      sat[p]=(mx>40 && (mx-mn)/mx>0.35)?1:0; s+=sat[p];
      I[(y+1)*(W+1)+x+1]=I[y*(W+1)+x+1]+s; } }
  const R=6*k;
  for(let y=0;y<H;y++){ const y0=Math.max(0,y-R), y1=Math.min(H,y+R+1);
    for(let x=0;x<W;x++){ const x0=Math.max(0,x-R), x1=Math.min(W,x+R+1);
      const f=(I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0])/((y1-y0)*(x1-x0));
      const p=y*W+x; let v=gray[p];
      if(f>0.6) v = sat[p] ? 255 : (v>150 ? 255-v : v);
      const i=p*4; d[i]=d[i+1]=d[i+2]=v; } }
  g.putImageData(im,0,0);
  return c;
}

/* ============ Capture d'agenda Doctolib ============ */
// Créneaux bleu foncé / violet -> consultation à ajouter (« Rien de fait »)
// Créneaux bleu clair -> résultats rendus : patient retrouvé (ou ajouté), « Terminé » + résultats communiqués par Doctolib
function hslDe([r,g,b]){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
  if(!d) return [0,0,l]; const s=d/(1-Math.abs(2*l-1)); let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; if(h<0) h+=360; return [h,s,l]; }
function couleurCreneau(rgb){
  if(!rgb) return null; const [h,s,l]=hslDe(rgb);
  if(h>=226 && h<=255 && s>0.35 && l>=0.5 && l<0.84) return 'violet';
  if(h>=205 && h<=232 && s>0.3 && l>=0.82 && l<0.95) return 'bleu';
  return null;
}
// Couleur de fond dominante d'une zone (on ignore le texte foncé et le blanc)
function couleurZone(img, x0,y0,x1,y1){
  const W=img.width, H=img.height, d=img.data, cpt=new Map();
  x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0)); x1=Math.min(W-1,Math.ceil(x1)); y1=Math.min(H-1,Math.ceil(y1));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const i=(y*W+x)*4, r=d[i], g=d[i+1], b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if(mx-mn<25 || mx<110) continue; const k=(r>>3)+'|'+(g>>3)+'|'+(b>>3); cpt.set(k,(cpt.get(k)||0)+1); }
  let best=null,n=0; for(const [k,v] of cpt) if(v>n){ n=v; best=k; }
  return best?best.split('|').map(v=>(+v<<3)+4):null;
}
const JOURS_ABR={dim:0,lun:1,mar:2,mer:3,jeu:4,ven:5,sam:6};
// « jeu. 1 » -> date la plus proche d'aujourd'hui qui tombe un jeudi 1er
function dateDuJour(jour, num){
  const auj=new Date(); let best=null;
  for(let m=-7;m<=4;m++){ const d=new Date(auj.getFullYear(), auj.getMonth()+m, num);
    if(d.getDate()!==num || d.getDay()!==jour) continue;
    if(!best || Math.abs(d-auj)<Math.abs(best-auj)) best=d; }
  return best?`${best.getFullYear()}-${String(best.getMonth()+1).padStart(2,'0')}-${String(best.getDate()).padStart(2,'0')}`:'';
}
const RX_AGENDA_NOM=/((?:[A-ZÀ-ÖØ-Þ][A-ZÀ-ÖØ-Þ'’-]+ )+)(?:\([^)]*\) )?([A-ZÀ-ÖØ-Þ][a-zß-öø-ÿ'’]+(?:[- ][A-ZÀ-ÖØ-Þ][a-zß-öø-ÿ'’]+){0,2})/u;
// « Consultation de suivi », « Cs suivi PPC »… (tolère les confusions de lecture i/l/1)
const RX_MOTIF_SUIVI=/\bsu[il1|!]v[il1|!]/i;
const MOTS_AGENDA_EXCLUS=new Set(['PAUSE','URGENCE','URGENC','DR','RDV','NR','ABSENT','ABSENCE','CONGES','CONGÉS','FERME','FERMÉ','MT','PJ','OK','VAD']);
function lireAgenda(det, entetesConnus){
  const {mots,img}=det; if(!mots.length) return {estAgenda:false, rows:[]};
  const hs=mots.map(m=>m.h).sort((a,b)=>a-b), hm=hs[hs.length>>1]||10;
  // lignes de mots (même hauteur), découpées en morceaux quand l'écart est grand (= colonnes de jours)
  const tri=[...mots].sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2)), lignes=[];
  for(const m of tri){ const cy=m.y+m.h/2, l=lignes[lignes.length-1]; if(l && Math.abs(cy-l.cy)<hm*0.6){ l.mots.push(m); l.cy+=(cy-l.cy)/l.mots.length; } else lignes.push({cy,mots:[m]}); }
  // en-têtes de colonnes : « lun. 28 », « mar. 29 », « jeu. 1 »
  const entetes=[];
  for(const l of lignes){ const ms=l.mots.sort((a,b)=>a.x-b.x);
    ms.forEach((m,i)=>{ const j=m.s.toLowerCase().replace(/[^a-zé]/g,''); const n=ms[i+1]&&ms[i+1].s.match(/^(\d{1,2})\b/);
      if(j in JOURS_ABR && n && ms[i+1].x-(m.x+m.w)<hm*2) entetes.push({x:m.x, y:m.y, date:dateDuJour(JOURS_ABR[j], +n[1])}); }); }
  entetes.sort((a,b)=>a.x-b.x);
  // 2e lecture : on garde les colonnes de la 1re si elle en avait trouvé au moins autant
  if(entetesConnus && entetesConnus.length>=entetes.length){ entetes.length=0; entetes.push(...entetesConnus); }
  // Jour illisible (« lun. ⑤ » : le numéro est dans une pastille) : colonnes régulièrement espacées -> on déduit les voisines
  if(entetes.length>=2 && !entetesConnus){
    const ec=entetes.slice(1).map((e,i)=>e.x-entetes[i].x).sort((a,b)=>a-b), pas=ec[ec.length>>1];
    const plusJours=(d,n)=>{ const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
    if(pas>hm*5){
      for(let e=entetes[0]; e.x-pas>hm*2; ){ e={x:e.x-pas, date:plusJours(e.date,-1), deduit:true}; entetes.unshift(e); }
      for(let i=1;i<entetes.length;i++) if(entetes[i].x-entetes[i-1].x>pas*1.5){ entetes.splice(i,0,{x:entetes[i-1].x+pas, date:plusJours(entetes[i-1].date,1), deduit:true}); }
    }
  }
  // ligne des jours : ce qui est au-dessus (nom du praticien, sélecteur d'agenda, barre d'outils) n'est jamais un patient
  const ysEnt=entetes.filter(e=>e.y!=null).map(e=>e.y), yJours=ysEnt.length?Math.min(...ysEnt):null;
  const cands=[], motifsSuivi=[]; let ignores=0, avecHeure=0;
  for(const l of lignes){
    const ms=l.mots.sort((a,b)=>a.x-b.x), segs=[];
    for(const m of ms){ const s=segs[segs.length-1]; if(s && m.x-(s[s.length-1].x+s[s.length-1].w)<hm*1.4) s.push(m); else segs.push([m]); }
    for(const s of segs){
      const txt=s.map(m=>m.s).join(' ').replace(/(\d)([A-Za-zÀ-ÿ])/g,'$1 $2');
      if(/^\d{1,2}[:h]\d{2}\b/.test(txt)) avecHeure++;
      const x0=Math.min(...s.map(w=>w.x)), x1=Math.max(...s.map(w=>w.x+w.w)), y0=Math.min(...s.map(w=>w.y)), y1=Math.max(...s.map(w=>w.y+w.h));
      const suivi=RX_MOTIF_SUIVI.test(txt);
      if(suivi) motifsSuivi.push({x0,y0});
      const m=txt.match(RX_AGENDA_NOM); if(!m) continue;
      const motsNom=m[1].trim().split(/\s+/).filter(w=>!MOTS_AGENDA_EXCLUS.has(w.replace(/[^A-ZÀ-Þ]/g,'')));
      if(!motsNom.length) continue;
      if(yJours!=null && y1<yJours+hm*0.5) continue; // en-tête de l'agenda
      if(estNonPatient(motsNom.join(' '), m[2])) continue; // praticien / secrétariat
      const coul=couleurCreneau(couleurZone(img, x0-4, y0-hm*0.3, x1+4, y1+hm*0.3));
      const col=entetes.filter(e=>e.x<=x0+hm*2).pop();
      cands.push({nom:motsNom.join(' ').replace(/’/g,"'"), prenom:capName(m[2]), date:col?col.date:'', coul, suivi, x0, y0, y1});
    }
  }
  // Motif « Consultation de suivi » écrit sous le nom (même créneau) : rattaché au nom le plus proche au-dessus, dans la même colonne
  for(const mo of motifsSuivi){
    const c=cands.filter(c=>Math.abs(c.x0-mo.x0)<hm*4 && mo.y0>=c.y0 && mo.y0-c.y1<hm*3.5).sort((a,b)=>b.y0-a.y0)[0];
    if(c) c.suivi=true;
  }
  const rows=[];
  for(const c of cands){
    const type=c.suivi?'suivi':c.coul;
    if(!type){ ignores++; continue; }
    if(rows.some(r=>r.nom===c.nom && r.prenom===c.prenom && r._agenda===type)) continue;
    rows.push({nom:c.nom, prenom:c.prenom, iah:'', date:c.date, traitement:'', prestataire:'', commentaire:'', _ocr:true, _agenda:type,
      statut:type==='violet'?'rien':'termine', info:type==='bleu'?'Doctolib':''});
  }
  return {estAgenda: entetes.length>0 || avecHeure>=4, rows, ignores, entetes,
    nViolet:rows.filter(r=>r._agenda==='violet').length, nBleu:rows.filter(r=>r._agenda==='bleu').length, nSuivi:rows.filter(r=>r._agenda==='suivi').length};
}

/* ============ Lecture des fichiers (PDF ou image) ============ */
const isPdf = f => !!f && (f.type==='application/pdf' || /\.pdf$/i.test(f.name||''));
const isImage = f => !!f && (f.type||'').startsWith('image/');
const isTexte = f => !!f && /\.(csv|tsv|txt)$/i.test(f.name||'');
async function loadPdfJs(){
  if(!window.pdfjsLib){
    await loadScript(PDFJS_URL);
    try{ const src=await (await fetch(PDFJS_WORKER_URL)).text(); pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([src],{type:'text/javascript'})); }
    catch(e){ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER_URL; }
  }
  return window.pdfjsLib;
}
// Texte d'un PDF reconstitué ligne par ligne (une tabulation sépare deux colonnes éloignées)
async function fileToText(file, progress=()=>{}){
  if(!isPdf(file)) return ocr(file, progress);

  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p), tc=await page.getTextContent(), lines=[];

                     /fuites?(?:(?!pression)[\s\S]){0,120}?median(?:e|\(e\))SEPNUM(?![\d.,]|\s*min)/, /(?:moyenne|mediane) des fuitesSEPNUM/, /\bfuites?(?:\s*non intentionnelles?)?SEPNUM(?![\d.,]|\s*min|\s*%)/]);
    r.fuitesP95=grab(n,[/fuites?(?:(?!pression)[\s\S]){0,120}?95\s*(?:e|eme|°|th)?\s*(?:centile|percentile|%)SEPNUM/, /fuites?[\s\S]{0,40}?p\s*95SEPNUM/]);
    if(!r.fuitesP95){

  // Commentaire / plaintes du patient (texte qui suit « Commentaire : », « Plaintes : »…)
  const cm=n.match(/(?:commentaires?|remarques?|observations?|plaintes?|doleances?|ressenti)[^\n:]{0,30}:\s*/);
  if(cm){
    const c=orig.slice(cm.index+cm[0].length, cm.index+cm[0].length+600).split(/\n\s*\n/)[0].replace(/\s*\n\s*/g,' ').trim();
    if(c && !/^aucune donnee/.test(normText(c))) r.com=c;
  }
  if(r.fuitesNote) r.com=(r.com?r.com+' — ':'')+r.fuitesNote;
  return r;
}

/* ============ Liste de patients d'un portail prestataire (capture d'écran) ============ */
// Chaque patient : NOM PRÉNOM, « Né(e) le … », observance « 5,358 h », fuites « 24,78 l/min », IAH « 1,63 nbr/h »
// La lecture d'image perd souvent la virgule : « 6797h » = 6,797 h, « 1161 l/min » = 11,61, « 145 nbr/h » = 1,45
const RX_NE=/\bn[ée]\s*\(e\)\W{0,4}(?:\w\W{1,3})?le\b|\bn[ée]e?\s+le\b/i; // tolère une lettre parasite : « Né(e) F le »

  const virgule=(s,dec)=>s.includes(',')||s.includes('.')?s.replace(',','.'):(s.slice(0,-dec)+'.'+s.slice(-dec));
  ancres.forEach(a=>{
    let nomL='';
    for(let j=a-1;j>=Math.max(0,a-4);j--){
      if(/N°\s*de\s*SS/i.test(lignes[j])) break;
      // (le nom peut être dans la 2e case si la 1re contient un caractère parasite : « = ⇥ ABDALLAH DJIHADI ZALIHATA »)
      const cell=lignes[j].split('\t').find(c=>/[A-ZÀ-ÖØ-Þ]{3,}/u.test(c))||'';

    let iahIni='';
    const fixIni=v=>{ v=v.replace(',','.'); if(!v.includes('.') && +v>150) v=v.slice(0,-1)+'.'+v.slice(-1); return +v>0?v:''; };
    if(obs){ const av=n.slice(0,obs.index).match(/(?<![\w.,])(\d{1,3}(?:[.,]\d)?)\s*\S{0,2}\s*$/); if(av) iahIni=fixIni(av[1]); }

    const nai=lignes[a].match(/le\s*(\d{2})\/(\d{2})\/(\d{4})/), ddn=nai?`${nai[3]}-${nai[2]}-${nai[1]}`:'';
    if(nomL && (obs||fu||ia)) out.push({...splitNomComplet(nomL), date:today(),
      obs:obs?fmtObs(num(virgule(obs[1],3))):'', fuites:fu?virgule(fu[1],2):'', iahRes:ia?virgule(ia[1],2):'', iahIni, ddn, nir:/^\d{13}(\d{2})?$/.test(nir)?nir:''});
  });
  return out;
}

/* ============ Liste de patients du portail Bastide (capture d'écran) ============ */

const uneDecimale = v => { v=(v||'').replace(',','.'); return !v.includes('.') && v.length>=2 ? v.slice(0,-1)+'.'+v.slice(-1) : v; };

// « DUPONT LAURENT  24.5  PPC  30/10/2026  04/11/2026  5h32  1.8  9.9  8.9  25/02/2027 » (nom et prénom tout en majuscules, « - » = pas de donnée)

  const m=l.match(/(?:^|[^A-Za-zÀ-ÿ])([A-ZÀ-ÖØ-Þ][A-ZÀ-ÖØ-Þ'’ -]*[A-ZÀ-ÖØ-Þ])\s+(?:(\d{2}[.,]?\d?)\s+)?(PPC|OAM|VNI)\b/u);

  const val=t=>t && !/^-/.test(t) ? uneDecimale(t) : '';

    obs:o?`${+o[1]}h${o[2]}`:'', iahRes:val(toks[0]), pression:val(toks[1]), fuites:val(toks[2]), iahIni:'', absent:false,
    installation:iso(install), derInter:der?iso(der):'', finPrescr:iso(fin)};

function parseListeBastide(text){
  const out=[];

    const m=l.match(/(?:^|[^A-Za-zÀ-ÿ])((?:[A-ZÀ-ÖØ-Þ]{2}[A-ZÀ-ÖØ-Þ'’-]* )+)([A-ZÀ-ÖØ-Þ][a-zß-öø-ÿ'’-]+(?: [A-ZÀ-ÖØ-Þ][a-zß-öø-ÿ'’-]+)*)/u);
    if(!m || m.index>8 || /^(PATIENT|DAP|PPC)\b/.test(m[1])) continue;

    if(!dates.length) continue;

    const ia=avant.match(/(abs\.?|-{1,2}|\d{1,3}(?:[.,]\d)?)\s*\(\s*(\d{1,3}(?:[.,\s]\d)?)(\s*\))?/i);

/* ============ Consultations : lignes de tableau (capture d'écran, PDF, texte collé) ============ */
const STOP_NOMS=new Set(['IAH','IA','IH','IAO','IAC','AO','AC','OK','PPC','OAM','CR','ID','SS','PM','DAP','IDO','RCS','LD','RV','RE','EPR','CPAP','RERA','PSG','MG','DR','TEL','NOX','AASM','RIP','RESULTATS','RAPPORT','CONCLUSION']);
const estMotNom = w => MOT_MAJ.test(w) && !STOP_NOMS.has(w);
const RX_MOIS_NOM=/^(janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[ûu]t|septembre|octobre|novembre|d[ée]cembre)$/i;
// Prénom (ou nom) écrit « Hélène », « Jean-Paul » : majuscule puis minuscules
const estMotPrenom = w => /^\p{Lu}[\p{Ll}'’]+(?:-\p{Lu}[\p{Ll}'’]+)*$/u.test(w) && !RX_MOIS_NOM.test(w);
const RX_STATUT=/(^|\s)(cr\s*fait|ok|0k|termin\w*|analys\w*|#)(?=\s|$)/i;
const RX_DATE_TOK=/^\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?$/;
function mapStatut(s, iah){
  if(!s) return iah?'cr':'rien';
  const n=normText(s);
  if(/cr/.test(n)) return 'cr';
  if(/^(ok|0k|termin)/.test(n)) return 'termine';
  if(/analys/.test(n)) return 'cr';
  return 'rien';
}
// Texte libre d'une ligne -> traitement, prestataire et commentaire
function analyseLibre(txt){
  let t=' '+(txt||'')+' ', traitement='', prestataire='';
  // Le mot-clé n'est retiré que s'il est seul dans sa case (« PPC relance ») et pas au milieu d'une phrase
  const retirer=(m)=>{
    const debut=t.lastIndexOf('·',m.index)+1, fin=t.indexOf('·',m.index)<0?t.length:t.indexOf('·',m.index);
    if(t.slice(debut,fin).trim().split(/\s+/).length>3) return;
    t=t.slice(0,m.index)+' '.repeat(m[0].length)+t.slice(m.index+m[0].length);
  };
  // (Ronfless = dispositif positionnel)
  for(const [re,v] of [[/\bppc\b/,'PPC'],[/\boam\b|\borthese\b/,'OAM'],[/dispositif positionnel|\bpositionnel\b|\bronfless\b/,'Dispositif positionnel']]){
    const m=normText(t).match(re); if(m){ traitement=v; retirer(m); break; }
  }
  for(const [p,re] of Object.entries(PRESTA_MOTS)){ const m=normText(t).match(re); if(m){ prestataire=p; retirer(m); break; } }
  // Abréviations du tableau, seules dans leur case après « PPC » : B = Bastide, H = Helli Santé, AX = Ax Air
  if(!prestataire && traitement==='PPC'){
    const m=normText(t).match(/(?<=^|\s|·)(b|h|ax)(?=\s|·|$)/);
    if(m){ prestataire={b:'Bastide', h:'Helli Santé', ax:'Ax Air'}[m[1]]; t=t.slice(0,m.index)+' '.repeat(m[0].length)+t.slice(m.index+m[0].length); }
  }
  if(prestataire && !traitement) traitement='PPC'; // les prestataires listés fournissent la PPC
  return {traitement, prestataire, commentaire:t.replace(/\s+/g,' ').replace(/^[\s·,;-]+|[\s·,;-]+$/g,'').replace(/(\s*·\s*)+/g,' · ')};
}
function parseConsultLines(text, annee=new Date().getFullYear()){
  const out=[];
  for(let ligne of text.normalize('NFC').split('\n')){
    ligne=ligne.replace(/\s+/g,' ').trim();
    if(!ligne) continue;
    let reste=ligne, statut=null;
    const ms=ligne.match(RX_STATUT);
    // statut en début de ligne seulement si aucun nom ne le précède (« Cortaix Gilles 24,8 Ok » : le Ok est après le nom)
    const avantSt=ms?ligne.slice(0,ms.index):'';
    if(ms && !avantSt.split(' ').some(estMotNom) && !/\p{L}{3,}\s+\p{L}{3,}/u.test(avantSt)){ statut=ms[2]; reste=ligne.slice(ms.index+ms[0].length); }
    // (la lecture d'image confond souvent le J final avec « ) » : « BENHAI) » -> « BENHAIJ »)
    // (bord de case lu comme « [ » ou « | » collé au nom : « [CONSTANS-MARTIGNY »)
    const toks=reste.split(' ').map(w=>w.replace(/^[\[|(]+(?=\p{L})/u,'').replace(/^([A-ZÀ-ÖØ-Þ'-]{2,})\)$/u,'$1J').replace(/[,;:]+$/,'')).filter(Boolean);
    // Date en tête de ligne (tableau « Date · Nom · IAH… » : « 13/1/25 BRANDON Laurence 52,8 »)
    let dateTete='';
    if(toks.length>2 && RX_DATE_TOK.test(toks[0])){ dateTete=toISO(toks[0],annee)||''; toks.shift(); }
    // Nom en MAJUSCULES : le prénom peut être avant (« Stéphanie CHIRON », liste Noxturnal) ou après (« HUMBERT Marie », tableau)
    const i=toks.findIndex(estMotNom);
    let j, nom=[], pre=[];
    if(i>=0){
      let a=i; while(a>0 && pre.length<3 && estMotPrenom(toks[a-1])) pre.unshift(toks[--a]);
      j=i; while(j<toks.length && MOT_MAJ.test(toks[j])) nom.push(toks[j++]);
      if(!pre.length) while(j<toks.length && pre.length<3 && /^[\p{L}][\p{L}'-]+$/u.test(toks[j]) && !/^invalide$/i.test(toks[j]) && (/^\p{Lu}/u.test(toks[j]) || !pre.length)) pre.push(toks[j++]);
    } else {
      // Aucun mot en majuscules (« Hélène Tran 8,0 21/09/2026 ») : « Prénom Nom » juste avant l'IAH ou la date
      const k=toks.findIndex(w=>/^(\d{1,2}(?:[.,]\d{1,2})?|invalide)$/i.test(w)||RX_DATE_TOK.test(w)); if(k<2) continue;
      let a=k; const mots=[]; while(a>0 && mots.length<4 && estMotPrenom(toks[a-1])) mots.unshift(toks[--a]);
      if(mots.length<2) continue;
      // tableau qui commence par la date : ordre « Nom Prénom » ; sinon (liste Noxturnal) « Prénom Nom »
      if(dateTete){ nom=[mots.shift().toUpperCase()]; pre=mots; } else { nom=[mots.pop().toUpperCase()]; pre=mots; }
      j=k;
    }
    let iah='';
    // (« 168 » : virgule perdue à la lecture d'une capture, corrigée ensuite)
    if(j<toks.length && /^(\d{1,3}|\d{1,2}[.,]\d{1,2}|invalide)$/i.test(toks[j])) iah=toks[j++].toLowerCase();
    const libre=[]; let date=dateTete;
    for(;j<toks.length;j++){ if(!date && RX_DATE_TOK.test(toks[j])){ date=toISO(toks[j],annee)||''; break; } libre.push(toks[j]); }
    // Colonnes « Etat » et « Message » après le nom : 1er « Ok / CR fait / # » = statut ; « Doctolib » = contact ; les autres « Ok », « - » sont ignorés
    let info='';
    for(let x=0;x<libre.length;x++){
      const w=libre[x], w2=(w+' '+(libre[x+1]||'')).toLowerCase();
      if(!statut && /^cr fait$/.test(w2)){ statut='CR fait'; libre.splice(x,2); x--; continue; }
      if(!statut && /^(ok|0k|#|termin\w*)$/i.test(w)){ statut=w; libre.splice(x--,1); continue; }
      if(/^doctolib$/i.test(w)){ info='Doctolib'; libre.splice(x--,1); continue; }
      if(/^(ok|0k|-|–|—)$/i.test(w)){ libre.splice(x--,1); }
    }
    if(!iah && !date && !statut) continue;
    const {nom:N, prenom:P}=pre.length?{nom:nom.join(' '),prenom:capName(pre.join(' '))}:splitNomComplet(nom.join(' '));
    const lib=analyseLibre(libre.join(' '));
    if(lib.traitement) lib.commentaire=lib.commentaire.replace(/^(ppc|oam|ronfless)\b\s*/i,''); // mot-clé déjà repris dans « Traitement »
    lib.commentaire=lib.commentaire.replace(/^[\]\[|(){}\s.,;:—–_-]+$/,'').replace(/^[^\p{L}]{1,3}$/u,''); // restes de bordures de cases
    lib.adresseur=''; { const x=extraireAdresseur(lib.commentaire); if(x.adresseur){ lib.adresseur=x.adresseur; lib.commentaire=x.reste; } } // colonne « Adressage »
    out.push({nom:N, prenom:P, iah, date, statut:mapStatut(statut,iah), _statut:!!statut, ...(info?{info}:{}), ...lib});
  }
  return out;
}

/* ============ Consultations : fichier CSV ou cellules copiées (Google Sheets / Excel) ============ */
function parseDelimited(txt){
  txt=txt.replace(/^﻿/,'');
  const debut=txt.split(/\r?\n/).slice(0,5).join('\n');
  const sep=debut.includes('\t')?'\t':((debut.match(/;/g)||[]).length>=(debut.match(/,/g)||[]).length?';':',');

    else if(ch==='"' && cell==='') q=true;
    else if(ch===sep){ row.push(cell); cell=''; }

// Reconnaît le rôle de chaque colonne d'après l'en-tête (s'il existe) et le contenu
function tableToRows(grid, annee){
  grid=grid.map(r=>r.map(c=>(c||'').replace(/\s+/g,' ').trim()));
  const ncol=Math.max(0,...grid.map(r=>r.length));
  let hi=-1;
  for(let i=0;i<Math.min(10,grid.length);i++){
    if(grid[i].filter(c=>/^(nom|prenom|iah|date|etat|statut|action|traitement|message|prestataire|adressage|commentaires?|mois|patient|remarques?)\b/.test(normText(c))).length>=2){ hi=i; break; }
  }
  const H=j=>hi>=0?normText(grid[hi][j]||''):'';
  const data=grid.slice(hi+1);
  const vals=j=>data.map(r=>r[j]||'').filter(Boolean);
  const test=(re,x)=>typeof re==='function'?re(x):re.test(x);
  const part=(j,re)=>{ const v=vals(j); return v.length?v.filter(x=>test(re,x)).length/v.length:0; };
  const role=Array(ncol).fill('libre');
  const libres=()=>[...Array(ncol).keys()].filter(j=>role[j]==='libre');
  const choisir=(nomRole,re,min,entete,parNombre)=>{
    let b=-1,bs=0;
    for(const j of libres()){ let s=parNombre?vals(j).filter(x=>test(re,x)).length:part(j,re); if(entete&&entete.test(H(j))) s=parNombre?s*2+1:s+0.5; if(s>bs && (parNombre?s>0:s>=min)){bs=s;b=j;} }
    if(b>=0) role[b]=nomRole; return b;
  };
  const RE_IGN=/^(.|\d{1,2}|[\d\s]+€|janvier|fevrier|février|mars|avril|mai|juin|juillet|aout|août|septembre|octobre|novembre|decembre|décembre)$/i;
  for(let j=0;j<ncol;j++){ if(/^mois/.test(H(j)) || (vals(j).length && part(j,RE_IGN)>=0.6)) role[j]='ignore'; else if(/^pre ?nom/.test(H(j))) role[j]='prenom'; }
  const jDate=choisir('date',RX_DATE_TOK,0.5,/date/);
  const jIah=choisir('iah',/^(\d{1,3}([.,]\d{1,2})?|invalide)$/i,0.5,/iah/);
  const jSt=choisir('statut',/^(cr\s*fait|ok|termin\w*|analys\w*|#|rien|a faire|non fait|fait)$/i,0.5,/etat|statut/);
  const jPre=role.indexOf('prenom');
  const jNom=choisir('nom',x=>/^[\p{L}' -]{3,}$/u.test(x)&&/[A-ZÀ-Þ]{2,}/.test(x),0,/^(nom|patient)/,true);
  if(jNom<0) return [];
  return data.map(r=>{
    let nom,prenom;
    if(jPre>=0){ nom=(r[jNom]||'').toUpperCase(); prenom=capName(r[jPre]||''); } else ({nom,prenom}=splitNomComplet(r[jNom]||''));
    if(!nom) return null;
    const iah=jIah>=0?(r[jIah]||'').toLowerCase():'';
    const st=jSt>=0?r[jSt]:'';
    // colonne « Adressage » : médecin adresseur (colonne dédiée du tableau) ; « - » = vide
    let adresseur='';
    const libre=libres().map(j=>{ const v=(r[j]||'').trim(); if(v && /adress/.test(H(j))){ if(!/^[-–—]$/.test(v)) adresseur=formaterAdresseur(v); return ''; } return v; }).filter(Boolean).join(' · ');
    const lib=analyseLibre(libre);
    if(!adresseur){ const x=extraireAdresseur(lib.commentaire); if(x.adresseur){ adresseur=x.adresseur; lib.commentaire=x.reste; } }
    return {nom, prenom, iah, date:jDate>=0?(toISO(r[jDate],annee)||''):'', statut:mapStatut(st,iah), ...lib, adresseur};
  }).filter(Boolean);
}
/* ============ Médecin adresseur ============ */
// « Dr. Thibault Stiernon » / « Dr CHENON Tiphaine » / « dr gallien » -> « Dr Thibault Stiernon », « Dr CHENON Tiphaine », « Dr Gallien »
function formaterAdresseur(v){
  v=(v||'').replace(/\s+/g,' ').trim(); if(!v) return '';
  const m=v.match(/^(?:dr\.?|docteur|pr\.?|professeur)\s*(.+)$/i);
  if(!m) return v;
  const titre=/^p/i.test(v)?'Pr':'Dr';
  // (sans dépendre d'autres fonctions : appelée aussi pendant le chargement des données)
  const maj=w=>w.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu,(x,a,b)=>a+b.toUpperCase());
  return titre+' '+m[1].split(' ').map(w=>/^[A-ZÀ-Þ'-]{2,}$/.test(w)?w:maj(w)).join(' ');
}
// Dans un texte libre (commentaire, ligne de tableau lue sur une capture) : « Dr Gallien », « Dr Metretin Pauline »
function extraireAdresseur(t){
  t=t||''; const m=t.match(/(?:^|[\s·,;])((?:Dr\.?|Docteur|Pr\.?)\s+[A-ZÀ-Þ][\p{L}'-]+(?:\s+[A-ZÀ-Þ][\p{L}'-]+){0,2})/u);
  if(!m) return {adresseur:'', reste:t};
  const reste=(t.slice(0,m.index)+' '+t.slice(m.index+m[0].length)).replace(/\s*·\s*(·\s*)+/g,' · ').replace(/^[\s·,;-]+|[\s·,;-]+$/g,'').replace(/\s+/g,' ');
  return {adresseur:formaterAdresseur(m[1]), reste};
}
// Capture Doctolib : fiche de rendez-vous (« Adressage  Dr. Thibault Stiernon, Médecin généraliste, Clermont-Ferrand »)
// ou infobulle de l'agenda (« RDV adressé par Dr. CHENON Tiphaine - Médecin généraliste »)
function lireAdressageDoctolib(texte){
  const t=texte.normalize('NFC'), nettoie=s=>s.replace(/[\[\]|{}©®«»]/g,' ').replace(/\s+/g,' ').trim(), estDr=s=>/^(dr\.?|docteur|pr\.?|professeur)\s/i.test(s);
  let brut=null;
  // fiche de rendez-vous : ligne « Adressage | Dr. Thibault Stiernon, Médecin généraliste, Clermont-Ferrand »
  const lAdr=t.split('\n').find(l=>/adressage/i.test(l));
  if(lAdr){ const apres=lAdr.slice(lAdr.search(/adressage/i)+9);
    const seg=apres.split('\t').map(s=>nettoie(s).replace(/^[^A-Za-zÀ-ÿ]+/,'')).find(estDr); if(seg) brut=seg; }
  // infobulle de l'agenda : « RDV adressé par Dr. CHENON / Tiphaine - Médecin généraliste » (sur deux lignes)
  if(!brut){ const i=t.search(/adress[ée]e?\s+par/i);
    if(i>=0){ const m=nettoie(t.slice(i).split('\n').slice(0,3).join(' ')).match(/adress[ée]e?\s+par\s+(.+)$/i); if(m && estDr(m[1])) brut=m[1]; } }
  if(!brut) return null;
  brut=brut.replace(/\s+(MT\b|Courrier|Documents|Dr\.? Antoine|\d{1,2}[:h]\d{2}).*$/i,'').replace(/\s+[a-z]$/,'');
  // spécialité sur la ligne suivante sans tiret (« Dr. LANZAS Marie / Pneumologue ») : on la sépare du nom
  brut=brut.replace(/(?<![-–,])\s+(?=(M[ée]decin|Pneumo|Cardio|Neuro|ORL|Oto|Psychiatre|Endocrino|Chirurgien|Dentiste|Orthodont|Stomato|P[ée]diatre|Rhumato|N[ée]phro|Gastro|Interne|G[ée]n[ée]raliste|Gyn[ée]co|Kin[ée]|Ophtalmo|Dermato|Urologue|Allergo|Diab[ée]to|Angio|Phl[ée]bo|Anesth|Ost[ée]opathe|Sage)[A-Za-zÀ-ÿ-]*\b)/,' - ');
  const [nomDr,...reste]=brut.split(/\s*,\s*|\s+[-–]\s+/);
  const r={adresseur:formaterAdresseur(nomDr), detail:reste.join(', ').replace(/\s+[a-z]$/,'').trim()};
  // date du rendez-vous : « mercredi 07 octobre 2026 » ou « 07/10/2026 »
  const d=normText(t).match(new RegExp(RX_DATEL)) ; if(d) r.date=`${d[3]}-${String(MOIS[d[2]]).padStart(2,'0')}-${d[1].padStart(2,'0')}`;
  else { // (on écarte une date de naissance : « née le 01/01/1980 »)
    const d2=[...t.matchAll(/\b(\d{2})\/(\d{2})\/(\d{4})\b/g)].find(x=>!/n[ée]e?\s*(\(e\))?\s*le\s*$/i.test(t.slice(Math.max(0,x.index-14),x.index)) && +x[3]>=2015);
    if(d2) r.date=`${d2[3]}-${d2[2]}-${d2[1]}`; }
  // patient : « NOM Prénom » en majuscules (hors médecins)
  for(const l of t.split('\n')){ if(/\b(dr\.?|docteur|pr\.?)\s/i.test(l)) continue;
    const p=l.match(/((?:[A-ZÀ-ÖØ-Þ][A-ZÀ-ÖØ-Þ'’-]+ )+)([A-ZÀ-ÖØ-Þ][a-zß-öø-ÿ'’-]+(?:[ -][A-ZÀ-ÖØ-Þ][a-zß-öø-ÿ'’-]+)?)/u);
    if(p && !/^(RDV|MT|PPC|OAM|COVID|PAUSE)\b/.test(p[1])){ r.nom=p[1].trim(); r.prenom=capName(p[2]); break; } }
  return r;
}

// Résultat collé dans Suivi sommeil -> lignes « médecin adresseur » (patients du tableau seulement : ceux suivis pour le sommeil)

const MOIS_COURT={janv:1,jan:1,fevr:2,fev:2,mars:3,mar:3,avr:4,mai:5,juin:6,juil:7,aout:8,sept:9,sep:9,oct:10,nov:11,dec:12};

// Nom du patient d'un rendez-vous lu dans l'agenda : bloc du rendez-vous, puis ses attributs, puis l'infobulle —
// en écartant toujours les lignes du médecin (« adressé par », « Dr », spécialité…) ; « NOM Prénom » ou « Prénom NOM »
function nomPatientLecture(it, adresseur){
  const MAJ="A-ZÀ-ÖØ-Þ", MIN="a-zß-öø-ÿ";
  const reNP=new RegExp(`((?:[${MAJ}][${MAJ}'’-]+ )+)([${MAJ}][${MIN}'’]+(?:[- ][${MAJ}][${MIN}'’]+)*)`,'u');
  const rePN=new RegExp(`(?:^|\\s)([${MAJ}][${MIN}'’]+(?:[- ][${MAJ}][${MIN}'’]+)*) ([${MAJ}][${MAJ}'’-]+(?: [${MAJ}][${MAJ}'’-]+)*)(?=[\\s,;.)]|$)`,'u');
  const exclus=/adress|\bdr\.?(\s|$)|docteur|\bpr\.\s|m[ée]decin|g[ée]n[ée]raliste|pneumo|cardio|neuro|ORL|courrier|document|t[ée]l[ée]phone|motif|rendez|^rdv|\bMT\b|PAUSE|URGENCE/i;
  const docMots=norm(adresseur||'').replace(/^(dr|pr)\s+/,'').split(' ').filter(w=>w.length>2);

  if(it.patient){ const l=it.patient.replace(/^\s*(M\.|Mme|Mlle|Monsieur|Madame)\s+/,'').replace(/[^\p{L}' -]/gu,' ').replace(/\s+/g,' ').trim();
    let m=l.match(reNP); if(m && !estNonPatient(m[1],m[2])) return {nom:m[1].trim(), prenom:capName(m[2])};
    if((m=l.match(rePN)) && !estNonPatient(m[2],m[1])) return {nom:m[2].trim(), prenom:capName(m[1])}; }
  const sources=[(it.carte||''), (it.visible||''), (it.attr||''), (it.bulle||'')];
  const rePrenomNom=new RegExp(`^([${MAJ}][${MIN}'’]+(?:-[${MAJ}][${MIN}'’]+)?) ([${MAJ}][${MIN}'’-]+(?: [${MAJ}][${MIN}'’-]+)?)$`,'u'); // « Laura Dupont »
  for(const [iSrc,src] of sources.entries()){
    for(let l of src.split('\n')){
      l=l.replace(/\b\d{1,2}[:h]\d{2}\b/g,' ').replace(/\b(M\.|Mme|Mlle|Monsieur|Madame)\s+/g,' ').replace(/[@•|]/g,' ')
        .replace(/(?:rdv\s+)?adress[ée]e?\s+par\s*/gi,' ').replace(/\b(?:dr\.?|docteur|pr\.)\s+[^,\n–-]+/gi,' ') // morceaux « médecin »
        .replace(/\b(?:MT|PJ|RDV|PAUSE|URGENCE)\b.*$/,' ').replace(/\s+/g,' ').trim();
      if(!l || exclus.test(l) && !reNP.test(l) && !rePN.test(l)) continue;
      let nom='', prenom='', m=l.match(reNP);
      if(m){ nom=m[1].trim(); prenom=m[2]; } else if((m=l.match(rePN))){ prenom=m[1]; nom=m[2].trim(); }
      else if(iSrc<3 && (m=l.match(rePrenomNom)) && !exclus.test(l)){ prenom=m[1]; nom=m[2].toUpperCase(); } // bloc du rendez-vous seulement
      if(!nom) continue;
      const mots=norm(nom+' '+prenom).split(' ');
      if(docMots.length && docMots.every(w=>mots.includes(w))) continue; // c'est le médecin, pas le patient
      if(/^(RDV|PPC|OAM|MT|PJ|OK)$/.test(nom)) continue;
      if(estNonPatient(nom, prenom)) continue; // praticien / secrétariat, jamais un patient
      return {nom, prenom:capName(prenom)};
    }
  }

}

// Liste Noxturnal : « Prénom NOM  IAH  date d'enregistrement  dernière mise à jour  État »
// (l'état peut être suivi des colonnes « Visualisé # » (un nombre) et « Balises »)
const RX_ETAT_NOX=/\b(termin[ée]e?|nouveau|invalide)[\s\d#|.,;:!-]*$/i;

const estListeNox = text => { const L=text.split('\n').filter(l=>RX_ETAT_NOX.test(l.trim()));
  return L.length>=3 || L.some(l=>/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\s+\d{1,2}[:h]\d{2}/.test(l)); };
function parseListeNox(text, annee){

    const m=ligne.trim().match(RX_ETAT_NOX); if(!m) continue;
    // « Prénom NOM  8,9  14/10/2026 23:00  Hier 20:56 » : la 1re date est celle de l'enregistrement (définitive) ;
    // l'heure et la « dernière mise à jour » qui suivent sont coupées pour ne pas être lues comme un nom ou une date
    const sans=ligne.trim().replace(RX_ETAT_NOX,'').replace(/(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4})\b.*$/,'$1');
    const r=parseConsultLines(sans, annee)[0]; if(!r) continue;
    const etat=/^termin/i.test(m[1])?'termine':/^nouveau/i.test(m[1])?'nouveau':'invalide';

// ou consultation datée à moins de 3 mois de l'enregistrement
function correspondanceNox(r){
  const rows=rowsOf(r); if(!rows.length) return null;
  const ecart=c=>c.date&&r.date?Math.abs(new Date(c.date)-new Date(r.date))/864e5:999;
  const score=c=>(num(c.iah)!=null && num(c.iah)===num(r.iahNox))?0:c.date===r.date?1:!c.iah?2:!c.date?3:ecart(c)<=90?4+ecart(c)/100:null;

async function impCharger(srcs){

  srcs=srcs.filter(s=>typeof s==='string'||isImage(s)||isPdf(s)||isTexte(s)||/^text\//.test(s.type||''));
  if(!srcs.length){ toast('Format non reconnu (CSV, texte, PDF ou image)'); return; }
  const an=document.getElementById('imp-annee'); if(an) imp.annee=+an.value||imp.annee;
  const ajouter=!!(imp.rows && imp.rows.length), tous=[], msgs=[], noms=[];
  for(const [i,src] of srcs.entries()){
    const nomF=(src&&src.name)||(typeof src==='string'?'cellules collées':'capture d\'écran');
    const y=nomF.match(/\b(20\d{2})\b/); if(y) imp.annee=+y[1];
    const setP=(label,p)=>{ const el=document.getElementById('imp-prog'), tx=document.getElementById('imp-txt');
      if(el){ el.style.display='block'; el.firstElementChild.style.width=Math.round(((i+(p||0))/srcs.length)*100)+'%'; }
      if(tx) tx.textContent=(srcs.length>1?`Fichier ${i+1}/${srcs.length} — `:'')+`${nomF} : ${label}`; };
    try{
      const {rows,msg}=await lireSourceImport(src,setP);
      rows.forEach(r=>r._src=nomF); tous.push(...rows); noms.push(nomF);
      msgs.push(`${srcs.length>1||ajouter?'• '+nomF+' : ':''}${msg||`${rows.length} ligne(s) reconnue(s)`}`);
    }catch(e){ console.error(e); msgs.push(`❌ ${nomF} : erreur de lecture (${e.message||e}). Une connexion internet est nécessaire au premier usage de la lecture d'images/PDF.`); }
  }
  impSetRows(tous, noms.join(', ')||'import', ajouter);
  imp.msg=(ajouter?`➕ Ajouté à l'aperçu en cours :\n`:'')+msgs.join('\n')+(tous.length||ajouter||msgs.some(m=>/✅|↩️/.test(m))?'':'\nAucune consultation reconnue.');
  renderImport();
}

  const drop=document.getElementById('imp-drop'), file=document.getElementById('imp-file');

  document.getElementById('imp-vider').onclick=()=>{ if(confirm('Vider l\'aperçu ? (rien n\'a encore été importé)')){ imp={rows:null, source:'', annee:imp.annee, msg:'', majCols:imp.majCols}; renderImport(); } };

  document.getElementById('imp-go').onclick=()=>{

    let nU=0, nC=0, nS=0, nP=0, nA=0;
    const an=imp.analyse||''; // import « PMB » ou « Somnum » : analyse notée sur les consultations ajoutées ou complétées
    // Lignes NON cochées mais correspondant à une consultation déjà présente : on complète quand même ses cases vides
    for(const r of R.filter(r=>!r.sel && r.nom && !(r._nox&&r.maj) && r._agenda!=='suivi' && !r._presta)){
      const ex=r._agenda==='bleu'?null:existante(r);
      const cible=ex || (r.connu && rowsOf(r).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]);
      if(!cible) continue;
      const champs=ex?['date','iah','info','traitement','prestataire','commentaire','adresseur']:['traitement','prestataire','adresseur'];
      let fait=false; for(const f of champs) if(!cible[f] && r[f]){ cible[f]=r[f]; fait=true; }
      if(fait) nC++;
    }
    for(const r of R.filter(r=>r.sel && r.nom)){
      if(r._nox && r.maj){
        const c=state.consults.find(x=>x.id===r.maj); if(!c) continue;
        let fait=false; for(const x of changesNox(r,c)) if(imp.majCols[x.f]){ c[x.f]=x.a; fait=true; }
        if(an && !c.analyse){ c.analyse=an; fait=true; }
        if(fait) nU++; continue;
      }
      if(r._presta){ nP++; appliquerPresta(r); continue; }
      // fiche de rendez-vous Doctolib : médecin adresseur noté sur la consultation du patient (celle du jour si possible)
      if(r._adr){
        // téléphone et date de naissance lus dans Doctolib -> fiche du patient (sans écraser ce qui existe)
        if(r._adr.tel || r._adr.ddn){ const o=rdvInfo(patientKey({nom:r.nom.toUpperCase(),prenom:r.prenom})); if(r._adr.tel && !o.tel) o.tel=r._adr.tel; if(r._adr.ddn && !o.ddn) o.ddn=r._adr.ddn; }
        const l=rowsOf(r), c=l.find(x=>x.date===r.date) || l.sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
        if(c){ c.adresseur=formaterAdresseur(r.adresseur)||c.adresseur; if(r._adr.detail) c.adresseurDetail=r._adr.detail; if(!c.date && r.date) c.date=r.date; nA++; }
        else { // nouveau patient : « Rien de fait » (test du sommeil), ou « Terminé » + Doctolib pour une annonce de résultats (bleu clair)
          state.consults.push({id:uid(), date:r.date, nom:r.nom.toUpperCase(), prenom:r.prenom, iah:'', info:r.info||'', statut:r.statut||'rien', traitement:'', prestataire:'', commentaire:r.commentaire||'', adresseur:formaterAdresseur(r.adresseur), adresseurDetail:r._adr.detail||'', ...(an?{analyse:an}:{})});
          if(r._adr.couleur==='bleu') noterRdv(patientKey({nom:r.nom.toUpperCase(),prenom:r.prenom}),'annonce',r.date);
          nN++; }
        continue;
      }
      // lecture Doctolib : téléphone et date de naissance du panneau (sans écraser), médecin adresseur
      if(r._doc){ const o=rdvInfo(patientKey({nom:r.nom.toUpperCase(),prenom:r.prenom})); if(r._doc.tel && !o.tel) o.tel=r._doc.tel; if(r._doc.ddn && !o.ddn) o.ddn=r._doc.ddn; }
      const maj=(r._agenda==='bleu'||r._agenda==='suivi') && rowsOf(r).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
      if(maj && r.adresseur && !maj.adresseur){ maj.adresseur=formaterAdresseur(r.adresseur); if(r._doc&&r._doc.detail) maj.adresseurDetail=r._doc.detail; }
      if(maj && r._agenda==='suivi'){ r.suiviType||r._motif ? noterSuivi(patientKey(maj), r) : noterRdv(patientKey(maj),'suivi',r.date); nS++; continue; }
      if(maj){ maj.statut='termine'; maj.info='Doctolib'; for(const f of ['iah','traitement','prestataire','commentaire','date']) if(!maj[f] && r[f]) maj[f]=r[f]; if(an && !maj.analyse) maj.analyse=an; noterRdv(patientKey(maj),'annonce',r.date); nM++; continue; }
      if(r._agenda==='bleu') noterRdv(patientKey({nom:r.nom.toUpperCase(),prenom:r.prenom}),'annonce',r.date);
      if(r._agenda==='suivi'){ const kk=patientKey({nom:r.nom.toUpperCase(),prenom:r.prenom}); r.suiviType||r._motif ? noterSuivi(kk, r) : noterRdv(kk,'suivi',r.date); }
      const ex=r._agenda==='bleu'?null:existante(r); // recalculé ligne par ligne : un doublon interne à l'import complète la ligne déjà ajoutée
      if(ex){
        for(const f of ['iah','traitement','prestataire','commentaire','date','info']) if(!ex[f] && r[f]) ex[f]=r[f];
        if((RANG[r.statut]||0)>(RANG[ex.statut||'rien']||0)) ex.statut=r.statut;
        if((an||r._analyse) && !ex.analyse) ex.analyse=an||r._analyse;
        if(r.adresseur && !ex.adresseur) ex.adresseur=formaterAdresseur(r.adresseur);
        nM++;
      } else {
        state.consults.push({id:uid(), date:r.date, nom:r.nom.toUpperCase(), prenom:r.prenom, iah:r.iah, info:r.info||'', statut:r.statut, traitement:r.traitement, prestataire:r.traitement==='PPC'?r.prestataire:'', commentaire:r.commentaire, ...((an||r._analyse)?{analyse:an||r._analyse}:{}), ...(r.adresseur?{adresseur:formaterAdresseur(r.adresseur)}:{})});
        nN++;
      }
    }
    save();
    importLog={done:true, lines:[`✅ ${nN} consultation(s) ajoutée(s), ${nM} complétée(s)${nU?`, ${nU} mise(s) à jour`:''}${nS?`, ${nS} date(s) de suivi notée(s) (page Patients PPC)`:''}${nP?`, ${nP} patient(s) PPC du prestataire ajouté(s) ou mis à jour`:''}${nA?`, ${nA} médecin(s) adresseur(s) noté(s)`:''}${nC?`, ${nC} doublon(s) non importé(s) mais complété(s) (date, IAH… manquants)`:''} depuis « ${esc(imp.source)} ».`]};
    imp={rows:null, source:'', annee:imp.annee, msg:'', analyse:imp.analyse};
    location.hash='consultations';
  };
}

let importLog=null;
function importLogHTML(){
  if(!importLog) return '';
  return `<div class="card importlog"><div class="toolbar" style="margin:0"><b>${importLog.done?'Import terminé':'Import en cours…'}</b><div class="spacer"></div>${importLog.done?'<button class="small" id="log-close">Fermer</button>':''}</div>
    ${importLog.done?'':`<div class="progress" style="display:block"><div style="width:${Math.round(importLog.p*100)}%"></div></div><div class="hint">${esc(importLog.label||'')}</div>`}
    <ul>${importLog.lines.map(l=>`<li>${l}</li>`).join('')}</ul></div>`;
}
function bindImportLog(){ const b=document.getElementById('log-close'); if(b) b.onclick=()=>{ importLog=null; render(); }; }
function refreshLog(){ const el=document.querySelector('.importlog'); if(el) el.outerHTML=importLogHTML(); }

async function importFiles(files, opts={}){
  files=[...files];
  const mail=files.find(f=>/\.(eml|msg)$/i.test(f.name||'')||f.type==='message/rfc822');
  if(mail){ traiterEmail(mail); return; }
  const textes=files.filter(isTexte);
  if(textes.length){ location.hash='import'; impCharger(textes); return; }
  files=files.filter(f=>isPdf(f)||isImage(f));
  if(!files.length || (importLog&&!importLog.done)) return;
  importLog={done:false,p:0,lines:[]}; render();
  let listeConsult=null; const listesPresta=[];
  for(const [i,f] of files.entries()){
    try{
      const text=await fileToText(f,(label,p)=>{ importLog.label=`${f.name||'capture'} — ${label}`; importLog.p=(i+(p||0))/files.length; refreshLog(); });
      const type=classify(text);
      if(opts.dap || estDAP(text)) importLog.lines.push(await importerDAP(text, f));
      else if(type==='poly') importLog.lines.push(await importerPoly(text, f));
      else if(type==='oxycapno') importLog.lines.push(rangerDocument(text, f.name||'capture', {consult:[], cible:null}));
      // listes Bastide / Helli Santé en capture : aperçu de la page d'import (ajout des patients + IAH sous PPC)
      // capture d'un tableau de consultations : lue par la page d'import (relecture des IAH et des cases colorées)
      else if(type==='consultliste' && isImage(f)){ listesPresta.push(f); importLog.lines.push(`📋 ${esc(f.name||'capture')} : tableau de consultations → vérifiez l'aperçu puis validez.`); }
      else if((type==='ppcliste'||type==='bastide') && isImage(f)){ listesPresta.push(f); importLog.lines.push(`🏥 ${esc(f.name||'capture')} : liste ${type==='bastide'?'Bastide':'Helli Santé'} → vérifiez l'aperçu puis validez.`); }
      else if(type==='ppcliste') importLog.lines.push(...applyListePPC(parseListePPC(text), f.name||'capture'));
      else if(type==='consultliste'){ listeConsult={text, name:f.name||'capture d\'écran'}; importLog.lines.push(`📋 ${esc(listeConsult.name)} : liste de consultations → vérifiez l'aperçu puis validez.`); }
      else { // rapport PPC : valeurs dans la fiche PPC + fichier rangé dans les documents du patient
        const r=parseObservance(text); importLog.lines.push(applyObs(r, f.name||'capture'));
        const c=r.cid && state.consults.find(x=>x.id===r.cid); if(c) await attacherDoc(c, 'ppc', f, r.date);
      }
    }catch(e){ console.error(e); importLog.lines.push(`❌ ${esc(f.name||'capture')} : erreur de lecture (${esc(e.message||e)}). Une connexion internet est nécessaire au premier usage.`); }
    save(); importLog.p=(i+1)/files.length; refreshLog();
  }
  importLog.done=true;
  if(listesPresta.length){ location.hash='import'; impCharger(listesPresta); return; }
  if(listeConsult){ const y=listeConsult.name.match(/\b(20\d{2})\b/); if(y) imp.annee=+y[1]; impSetRows(lignesVersConsultations(listeConsult.text,imp.annee), listeConsult.name); }
  else render();
}
/* ============ Comptes rendus de polygraphie : aperçu de la 1re page + PDF ============ */
// Rangés dans la base du navigateur (IndexedDB) : trop volumineux pour le stockage habituel.
// Clés : « <id consultation>:img » (aperçu JPEG) et « <id consultation>:pdf » (fichier complet)
const DocsCR={
  db:null,
  ouvrir(){ return this.db||(this.db=new Promise((ok,ko)=>{ const r=indexedDB.open('suiviSommeil_docs',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('docs'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); })); },
  async op(mode, f){ const db=await this.ouvrir(); return new Promise((ok,ko)=>{ const t=db.transaction('docs',mode), st=t.objectStore('docs'), req=f(st);
    t.oncomplete=()=>ok(req&&req.result); t.onerror=()=>ko(t.error); }); },
  put(k,v){ return this.op('readwrite',st=>st.put(v,k)); },
  get(k){ return this.op('readonly',st=>st.get(k)); },
  del(k){ return this.op('readwrite',st=>st.delete(k)); },
};
// Image de la 1re page d'un PDF (JPEG, ~1100 px de large)
async function apercuPage1(file){
  const lib=await loadPdfJs();
  // disableFontFace : polices dessinées en tracés (le chargement des polices du PDF peut prendre plusieurs secondes)
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), disableFontFace:true}).promise, page=await pdf.getPage(1);
  const v0=page.getViewport({scale:1}), vp=page.getViewport({scale:Math.min(2.5,1100/v0.width)});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:g, viewport:vp}).promise;
  pdf.destroy();
  return new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));
}
// Attache le compte rendu (PDF) à une consultation
// (le PDF est toujours enregistré ; si l'onglet est en arrière-plan, le navigateur suspend le dessin de la page :
//  l'aperçu est alors fabriqué à la première ouverture)
// (fichier venant du dossier surveillé : on garde un lien vers le fichier plutôt qu'une copie du PDF)
async function attacherCR(c, file, lien){
  try{
    if(lien) await DocsCR.put(c.id+':fh', lien); else await DocsCR.put(c.id+':pdf', file);
    c.cr={nom:file.name||'compte rendu.pdf', ajoute:today()}; save();
    // onglet en arrière-plan : pas d'attente, l'aperçu sera fabriqué à la première ouverture
    const img=document.hidden ? null : await Promise.race([apercuPage1(file).catch(()=>null), new Promise(ok=>setTimeout(()=>ok(null),12000))]);
    if(img) await DocsCR.put(c.id+':img', img);
    return true;
  }catch(e){ console.error(e); return false; }
}
async function copierCR(de, vers){
  for(const s of [':img',':pdf',':fh']){ const v=await DocsCR.get(de+s); if(v) await DocsCR.put(vers+s, v); }
}
/* ============ Documents du patient (colonne « Documents ») ============ */
// Le compte rendu Nox reste dans c.cr ; les autres documents dans c.docs = [{id, type, nom, date, ajoute, taille}]
// Fichiers dans la base du navigateur : « doc:<id>:pdf » (fichier) et « doc:<id>:img » (aperçu de la 1re page).
const DOC_TYPES={
  cr:{ic:'📄', lib:'Compte rendu de polygraphie (Nox)', coul:'#7a55c9'},
  ppc:{ic:'💨', lib:'Rapport PPC', coul:'#2e8b3e'},
  dap:{ic:'🛡️', lib:'DAP — demande d\'accord préalable', coul:'#1971c2'},
  autre:{ic:'📎', lib:'Document', coul:'#8a8f9c'}};
// Tous les documents d'un patient (toutes ses consultations), du plus récent au plus ancien
function documentsParPatient(){
  const m=new Map();
  for(const c of state.consults){ const k=patientKey(c), l=m.get(k)||[];
    if(c.cr) l.push({c, d:null, type:'cr', nom:c.cr.nom, date:(c.poly&&c.poly.date)||c.date||c.cr.ajoute||''});
    for(const d of c.docs||[]) l.push({c, d, type:d.type, nom:d.nom, date:d.date||d.ajoute||''});
    m.set(k,l); }
  m.forEach(l=>l.sort((a,b)=>(b.date||'').localeCompare(a.date||'')));
  return m;
}
function iconesDocs(c, par){
  const l=(par||documentsParPatient()).get(patientKey(c))||[];
  if(!l.length) return c.poly?`<span class="cr-btn cr-info" title="${esc(polyResume(c))}">ⓘ</span>`:'';
  return l.map(x=>{ const t=DOC_TYPES[x.type]||DOC_TYPES.autre;
    return `<button class="doc-ic" style="--dc:${t.coul}" data-doc="${esc(x.c.id)}|${esc(x.d?x.d.id:'cr')}" title="${esc([t.lib+(x.date?' du '+fmtDate(x.date):''), x.nom, x.type==='cr'?polyResume(x.c):''].filter(Boolean).join('\n'))}">${t.ic}</button>`; }).join('');
}
function bindIconesDocs(racine){
  racine.querySelectorAll('[data-doc]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const [cid,did]=b.dataset.doc.split('|'), c=state.consults.find(x=>x.id===cid); if(!c) return;
    if(did==='cr') ouvrirCR(c); else { const d=(c.docs||[]).find(x=>x.id===did); if(d) ouvrirCR(c, d); } });
}
// Range un fichier (PDF ou image) parmi les documents du patient ; le même fichier n'est pas ajouté deux fois
async function attacherDoc(c, type, file, date){
  if((c.docs||[]).some(d=>d.type===type && d.nom===(file.name||'') && d.taille===file.size)) return false;
  const id=uid();

}
// Patients du tableau dont le nom ET le prénom apparaissent dans le texte d'un document
function patientsDansTexte(text){
  const n=' '+normText(text||'').replace(/[^a-z0-9]+/g,' ')+' ', vus=new Map();
  const mots=s=>normText(s||'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(w=>w.length>=2);
  for(const c of state.consults){ if(!c.nom || estNonPatient(c.nom, c.prenom)) continue; const k=patientKey(c);
    const mn=mots(c.nom), mp=mots(c.prenom);
    if(!mn.length || !mn.every(w=>n.includes(' '+w+' ')) || (mp.length && !n.includes(' '+mp[0]+' '))) continue;
    const a=vus.get(k); if(!a || (c.date||'')>(a.date||'')) vus.set(k,c); }
  return [...vus.values()];
}
